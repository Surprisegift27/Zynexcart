<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZynexCart - Working Demo</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F2C59', // Zynex Blue
                        secondary: '#FF6B00', // Zynex Orange
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: visible !important; }
    </style>
</head>
<body class="text-gray-800 relative">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="resetFilters()">
                    <span class="text-3xl font-extrabold text-primary tracking-tighter">Zynex<span class="text-secondary italic">Cart</span></span>
                </div>

                <!-- Search Bar -->
                <div class="hidden md:flex flex-1 max-w-lg mx-8 relative">
                    <input type="text" id="searchInput" placeholder='Search for "Milk", "Bread"...' 
                           class="w-full pl-10 pr-4 py-2.5 bg-gray-100 border-none rounded-full focus:ring-2 focus:ring-secondary focus:bg-white transition-all outline-none">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                </div>

                <!-- Right Actions -->
                <div class="flex items-center gap-6">
                    <!-- Profile Button -->
                    <button onclick="toggleModal('loginModal')" class="flex flex-col items-center text-primary hover:text-secondary transition">
                        <i class="fa-regular fa-user text-xl"></i>
                        <span class="text-xs font-semibold">Login</span>
                    </button>

                    <!-- Cart Button -->
                    <button onclick="toggleModal('cartModal')" class="relative flex flex-col items-center text-primary hover:text-secondary transition">
                        <div class="relative">
                            <i class="fa-solid fa-cart-shopping text-xl"></i>
                            <span id="cartBadge" class="absolute -top-2 -right-2 bg-secondary text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full hidden">0</span>
                        </div>
                        <span class="text-xs font-semibold">My Cart</span>
                    </button>
                </div>
            </div>
            
            <!-- Mobile Search (Visible only on small screens) -->
            <div class="md:hidden pb-4">
                <input type="text" id="mobileSearchInput" placeholder='Search products...' 
                       class="w-full pl-4 pr-4 py-2 bg-gray-100 rounded-lg outline-none border border-transparent focus:border-secondary">
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Categories Section -->
        <section class="mb-10">
            <h2 class="text-xl font-bold text-primary mb-4">Shop by Category</h2>
            <div class="flex gap-4 overflow-x-auto hide-scrollbar pb-2" id="categoryContainer">
                <!-- Categories injected via JS -->
            </div>
        </section>

        <!-- Products Grid -->
        <section>
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-primary" id="gridTitle">All Products</h2>
                <span id="resultCount" class="text-sm text-gray-500"></span>
            </div>
            
            <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- Products injected via JS -->
            </div>
            
            <!-- Empty State (Hidden by default) -->
            <div id="emptyState" class="hidden text-center py-20">
                <i class="fa-solid fa-basket-shopping text-6xl text-gray-200 mb-4"></i>
                <p class="text-gray-500 text-lg">No products found matching your search.</p>
                <button onclick="resetFilters()" class="mt-4 text-secondary font-bold hover:underline">Clear Filters</button>
            </div>
        </section>
    </main>

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50" onclick="toggleModal('loginModal')"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-xl shadow-2xl z-50 overflow-y-auto p-6 relative">
            <button onclick="toggleModal('loginModal')" class="absolute top-4 right-4 text-gray-500 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            
            <h3 class="text-2xl font-bold text-primary mb-2 text-center">Welcome Back!</h3>
            <p class="text-gray-500 text-center mb-6 text-sm">Login to access your orders and saved addresses.</p>
            
            <form onsubmit="event.preventDefault(); alert('Logged in successfully!'); toggleModal('loginModal');" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                    <input type="tel" placeholder="+91 98765 43210" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary outline-none">
                </div>
                <button type="submit" class="w-full bg-secondary text-white font-bold py-3 rounded-lg hover:bg-orange-600 transition">Continue</button>
            </form>
        </div>
    </div>

    <!-- CART MODAL -->
    <div id="cartModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50" onclick="toggleModal('cartModal')"></div>
        <div class="modal-container bg-white w-full md:max-w-lg mx-auto rounded-xl shadow-2xl z-50 overflow-hidden flex flex-col max-h-[80vh]">
            
            <!-- Cart Header -->
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-primary">My Cart (<span id="cartTotalItems">0</span>)</h3>
                <button onclick="toggleModal('cartModal')" class="text-gray-500 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <!-- Cart Items Area -->
            <div id="cartItemsContainer" class="p-4 overflow-y-auto flex-1 space-y-4">
                <!-- Cart items injected here -->
                <div class="text-center py-10 text-gray-400">Your cart is empty</div>
            </div>

            <!-- Cart Footer -->
            <div class="p-4 border-t bg-gray-50">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold text-gray-600">Grand Total</span>
                    <span class="font-bold text-xl text-primary" id="cartGrandTotal">₹0</span>
                </div>
                <button onclick="alert('Proceeding to checkout...')" class="w-full bg-primary text-white font-bold py-3 rounded-lg hover:bg-blue-900 transition">Checkout</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- DATA ---
        const categories = [
            { id: 'all', name: 'All', icon: 'fa-layer-group' },
            { id: 'fruits', name: 'Fruits', icon: 'fa-apple-whole' },
            { id: 'dairy', name: 'Dairy', icon: 'fa-cow' },
            { id: 'bakery', name: 'Bakery', icon: 'fa-bread-slice' },
            { id: 'snacks', name: 'Snacks', icon: 'fa-cookie-bite' },
            { id: 'beverages', name: 'Drinks', icon: 'fa-bottle-water' }
        ];

        const products = [
            { id: 1, name: 'Amul Taaza Milk', category: 'dairy', price: 27, weight: '500ml', emoji: '🥛' },
            { id: 2, name: 'Harvest Gold Bread', category: 'bakery', price: 45, weight: '400g', emoji: '🍞' },
            { id: 3, name: 'Red Apple', category: 'fruits', price: 120, weight: '1kg', emoji: '🍎' },
            { id: 4, name: 'Lays Classic', category: 'snacks', price: 20, weight: '50g', emoji: '🥔' },
            { id: 5, name: 'Coca Cola', category: 'beverages', price: 40, weight: '750ml', emoji: '' },
            { id: 6, name: 'Farm Eggs', category: 'dairy', price: 65, weight: '6pcs', emoji: '🥚' },
            { id: 7, name: 'Banana', category: 'fruits', price: 40, weight: '1 Dozen', emoji: '🍌' },
            { id: 8, name: 'Croissant', category: 'bakery', price: 35, weight: '1pc', emoji: '🥐' },
            { id: 9, name: 'Orange Juice', category: 'beverages', price: 90, weight: '1L', emoji: '🍊' },
            { id: 10, name: 'Potato Chips', category: 'snacks', price: 20, weight: '50g', emoji: '🍟' },
        ];

        let cart = {}; // Object to store cart items: { productId: quantity }
        let activeCategory = 'all';
        let searchQuery = '';

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            renderProducts();
            setupEventListeners();
        });

        // --- RENDER FUNCTIONS ---
        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = categories.map(cat => `
                <div onclick="setCategory('${cat.id}')" 
                     class="flex flex-col items-center min-w-[80px] cursor-pointer group">
                    <div class="w-16 h-16 rounded-full flex items-center justify-center text-2xl mb-2 transition-all duration-300 
                                ${activeCategory === cat.id ? 'bg-secondary text-white shadow-lg scale-110' : 'bg-white text-primary border border-gray-200 group-hover:border-secondary'}">
                        <i class="fa-solid ${cat.icon}"></i>
                    </div>
                    <span class="text-sm font-semibold ${activeCategory === cat.id ? 'text-secondary' : 'text-gray-600'}">${cat.name}</span>
                </div>
            `).join('');
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const emptyState = document.getElementById('emptyState');
            const resultCount = document.getElementById('resultCount');
            
            // Filter Logic
            const filtered = products.filter(p => {
                const matchCat = activeCategory === 'all' || p.category === activeCategory;
                const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            resultCount.innerText = `${filtered.length} items`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            
            grid.innerHTML = filtered.map(p => {
                const qty = cart[p.id] || 0;
                return `
                <div class="bg-white rounded-xl border border-gray-100 p-4 hover:shadow-lg transition-shadow duration-300 flex flex-col h-full">
                    <div class="h-32 flex items-center justify-center text-6xl mb-4 bg-gray-50 rounded-lg">
                        ${p.emoji}
                    </div>
                    <h3 class="font-bold text-gray-800 text-lg leading-tight mb-1">${p.name}</h3>
                    <p class="text-xs text-gray-500 mb-4">${p.weight}</p>
                    
                    <div class="mt-auto flex justify-between items-center">
                        <span class="font-bold text-lg text-gray-900">₹${p.price}</span>
                        
                        ${qty === 0 ? `
                            <button onclick="updateCart(${p.id}, 1)" 
                                    class="bg-white border border-primary text-primary font-bold px-6 py-1.5 rounded-lg hover:bg-primary hover:text-white transition uppercase text-sm">
                                Add
                            </button>
                        ` : `
                            <div class="flex items-center bg-primary rounded-lg overflow-hidden">
                                <button onclick="updateCart(${p.id}, -1)" class="text-white px-3 py-1.5 hover:bg-blue-800">-</button>
                                <span class="text-white font-bold text-sm px-2">${qty}</span>
                                <button onclick="updateCart(${p.id}, 1)" class="text-white px-3 py-1.5 hover:bg-blue-800">+</button>
                            </div>
                        `}
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderCartItems() {
            const container = document.getElementById('cartItemsContainer');
            const totalItemsEl = document.getElementById('cartTotalItems');
            const grandTotalEl = document.getElementById('cartGrandTotal');
            
            const cartIds = Object.keys(cart);
            let totalQty = 0;
            let totalPrice = 0;

            if (cartIds.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-400 flex flex-col items-center"><i class="fa-solid fa-cart-arrow-down text-4xl mb-3"></i>Your cart is empty</div>';
                totalItemsEl.innerText = '0';
                grandTotalEl.innerText = '₹0';
                document.getElementById('cartBadge').classList.add('hidden');
                return;
            }

            let html = '';
            cartIds.forEach(id => {
                const product = products.find(p => p.id == id);
                const qty = cart[id];
                const itemTotal = product.price * qty;
                
                totalQty += qty;
                totalPrice += itemTotal;

                html += `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
                    <div class="flex items-center gap-3">
                        <div class="text-2xl">${product.emoji}</div>
                        <div>
                            <h4 class="font-bold text-sm text-gray-800">${product.name}</h4>
                            <p class="text-xs text-gray-500">₹${product.price} x ${qty}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-primary">₹${itemTotal}</span>
                        <div class="flex items-center bg-white border rounded-md">
                            <button onclick="updateCart(${product.id}, -1)" class="px-2 py-1 text-gray-600 hover:text-red-500">-</button>
                            <span class="text-xs font-bold px-1">${qty}</span>
                            <button onclick="updateCart(${product.id}, 1)" class="px-2 py-1 text-gray-600 hover:text-green-500">+</button>
                        </div>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
            totalItemsEl.innerText = totalQty;
            grandTotalEl.innerText = `₹${totalPrice}`;
            
            // Update Badge
            const badge = document.getElementById('cartBadge');
            badge.innerText = totalQty;
            badge.classList.remove('hidden');
        }

        // --- ACTIONS ---
        function setCategory(id) {
            activeCategory = id;
            document.getElementById('gridTitle').innerText = id === 'all' ? 'All Products' : categories.find(c => c.id === id).name;
            renderCategories(); // Re-render to update active styling
            renderProducts();
        }

        function resetFilters() {
            activeCategory = 'all';
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('mobileSearchInput').value = '';
            document.getElementById('gridTitle').innerText = 'All Products';
            renderCategories();
            renderProducts();
        }

        function updateCart(productId, change) {
            if (!cart[productId]) cart[productId] = 0;
            cart[productId] += change;
            
            if (cart[productId] <= 0) {
                delete cart[productId];
            }
            
            // Refresh UI
            renderProducts(); // To toggle Add button vs +/-
            renderCartItems(); // To update modal
            
            // Optional: Small animation feedback could go here
        }

        function setupEventListeners() {
            // Desktop Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderProducts();
            });
            
            // Mobile Search
            document.getElementById('mobileSearchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderProducts();
            });
        }

        // --- MODAL UTILS ---
        function toggleModal(modalID){
            const modal = document.getElementById(modalID);
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
            
            // If opening cart, refresh it
            if(modalID === 'cartModal' && !modal.classList.contains('opacity-0')) {
                renderCartItems();
            }
        }
    </script>
</body>
</html>
