<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZynexCart — Shop Smart, Live Better</title>
<meta name="description" content="ZynexCart — Quality products, great deals and a simple shopping experience.">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#f7f8fb;color:#172033}
button,input{font:inherit}
button{cursor:pointer;border:0}
a{text-decoration:none;color:inherit}

:root{
  --navy:#0b132b;
  --orange:#ff6b00;
  --light:#f7f8fb;
  --border:#e5e7eb;
  --muted:#64748b;
  --green:#16a34a;
}

/* TOP */
.top-bar{
  background:var(--navy);
  color:#fff;
  text-align:center;
  padding:8px 12px;
  font-size:12px
}

/* HEADER */
header{
  background:#fff;
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid var(--border)
}
.header-main{
  max-width:1250px;
  margin:auto;
  padding:13px 18px;
  display:flex;
  align-items:center;
  gap:22px
}
.logo{min-width:190px}
.logo-name{
  font-size:27px;
  font-weight:900;
  color:var(--navy)
}
.logo-name span{color:var(--orange)}
.tagline{font-size:10px;color:var(--muted);margin-top:2px}

.search-box{
  flex:1;
  height:46px;
  display:flex;
  background:#f1f5f9;
  border:1px solid #e2e8f0;
  border-radius:9px;
  overflow:hidden
}
.search-box input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  padding:0 15px;
  font-size:14px
}
.search-box button{
  width:52px;
  background:var(--orange);
  color:white;
  font-size:18px
}

.header-actions{
  display:flex;
  gap:17px;
  align-items:center
}
.action{
  text-align:center;
  font-size:11px;
  color:#334155;
  position:relative;
  min-width:42px
}
.action-icon{display:block;font-size:21px;margin-bottom:2px}
.cart-count{
  position:absolute;
  top:-5px;
  right:1px;
  background:var(--orange);
  color:white;
  width:18px;
  height:18px;
  border-radius:50%;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold
}

/* NAV */
nav{background:var(--navy);color:white}
.nav-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  gap:28px;
  padding:11px 18px;
  font-size:13px;
  overflow-x:auto;
  white-space:nowrap
}
.nav-inner a:hover{color:#ff9b50}

/* MAIN */
.container{max-width:1250px;margin:auto;padding:0 18px}

/* HERO */
.hero{padding:18px 0}
.hero-card{
  min-height:350px;
  border-radius:18px;
  background:linear-gradient(120deg,#0b132b,#172554);
  color:white;
  padding:48px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center
}
.hero-content{max-width:620px;position:relative;z-index:2}
.hero-small{
  color:#ff9b50;
  font-size:13px;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin-bottom:13px
}
.hero h1{font-size:47px;line-height:1.08;margin-bottom:16px}
.hero h1 span{color:#ff7a1a}
.hero p{
  color:#dbe4f0;
  font-size:15px;
  line-height:1.7;
  margin-bottom:25px
}
.hero-btn{
  display:inline-block;
  background:var(--orange);
  color:white;
  padding:13px 23px;
  border-radius:8px;
  font-weight:bold;
  font-size:14px
}
.hero-shape{
  position:absolute;
  right:-100px;
  width:470px;
  height:470px;
  border-radius:50%;
  background:rgba(255,107,0,.13)
}

/* SECTION */
.section{padding:30px 0}
.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px
}
.section-heading h2{font-size:22px}
.view-all{
  color:var(--orange);
  font-weight:bold;
  font-size:13px;
  cursor:pointer
}

/* CATEGORY */
.categories{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px
}
.category{
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 8px;
  text-align:center;
  transition:.2s;
  cursor:pointer
}
.category:hover{
  transform:translateY(-3px);
  border-color:var(--orange);
  box-shadow:0 8px 20px rgba(0,0,0,.06)
}
.category-icon{font-size:32px;margin-bottom:8px}
.category h3{font-size:13px}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px
}
.product{
