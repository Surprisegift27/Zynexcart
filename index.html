<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ZynexCart — Shop Smart, Live Better. Trendy products, best quality and fast delivery.">
<meta name="theme-color" content="#071b3a">
<title>ZynexCart — Shop Smart, Live Better</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --navy:#071b3a;
  --blue:#0d2d5f;
  --blue2:#164b91;
  --orange:#ff7a00;
  --orange2:#ff941f;
  --light:#f5f7fb;
  --text:#172033;
  --muted:#667085;
  --white:#fff;
  --border:#e5e7eb;
  --green:#16a34a;
  --red:#dc2626;
  --shadow:0 8px 30px rgba(7,27,58,.08);
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text);
  line-height:1.5;
  padding-bottom:0;
}

body.no-scroll{
  overflow:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(1200px,92%);
  margin:auto;
}

/* TOP BAR */

.topbar{
  background:var(--navy);
  color:#fff;
  text-align:center;
  padding:8px 10px;
  font-size:13px;
}

/* HEADER */

header{
  background:#fff;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.nav{
  min-height:72px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:26px;
  font-weight:900;
  color:var(--navy);
  white-space:nowrap;
}

.logo span{
  color:var(--orange);
}

.search{
  flex:1;
  display:flex;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:#fff;
}

.search input{
  width:100%;
  padding:13px 15px;
  border:0;
  outline:0;
  font-size:14px;
}

.search button{
  background:var(--orange);
  color:#fff;
  padding:0 20px;
  font-weight:800;
}

.search button:hover{
  background:#e96900;
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.nav-btn{
  position:relative;
  background:#fff;
  border:1px solid var(--border);
  color:var(--navy);
  padding:10px 12px;
  border-radius:9px;
  font-weight:700;
}

.nav-btn:hover{
  border-color:var(--orange);
}

.cart-btn{
  position:relative;
}

.badge{
  position:absolute;
  right:-6px;
  top:-8px;
  background:var(--orange);
  color:#fff;
  min-width:21px;
  height:21px;
  padding:0 5px;
  border-radius:99px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:11px;
}

/* HERO */

.hero{
  background:
    radial-gradient(circle at 80% 20%,rgba(255,122,0,.18),transparent 30%),
    linear-gradient(135deg,var(--navy),#103b76);
  color:#fff;
  padding:62px 0;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.4fr .9fr;
  gap:35px;
  align-items:center;
}

.hero small{
  display:inline-block;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  padding:7px 12px;
  border-radius:50px;
  margin-bottom:16px;
}

.hero h1{
  font-size:clamp(38px,6vw,64px);
  line-height:1.02;
  margin-bottom:18px;
}

.hero h1 span{
  color:#ff9b3d;
}

.hero p{
  color:#dbe7f7;
  font-size:18px;
  margin-bottom:25px;
}

.hero-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 19px;
  border-radius:9px;
  font-weight:800;
}

.btn-orange{
  background:var(--orange);
  color:#fff;
}

.btn-orange:hover{
  background:#e96900;
}

.btn-white{
  background:#fff;
  color:var(--navy);
}

.hero-card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  padding:25px;
  backdrop-filter:blur(8px);
}

.hero-card-title{
  font-size:14px;
  color:#c9d8eb;
  margin-bottom:4px;
}

.hero-card strong{
  display:block;
  font-size:36px;
  margin-bottom:10px;
}

.hero-feature{
  padding:13px 0;
  border-top:1px solid rgba(255,255,255,.12);
}

/* TRUST */

.trust{
  background:#fff;
  border-bottom:1px solid var(--border);
}

.trust-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  padding:18px 0;
}

.trust-item{
  display:flex;
  align-items:center;
  gap:10px;
}

.trust-icon{
  width:42px;
  height:42px;
  border-radius:10px;
  background:#fff3e8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.trust-item strong{
  display:block;
  color:var(--navy);
  font-size:13px;
}

.trust-item span{
  color:var(--muted);
  font-size:12px;
}

/* SECTION */

.section{
  padding:48px 0;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;
  margin-bottom:23px;
}

.section h2{
  color:var(--navy);
  font-size:30px;
}

.section-head p{
  color:var(--muted);
  font-size:14px;
}

/* CATEGORIES */

.categories{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:13px;
}

.category{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:18px 10px;
  text-align:center;
  color:var(--navy);
  font-weight:800;
  transition:.2s;
}

.category:hover,
.category.active{
  border-color:var(--orange);
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.cat-icon{
  font-size:32px;
  margin-bottom:7px;
}

/* FILTER BAR */

.filter-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:#fff;
  border:1px solid var(--border);
  padding:12px;
  border-radius:11px;
  margin-bottom:20px;
}

.filter-left{
  color:var(--muted);
  font-size:14px;
}

.filter-right{
  display:flex;
  gap:8px;
  align-items:center;
}

.filter-right select{
  border:1px solid var(--border);
  padding:9px 12px;
  border-radius:8px;
  outline:0;
  color:var(--navy);
  background:#fff;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  position:relative;
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.product-img{
  height:205px;
  position:relative;
  background:linear-gradient(135deg,#edf2fa,#fff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:80px;
}

.discount{
  position:absolute;
  top:10px;
  left:10px;
  background:#fff0e5;
  color:var(--orange);
  padding:5px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:900;
}

.wish{
  position:absolute;
  top:9px;
  right:9px;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
  font-size:18px;
  color:#555;
}

.wish.active{
  color:#e11d48;
}

.product-info{
  padding:15px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.product-cat{
  font-size:11px;
  color:var(--orange);
  font-weight:900;
  text-transform:uppercase;
}

.product h3{
  font-size:16px;
  margin:5px 0 6px;
  color:var(--navy);
  line-height:1.3;
}

.rating{
  color:#f59e0b;
  font-size:13px;
  margin-bottom:8px;
}

.rating span{
  color:var(--muted);
  margin-left:4px;
}

.price-row{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:5px;
}

.price{
  color:var(--navy);
  font-size:20px;
  font-weight:900;
}

.old{
  color:#98a2b3;
  text-decoration:line-through;
  font-size:13px;
}

.save{
  color:var(--green);
  font-size:12px;
  font-weight:700;
}

.stock{
  color:var(--green);
  font-size:12px;
  margin:3px 0 12px;
  font-weight:700;
}

.product-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:auto;
}

.product-buttons button{
  padding:10px 6px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
}

.add{
  background:var(--orange);
  color:#fff;
}

.details{
  background:#eef3fa;
  color:var(--navy);
}

.empty{
  grid-column:1/-1;
  text-align:center;
  background:#fff;
  border:1px dashed var(--border);
  padding:45px;
  border-radius:12px;
  color:var(--muted);
}

/* DEAL */

.deal{
  background:linear-gradient(135deg,#fff1e5,#fff);
  border:1px solid #ffd8b5;
  border-radius:18px;
  padding:28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.deal h2{
  color:var(--navy);
  margin-bottom:6px;
}

.deal p{
  color:var(--muted);
}

/* NEWSLETTER */

.newsletter{
  background:#eaf1fb;
  padding:40px 0;
}

.news-wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:25px;
}

.news-wrap h2{
  color:var(--navy);
  margin-bottom:5px;
}

.news-wrap p{
  color:var(--muted);
}

.news-form{
  display:flex;
  gap:8px;
  min-width:420px;
}

.news-form input{
  padding:12px;
  border:1px solid var(--border);
  border-radius:8px;
  flex:1;
  outline:0;
  background:#fff;
}

.message{
  font-size:13px;
  margin-top:7px;
}

/* FOOTER */

footer{
  background:var(--navy);
  color:#dbe7f7;
  padding:45px 0 20px;
}

.footer-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:30px;
}

footer h3,
footer h4{
  color:#fff;
  margin-bottom:12px;
}

footer p,
footer li{
  font-size:14px;
  color:#aebed5;
}

footer ul{
  list-style:none;
}

footer li{
  margin:8px 0;
  cursor:pointer;
}

footer li:hover{
  color:#fff;
}

.copyright{
  border-top:1px solid rgba(255,255,255,.12);
  margin-top:30px;
  padding-top:18px;
  text-align:center;
  font-size:13px;
  color:#9fb0c9;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:90;
  display:none;
}

.overlay.show{
  display:block;
}

/* CART */

.drawer{
  position:fixed;
  right:-470px;
  top:0;
  height:100vh;
  width:min(470px,95vw);
  background:#fff;
  z-index:100;
  transition:.25s;
  display:flex;
  flex-direction:column;
  box-shadow:-8px 0 30px rgba(0,0,0,.15);
}

.drawer.open{
  right:0;
}

.drawer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  border-bottom:1px solid var(--border);
}

.drawer-head h2{
  color:var(--navy);
}

.close{
  background:#f1f3f5;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:21px;
  color:#333;
}

.cart-items{
  padding:15px;
  overflow:auto;
  flex:1;
}

.cart-item{
  display:grid;
  grid-template-columns:62px 1fr auto;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.cart-icon{
  width:62px;
  height:62px;
  border-radius:9px;
  background:#f3f5f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
}

.cart-item h4{
  font-size:14px;
  line-height:1.3;
}

.cart-price{
  color:var(--navy);
  font-weight:800;
  font-size:13px;
  margin-top:3px;
}

.qty{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
}

.qty button{
  width:27px;
  height:27px;
  border-radius:6px;
  background:#eef1f5;
  color:var(--navy);
  font-weight:900;
}

.remove{
  background:none!important;
  color:var(--red)!important;
  width:auto!important;
  padding:0 4px!important;
  font-size:12px!important;
}

.cart-summary{
  border-top:1px solid var(--border);
  padding:15px;
  box-shadow:0 -3px 15px rgba(0,0,0,.06);
}

.progress-box{
  background:#f6f8fb;
  padding:10px;
  border-radius:8px;
  margin-bottom:12px;
  font-size:12px;
  color:var(--muted);
}

.progress{
  height:7px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:7px;
}

.progress-bar{
  height:100%;
  background:var(--green);
  width:0%;
  transition:.3s;
}

.coupon{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}

.coupon input{
  flex:1;
  padding:10px;
  border:1px solid var(--border);
  border-radius:7px;
  outline:0;
  text-transform:uppercase;
}

.coupon button{
  background:var(--navy);
  color:#fff;
  padding:0 13px;
  border-radius:7px;
  font-weight:800;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:6px 0;
  color:#475467;
  font-size:14px;
}

.summary-row.discount-row{
  color:var(--green);
}

.total-row{
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:900;
  color:var(--navy);
  margin:12px 0;
  padding-top:10px;
  border-top:1px dashed var(--border);
}

.checkout-btn{
  width:100%;
  padding:13px;
  background:var(--orange);
  color:#fff;
  border-radius:9px;
  font-weight:900;
}

.checkout-btn:hover{
  background:#e96900;
}

/* MODAL */

.modal-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  z-index:120;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-wrap.show{
  display:flex;
}

.modal{
  width:min(600px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:16px;
  padding:23px;
  box-shadow:0 15px 50px rgba(0,0,0,.2);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-head h2{
  color:var(--navy);
}

/* PRODUCT DETAILS */

.detail-grid{
  display:grid;
  grid-template-columns:.85fr 1.15fr;
  gap:22px;
}

.detail-image{
  min-height:300px;
  background:linear-gradient(135deg,#edf2fa,#fff);
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:110px;
}

.detail-info h2{
  color:var(--navy);
  margin:6px 0;
}

.detail-desc{
  color:var(--muted);
  margin:12px 0;
  font-size:14px;
}

.detail-price{
  font-size:29px;
  font-weight:900;
  color:var(--navy);
}

.detail-old{
  text-decoration:line-through;
  color:#98a2b3;
  margin-left:8px;
}

.detail-stock{
  color:var(--green);
  font-weight:800;
  font-size:13px;
  margin:8px 0 15px;
}

.detail-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.detail-actions button{
  flex:1;
  padding:12px;
  border-radius:8px;
  font-weight:900;
}

.detail-add{
  background:var(--orange);
  color:#fff;
}

.detail-buy{
  background:var(--navy);
  color:#fff;
}

/* FORM */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:13px;
  font-weight:800;
  color:var(--navy);
}

.field input,
.field textarea,
.field select{
  padding:11px;
  border:1px solid var(--border);
  border-radius:8px;
  outline:0;
  background:#fff;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--orange);
}

.field textarea{
  min-height:80px;
  resize:vertical;
}

.error{
  color:var(--red);
  font-size:12px;
}

/* ORDER */

.order-success{
  text-align:center;
  padding:20px 5px;
}

.success-icon{
  font-size:65px;
}

.order-id{
  background:#f1f6ff;
  color:var(--navy);
  padding:13px;
  border-radius:9px;
  font-weight:900;
  margin:16px 0;
}

/* WISHLIST */

.wishlist-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.wish-item{
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  display:flex;
  gap:10px;
  align-items:center;
}

.wish-item-icon{
  width:55px;
  height:55px;
  background:#f3f5f8;
  border-radius:8px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
}

.wish-item-info{
  flex:1;
}

.wish-item-info strong{
  display:block;
  font-size:13px;
  color:var(--navy);
}

.wish-item-info span{
  color:var(--muted);
  font-size:12px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:var(--navy);
  color:#fff;
  padding:12px 18px;
  border-radius:9px;
  z-index:200;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  font-size:14px;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* MOBILE NAV */

.mobile-nav{
  display:none;
}

/* RESPONSIVE */

@media(max-width:950px){

  .nav{
    flex-wrap:wrap;
    gap:10px;
    padding:10px 0;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .nav-actions{
    margin-left:auto;
  }

  .nav-btn span{
    display:none;
  }

  .hero-grid{
    grid-template-columns:1fr;
  }

  .categories{
    grid-template-columns:repeat(3,1fr);
  }

  .products{
    grid-template-columns:repeat(3,1fr);
  }

  .trust-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .news-wrap{
    flex-direction:column;
    align-items:stretch;
  }

  .news-form{
    min-width:0;
  }

  .footer-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:650px){

  body{
    padding-bottom:62px;
  }

  .topbar{
    font-size:11px;
  }

  .logo{
    font-size:22px;
  }

  .nav-btn{
    padding:9px;
  }

  .hero{
    padding:42px 0;
  }

  .hero h1{
    font-size:42px;
  }

  .hero p{
    font-size:16px;
  }

  .trust-grid{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .trust-item{
    padding:5px 0;
