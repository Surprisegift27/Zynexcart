<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZynexCart - Professional Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Required for Real Auth) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#0F2C59', secondary: '#FF6B00' } } }
        }
    </script>
    <style>
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #FF6B00; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- HEADER -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="text-2xl font-bold text-primary">Zynex<span class="text-secondary italic">Cart</span></div>
            
            <!-- User Profile Section (Dynamic) -->
            <div id="userSection" class="flex items-center gap-4">
                <!-- Logged Out State -->
                <button onclick="openModal()" class="flex items-center gap-2 text-primary hover:text-secondary transition">
                    <i class="fa-regular fa-user text-xl"></i>
                    <span class="font-semibold hidden sm:block">Login</span>
                </button>
            </div>
        </div>
    </header>

    <!-- LOGIN MODAL -->
    <div id="authModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
        
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
            
            <!-- Modal Header -->
            <div class="bg-primary p-6 text-center relative">
                <button onclick="closeModal()" class="absolute top-4 right-4 text-white/70 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                <h2 class="text-2xl font-bold text-white mb-1">Welcome Back</h2>
                <p class="text-blue-200 text-sm">Login to access your orders & addresses</p>
            </div>

            <!-- Tabs -->
            <div class="flex border-b">
                <button id="tabEmail" onclick="switchTab('email')" class="flex-1 py-3 text-sm font-bold text-primary border-b-2 border-primary bg-blue-50">Email / Password</button>
                <button id="tabPhone" onclick="switchTab('phone')" class="flex-1 py-3 text-sm font-bold text-gray-500 hover:text-primary">Phone Number</button>
            </div>

            <!-- Form Content -->
            <div class="p-6 space-y-4">
                
                <!-- Email Form -->
                <div id="formEmail" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Email Address</label>
                        <input type="email" id="emailInput" placeholder="name@example.com" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Password</label>
                        <input type="password" id="passInput" placeholder="••••••••" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition">
                    </div>
                    <button onclick="handleEmailLogin()" class="w-full bg-secondary text-white font-bold py-3 rounded-lg hover:bg-orange-600 transition flex justify-center items-center gap-2">
                        <span>Login with Email</span>
                        <div class="loader" id="loaderEmail"></div>
                    </button>
                </div>

                <!-- Phone Form (UI Only for Demo) -->
                <div id="formPhone" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Mobile Number</label>
                        <div class="flex">
                            <span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-gray-300 bg-gray-100 text-gray-600 text-sm">+91</span>
                            <input type="tel" id="phoneInput" placeholder="98765 43210" class="w-full px-4 py-3 rounded-r-lg border border-gray-300 focus:border-secondary outline-none">
                        </div>
                    </div>
                    <button onclick="alert('OTP Setup requires Firebase Project Configuration. Please use Email for this demo.')" class="w-full bg-primary text-white font-bold py-3 rounded-lg hover:bg-blue-900 transition">
                        Send OTP
                    </button>
                </div>

                <!-- Divider -->
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-400 text-xs">OR CONTINUE WITH</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <!-- Social Login -->
                <button onclick="handleGoogleLogin()" class="w-full border border-gray-300 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-50 transition flex justify-center items-center gap-3">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    Sign in with Google
                </button>

                <!-- Error Message -->
                <div id="errorMsg" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg text-center border border-red-100"></div>
            </div>
        </div>
    </div>

    <!-- CONTENT PLACEHOLDER -->
    <main class="max-w-7xl mx-auto p-8 text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Start Shopping</h1>
        <p class="text-gray-500">Login to see your personalized recommendations.</p>
    </main>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION (IMPORTANT)
        // ==========================================
        // Apne Firebase Console se yeh values copy-paste karein
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
        } catch (e) {
            console.log("Firebase not configured yet. UI Mode Active.");
        }

        // ==========================================
        // 2. UI LOGIC
        // ==========================================
        function openModal() { document.getElementById('authModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('authModal').classList.add('hidden'); hideError(); }
        
        function switchTab(tab) {
            if(tab === 'email') {
                document.getElementById('formEmail').classList.remove('hidden');
                document.getElementById('formPhone').classList.add('hidden');
                document.getElementById('tabEmail').className = "flex-1 py-3 text-sm font-bold text-primary border-b-2 border-primary bg-blue-50";
                document.getElementById('tabPhone').className = "flex-1 py-3 text-sm font-bold text-gray-500 hover:text-primary";
            } else {
                document.getElementById('formEmail').classList.add('hidden');
                document.getElementById('formPhone').classList.remove('hidden');
                document.getElementById('tabPhone').className = "flex-1 py-3 text-sm font-bold text-primary border-b-2 border-primary bg-blue-50";
                document.getElementById('tabEmail').className = "flex-1 py-3 text-sm font-bold text-gray-500 hover:text-primary";
            }
            hideError();
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg;
            el.classList.remove('hidden');
        }
        function hideError() { document.getElementById('errorMsg').classList.add('hidden'); }

        // ==========================================
        // 3. AUTHENTICATION LOGIC
        // ==========================================
        
        // Email Login
        async function handleEmailLogin() {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passInput').value;
            const loader = document.getElementById('loaderEmail');

            if(!email || !pass) return showError("Please fill all fields");

            loader.style.display = 'block';
            hideError();

            try {
                // Real Firebase Login
                await firebase.auth().signInWithEmailAndPassword(email, pass);
                closeModal();
            } catch (error) {
                // Agar Firebase config nahi hai to Demo Mode chalega
                if(error.code === 'app/no-app') {
                    setTimeout(() => {
                        simulateLogin({ email: email, displayName: email.split('@')[0], photoURL: null });
                    }, 1500);
                } else {
                    showError(error.message);
                }
            } finally {
                loader.style.display = 'none';
            }
        }

        // Google Login
        async function handleGoogleLogin() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                await firebase.auth().signInWithPopup(provider);
                closeModal();
            } catch (error) {
                if(error.code === 'app/no-app') {
                    simulateLogin({ email: "user@gmail.com", displayName: "Demo User", photoURL: "https://ui-avatars.com/api/?name=Demo+User&background=FF6B00&color=fff" });
                } else {
                    showError(error.message);
                }
            }
        }

        // Simulate Login (For testing without Firebase Keys)
        function simulateLogin(userObj) {
            localStorage.setItem('zynex_user', JSON.stringify(userObj));
            updateHeader(userObj);
            alert("Login Successful (Demo Mode)");
        }

        // Update Header UI
        function updateHeader(user) {
            const section = document.getElementById('userSection');
            if(user) {
                const name = user.displayName || user.email.split('@')[0];
                const img = user.photoURL || `https://ui-avatars.com/api/?name=${name}&background=0F2C59&color=fff`;
                
                section.innerHTML = `
                    <div class="flex items-center gap-3 cursor-pointer group">
                        <img src="${img}" class="w-9 h-9 rounded-full border-2 border-white shadow-sm">
                        <div class="hidden md:block text-right">
                            <p class="text-sm font-bold text-primary leading-none">${name}</p>
                            <p class="text-[10px] text-gray-500">My Account</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-xs text-red-500 font-semibold hover:text-red-700">Logout</button>
                `;
            } else {
                section.innerHTML = `
                    <button onclick="openModal()" class="flex items-center gap-2 text-primary hover:text-secondary transition">
                        <i class="fa-regular fa-user text-xl"></i>
                        <span class="font-semibold hidden sm:block">Login</span>
                    </button>
                `;
            }
        }

        function logout() {
            firebase.auth().signOut().then(() => {
                localStorage.removeItem('zynex_user');
                updateHeader(null);
            }).catch(() => {
                localStorage.removeItem('zynex_user');
                updateHeader(null);
            });
        }

        // Check Session on Load
        window.onload = () => {
            // Check LocalStorage first (Demo fallback)
            const localUser = localStorage.getItem('zynex_user');
            if(localUser) updateHeader(JSON.parse(localUser));

            // Check Firebase Auth State
            if(typeof firebase !== 'undefined') {
                firebase.auth().onAuthStateChanged((user) => {
                    if (user) updateHeader(user);
                    else if(!localUser) updateHeader(null);
                });
            }
        };
    </script>
</body>
</html>
