<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="ZynexCart - Shop smart, live better. Discover everyday essentials, trending products and great deals."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>ZynexCart — Shop Smart, Live Better</title>


  <!-- =====================================================
       ZYNEXCART — EXISTING CSS
       DO NOT CHANGE DESIGN
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/base.css"
  >

  <link
    rel="stylesheet"
    href="css/header.css"
  >

  <link
    rel="stylesheet"
    href="css/categories.css"
  >

  <link
    rel="stylesheet"
    href="css/home.css"
  >

  <link
    rel="stylesheet"
    href="css/products.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

</head>


<body>


  <!-- =====================================================
       ZYNEXCART — PAGE COMPONENTS
       EXISTING STRUCTURE PRESERVED
  ====================================================== -->

  <div id="header-component"></div>

  <div id="hero-component"></div>

  <div id="categories-component"></div>

  <div id="popular-products-component"></div>

  <div id="promo-banner-component"></div>

  <div id="benefits-component"></div>

  <div id="footer-component"></div>



  <!-- =====================================================
       ZYNEXCART — COMPONENT LOADER
  ====================================================== -->

  <script>

    (function () {

      "use strict";


      async function loadComponent(
        elementId,
        filePath
      ) {

        const element =
          document.getElementById(elementId);

        if (!element) {
          console.warn(
            `ZynexCart: Element #${elementId} not found.`
          );

          return;
        }


        try {

          const response =
            await fetch(filePath);


          if (!response.ok) {

            throw new Error(
              `Unable to load ${filePath}`
            );

          }


          element.innerHTML =
            await response.text();


        } catch (error) {

          console.error(
            "ZynexCart component error:",
            error
          );

        }

      }



      async function loadComponents() {

        /*
         * Components are loaded first.
         * This keeps the existing page structure unchanged.
         */

        await loadComponent(
          "header-component",
          "components/header.html"
        );


        await loadComponent(
          "hero-component",
          "components/hero.html"
        );


        await loadComponent(
          "categories-component",
          "components/categories.html"
        );


        await loadComponent(
          "popular-products-component",
          "components/popular-products.html"
        );


        await loadComponent(
          "promo-banner-component",
          "components/promo-banner.html"
        );


        await loadComponent(
          "benefits-component",
          "components/benefits.html"
        );


        await loadComponent(
          "footer-component",
          "components/footer.html"
        );



        /*
         * After all HTML components are available,
         * load JavaScript modules in dependency order.
         */

        const scripts = [

          /* =========================
             CORE
          ========================== */

          "js/core/storage.js",
          "js/core/utils.js",
          "js/core/events.js",


          /* =========================
             CART
          ========================== */

          "js/cart/cart.js",
          "js/cart/cart-actions.js",
          "js/cart/cart-ui.js",


          /* =========================
             SEARCH
          ========================== */

          "js/search/search.js",


          /* =========================
             LOCATION
          ========================== */

          "js/location/location.js",
          "js/location/location-ui.js",
          "js/location/location-search.js",
          "js/location/location-map.js",
          "js/location/location-address.js",
          "js/location/saved-addresses.js",


          /* =========================
             MAIN APPLICATION
          ========================== */

          "js/app.js",


          /* =========================
             PRODUCT DATA / EXISTING
          ========================== */

          "js/products.js"

        ];



        /*
         * Load every JavaScript file sequentially.
         *
         * This is important because the modules
         * depend on globals created by previous files.
         */

        for (const scriptPath of scripts) {

          try {

            await loadScript(scriptPath);

          } catch (error) {

            console.error(
              `ZynexCart: Failed to load ${scriptPath}`,
              error
            );

            return;

          }

        }


        console.log(
          "ZynexCart: All modules loaded successfully."
        );

      }



      function loadScript(src) {

        return new Promise(
          function (resolve, reject) {

            const script =
              document.createElement("script");


            script.src = src;

            script.async = false;


            script.onload = function () {

              resolve();

            };


            script.onerror = function () {

              reject(
                new Error(
                  `Unable to load script: ${src}`
                )
              );

            };


            document.body.appendChild(script);

          }
        );

      }



      /*
       * Start component loading.
       */

      loadComponents();

    })();

  </script>


</body>

</html>
