<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="ZynexCart - Shop smart, live better. Discover everyday essentials, trending products and great deals."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>ZynexCart — Shop Smart, Live Better</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

  <!-- HEADER -->
  <div id="header-component"></div>


  <!-- HERO -->
  <div id="hero-component"></div>


  <!-- CATEGORIES -->
  <div id="categories-component"></div>


  <!-- POPULAR PRODUCTS -->
  <div id="popular-products-component"></div>


  <!-- PROMO BANNER -->
  <div id="promo-banner-component"></div>


  <!-- BENEFITS -->
  <div id="benefits-component"></div>


  <!-- FOOTER -->
  <div id="footer-component"></div>


  <script>

    async function loadComponent(elementId, filePath) {

      const element =
        document.getElementById(elementId);

      if (!element) {
        return;
      }

      try {

        const response =
          await fetch(filePath);

        if (!response.ok) {
          throw new Error(
            `Unable to load ${filePath}`
          );
        }

        element.innerHTML =
          await response.text();

      } catch (error) {

        console.error(
          "ZynexCart component error:",
          error
        );

      }

    }


    async function loadComponents() {

      await loadComponent(
        "header-component",
        "components/header.html"
      );

      await loadComponent(
        "hero-component",
        "components/hero.html"
      );

      await loadComponent(
        "categories-component",
        "components/categories.html"
      );

      await loadComponent(
        "popular-products-component",
        "components/popular-products.html"
      );

      await loadComponent(
        "promo-banner-component",
        "components/promo-banner.html"
      );

      await loadComponent(
        "benefits-component",
        "components/benefits.html"
      );

      await loadComponent(
        "footer-component",
        "components/footer.html"
      );


      /*
       * IMPORTANT:
       * Components are now completely loaded.
       * Only after that do we load ZynexCart JS.
       */

      const appScript =
        document.createElement("script");

      appScript.src = "js/app.js";

      document.body.appendChild(appScript);


      appScript.onload = () => {

        const productsScript =
          document.createElement("script");

        productsScript.src =
          "js/products.js";

        document.body.appendChild(
          productsScript
        );

      };

    }


    loadComponents();

  </script>


</body>

</html>
