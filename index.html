<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="ZynexCart - Shop smart, live better. Discover everyday essentials, trending products and great deals."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>ZynexCart — Shop Smart, Live Better</title>


  <!-- =====================================================
       ZYNEXCART — CSS
       EXISTING DESIGN PRESERVED
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/base.css"
  >

  <link
    rel="stylesheet"
    href="css/header.css"
  >

  <link
  rel="stylesheet"
  href="css/search.css"
  >
  
  <link
    rel="stylesheet"
    href="css/categories.css"
  >

  <link
    rel="stylesheet"
    href="css/home.css"
  >

  <link
    rel="stylesheet"
    href="css/products.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

</head>


<body>


  <!-- =====================================================
       ZYNEXCART — PAGE COMPONENTS
  ====================================================== -->

  <div id="header-component"></div>

  <div id="hero-component"></div>

  <div id="categories-component"></div>

  <div id="popular-products-component"></div>

  <div id="promo-banner-component"></div>

  <div id="benefits-component"></div>

  <div id="footer-component"></div>


  <!-- =====================================================
       ZYNEXCART — COMPONENT + SCRIPT LOADER
  ====================================================== -->

  <script>

    (function () {

      "use strict";


      /*
       * Prevent accidental double initialization.
       */

      if (
        window.__ZYNEXCART_INDEX_INITIALIZED__
      ) {

        return;

      }


      window.__ZYNEXCART_INDEX_INITIALIZED__ =
        true;



      /* =====================================================
         LOAD HTML COMPONENT
      ====================================================== */

      async function loadComponent(
        elementId,
        filePath
      ) {

        const element =
          document.getElementById(
            elementId
          );


        if (!element) {

          console.warn(
            `ZynexCart: Element #${elementId} not found.`
          );

          return false;

        }


        try {

          const response =
            await fetch(
              filePath,
              {
                cache: "no-cache"
              }
            );


          if (!response.ok) {

            throw new Error(
              `Unable to load ${filePath}`
            );

          }


          const html =
            await response.text();


          element.innerHTML =
            html;


          return true;


        } catch (error) {

          console.error(
            "ZynexCart component error:",
            error
          );


          return false;

        }

      }



      /* =====================================================
         LOCATION MODAL INITIAL STATE

         IMPORTANT:
         Location modal must NEVER open automatically
         just because the page was refreshed.
      ====================================================== */

      function resetLocationModalState() {

        const modal =
          document.getElementById(
            "locationModal"
          );


        if (!modal) {

          return;

        }


        /*
         * Force modal to start closed.
         */

        modal.hidden =
          true;


        modal.setAttribute(
          "aria-hidden",
          "true"
        );


        document.body.classList.remove(
          "location-modal-open"
        );

      }



      /* =====================================================
         LOAD JAVASCRIPT FILE
      ====================================================== */

      function loadScript(
        src
      ) {

        return new Promise(
          function (resolve, reject) {

            /*
             * Prevent same script from being loaded twice.
             */

            const existingScript =
              document.querySelector(
                `script[data-zynexcart-script="${src}"]`
              );


            if (existingScript) {

              resolve();

              return;

            }


            const script =
              document.createElement(
                "script"
              );


            script.src =
              src;


            script.async =
              false;


            script.dataset.zynexcartScript =
              src;


            script.onload =
              function () {

                resolve();

              };


            script.onerror =
              function () {

                reject(
                  new Error(
                    `Unable to load script: ${src}`
                  )
                );

              };


            document.body.appendChild(
              script
            );

          }
        );

      }



      /* =====================================================
         COMPONENT LIST
      ====================================================== */

      const components = [

        [
          "header-component",
          "components/header.html"
        ],

        [
          "hero-component",
          "components/hero.html"
        ],

        [
          "categories-component",
          "components/categories.html"
        ],

        [
          "popular-products-component",
          "components/popular-products.html"
        ],

        [
          "promo-banner-component",
          "components/promo-banner.html"
        ],

        [
          "benefits-component",
          "components/benefits.html"
        ],

        [
          "footer-component",
          "components/footer.html"
        ]

      ];



      /* =====================================================
         JAVASCRIPT MODULES

         Dependency order is preserved.
      ====================================================== */

      const scripts = [

        /* =========================
           CORE
        ========================== */

        "js/core/storage.js",
        "js/core/utils.js",
        "js/core/events.js",


        /* =========================
           CATEGORY DATA + RENDERER
        ========================== */

        "js/categories.js",


        /* =========================
           CART
        ========================== */

        "js/cart/cart.js",
        "js/cart/cart-actions.js",
        "js/cart/cart-ui.js",


        /* =========================
           SEARCH
        ========================== */

        "js/search/search.js",


        /* =========================
           LOCATION
        ========================== */

        "js/location/location.js",
        "js/location/location-ui.js",
        "js/location/location-search.js",
        "js/location/location-map.js",
        "js/location/location-address.js",
        "js/location/saved-addresses.js",


        /* =========================
           MAIN APPLICATION
        ========================== */

        "js/app.js",


        /* =========================
           PRODUCTS
        ========================== */

        "js/products.js"

      ];



      /* =====================================================
         HOME POPULAR PRODUCTS
         MOBILE + CHROME DESKTOP SITE

         IMPORTANT:
         This function ONLY affects:
         #featuredProducts

         Normal mobile:
         2 products per row.

         Real mobile phone with Chrome
         Desktop Site ON:
         3 products per row.

         Desktop / laptop:
         unchanged.
      ====================================================== */

      function setupMobileDesktopSitePopularProducts() {

        const featuredProducts =
          document.getElementById(
            "featuredProducts"
          );


        if (!featuredProducts) {

          return;

        }


        /*
         * Prevent duplicate listeners / observers
         * if this function is ever called again.
         */

        if (
          featuredProducts.dataset
            .mobileDesktopSiteSetup === "true"
        ) {

          return;

        }


        featuredProducts.dataset
          .mobileDesktopSiteSetup =
          "true";



        function updatePopularProductsLayout() {

          /*
           * -------------------------------------------------
           * 1. Touch capability
           * -------------------------------------------------
           *
           * A normal desktop/laptop should not pass
           * this condition.
           */

          const isTouchDevice =
            (
              navigator.maxTouchPoints > 0 ||
              "ontouchstart" in window
            );


          /*
           * -------------------------------------------------
           * 2. Physical screen check
           * -------------------------------------------------
           *
           * Desktop Site ON can make window.innerWidth
           * behave like a desktop viewport.
           *
           * screen.width is used to identify the
           * small physical phone display.
           */

          const screenWidth =
            window.screen
              ? Math.min(
                  window.screen.width || Infinity,
                  window.screen.height || Infinity
                )
              : Infinity;


          const isPhoneScreen =
            screenWidth <= 650;


          /*
           * -------------------------------------------------
           * 3. Desktop Site detection
           * -------------------------------------------------
           *
           * When Desktop Site is OFF:
           * viewport remains phone-sized.
           *
           * When Desktop Site is ON:
           * Chrome normally exposes a much wider
           * CSS viewport.
           */

          const viewportWidth =
            window.innerWidth;


          const isDesktopSite =
            viewportWidth > 650;



          /*
           * -------------------------------------------------
           * FINAL CONDITION
           * -------------------------------------------------
           *
           * Only:
           *
           * Real touch phone
           * +
           * Small physical screen
           * +
           * Wide desktop-style viewport
           *
           * gets 3 columns.
           */

          const shouldUseThreeColumns =
            isTouchDevice &&
            isPhoneScreen &&
            isDesktopSite;



          if (
            shouldUseThreeColumns
          ) {

            featuredProducts.style.setProperty(
              "grid-template-columns",
              "repeat(3, minmax(0, 1fr))",
              "important"
            );


            featuredProducts.dataset
              .mobileDesktopSiteColumns =
              "3";


          } else {

            /*
             * Remove ONLY the inline rule created
             * by this function.
             *
             * Existing responsive.css controls
             * normal mobile layout.
             */

            featuredProducts.style
              .removeProperty(
                "grid-template-columns"
              );


            delete featuredProducts.dataset
              .mobileDesktopSiteColumns;

          }

        }



        /*
         * Initial layout check.
         */

        updatePopularProductsLayout();



        /*
         * Chrome Desktop Site / rotation /
         * viewport changes.
         */

        window.addEventListener(
          "resize",
          updatePopularProductsLayout,
          {
            passive: true
          }
        );



        /*
         * Products are generated dynamically by
         * products.js.
         *
         * Observe ONLY the featured products grid.
         *
         * No product/cart functionality is changed.
         */

        const observer =
          new MutationObserver(
            function () {

              updatePopularProductsLayout();

            }
          );


        observer.observe(
          featuredProducts,
          {
            childList: true
          }
        );

      }



      /* =====================================================
         MAIN INITIALIZATION
      ====================================================== */

      async function initializeZynexCart() {

        try {


          /*
           * -------------------------------------------------
           * STEP 1
           * Load all HTML components.
           *
           * Components can load in parallel because they
           * do not depend on JavaScript modules.
           * -------------------------------------------------
           */

          await Promise.all(

            components.map(
              function (component) {

                return loadComponent(
                  component[0],
                  component[1]
                );

              }
            )

          );


          /*
           * -------------------------------------------------
           * STEP 2
           * IMPORTANT LOCATION FIX
           *
           * Header is now available.
           * Force location modal closed before any JS
           * location system starts.
           * -------------------------------------------------
           */

          resetLocationModalState();


          /*
           * -------------------------------------------------
           * STEP 3
           * Load JavaScript modules sequentially.
           *
           * Dependency order must NOT change.
           * -------------------------------------------------
           */

          for (
            const scriptPath of scripts
          ) {

            try {

              await loadScript(
                scriptPath
              );


            } catch (error) {

              console.error(
                `ZynexCart: Failed to load ${scriptPath}`,
                error
              );


              return;

            }

          }


          /*
           * -------------------------------------------------
           * STEP 4
           * Make absolutely sure the modal remains closed
           * after application initialization.
           *
           * This prevents saved-location restoration from
           * accidentally showing the modal.
           * -------------------------------------------------
           */

          resetLocationModalState();



          /*
           * -------------------------------------------------
           * STEP 5
           * HOME POPULAR PRODUCTS SPECIAL LAYOUT
           *
           * Only real mobile phone + Chrome Desktop Site
           * gets 3 products per row.
           *
           * Normal mobile remains controlled by
           * responsive.css with 2 products per row.
           * -------------------------------------------------
           */

          setupMobileDesktopSitePopularProducts();



          console.log(
            "ZynexCart: All components and modules loaded successfully."
          );


        } catch (error) {

          console.error(
            "ZynexCart: Application initialization failed.",
            error
          );

        }

      }



      /* =====================================================
         START ZYNEXCART
      ====================================================== */

      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          initializeZynexCart,
          {
            once: true
          }
        );

      } else {

        initializeZynexCart();

      }

    })();

  </script>


</body>

</html>
