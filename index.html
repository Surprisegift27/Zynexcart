<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="ZynexCart - Shop smart, live better. Discover everyday essentials, trending products and great deals."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>
    ZynexCart — Shop Smart, Live Better
  </title>


  <!-- =====================================================
       ZYNEXCART STYLES
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/base.css"
  >

  <link
    rel="stylesheet"
    href="css/header.css"
  >

  <link
    rel="stylesheet"
    href="css/search.css"
  >

  <link
    rel="stylesheet"
    href="css/categories.css"
  >

  <link
    rel="stylesheet"
    href="css/home.css"
  >

  <link
    rel="stylesheet"
    href="css/products.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >


  <!-- =====================================================
       DESKTOP LOGIN MODAL STYLE
       Mobile is intentionally unaffected.
  ====================================================== -->

  <style>

    /* =====================================================
       DESKTOP LOGIN MODAL
    ====================================================== */

    #zynexcartDesktopLoginModal {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 32px;

      background: rgba(7, 27, 58, 0.58);

      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);

      overflow-y: auto;
    }


    #zynexcartDesktopLoginModal.is-open {
      display: flex;
    }


    #zynexcartDesktopLoginModal
    .zynexcart-desktop-login-shell {

      position: relative;

      width: min(
        100%,
        520px
      );

      max-height: calc(100vh - 64px);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow-y: auto;

      animation:
        zynexcartLoginModalIn
        0.22s
        ease-out;
    }


    #zynexcartDesktopLoginModal
    .zynexcart-desktop-login-content {

      width: 100%;

      display: flex;
      justify-content: center;
    }


    /*
      Close button
    */

    #zynexcartDesktopLoginClose {

      position: absolute;

      top: -14px;
      right: -14px;

      width: 40px;
      height: 40px;

      border: 0;

      border-radius: 50%;

      background: #ffffff;

      color: #172033;

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.20);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      line-height: 1;

      cursor: pointer;

      z-index: 10;

      transition:
        transform 0.18s ease,
        background 0.18s ease;
    }


    #zynexcartDesktopLoginClose:hover {

      transform: scale(1.06);

      background: #f7f8fa;
    }


    #zynexcartDesktopLoginClose:active {

      transform: scale(0.96);
    }


    /*
      When auth-main comes from login.html,
      don't show its standalone page background
      inside Home modal.
    */

    #zynexcartDesktopLoginModal .auth-main {

      width: 100%;

      min-height: auto;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 0 !important;

      margin: 0 !important;

      background: transparent !important;
    }


    #zynexcartDesktopLoginModal .auth-card {

      width: 100%;

      max-width: 460px;

      margin: 0 auto;
    }


    @keyframes zynexcartLoginModalIn {

      from {

        opacity: 0;

        transform:
          translateY(12px)
          scale(0.98);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /*
      Desktop only.
      This is deliberately NOT applied to mobile.
    */

    @media (max-width: 768px) {

      #zynexcartDesktopLoginModal {
        display: none !important;
      }

    }


    @media (max-width: 900px) and (min-width: 769px) {

      #zynexcartDesktopLoginModal {

        padding: 24px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       ZYNEXCART HOME COMPONENTS
  ====================================================== -->

  <div id="header-component"></div>

  <div id="hero-component"></div>

  <div id="categories-component"></div>

  <div id="popular-products-component"></div>

  <div id="promo-banner-component"></div>

  <div id="benefits-component"></div>

  <div id="footer-component"></div>


  <!-- =====================================================
       DESKTOP LOGIN MODAL

       This remains empty until Login is clicked.
  ====================================================== -->

  <div
    id="zynexcartDesktopLoginModal"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-label="ZynexCart Login"
  >

    <div
      class="zynexcart-desktop-login-shell"
      id="zynexcartDesktopLoginShell"
    >

      <button
        type="button"
        id="zynexcartDesktopLoginClose"
        aria-label="Close login"
      >
        ×
      </button>

      <div
        class="zynexcart-desktop-login-content"
        id="zynexcartDesktopLoginContent"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       ZYNEXCART APPLICATION
  ====================================================== -->

  <script>

    (function () {

      "use strict";


      /* ===================================================
         PREVENT DUPLICATE INITIALIZATION
      ================================================= */

      if (
        window.__ZYNEXCART_INDEX_INITIALIZED__
      ) {

        return;

      }

      window.__ZYNEXCART_INDEX_INITIALIZED__ = true;


      /* ===================================================
         COMPONENT LOADER
      ================================================= */

      async function loadComponent(
        elementId,
        filePath
      ) {

        const element =
          document.getElementById(
            elementId
          );

        if (!element) {

          throw new Error(
            "Component element not found: " +
            elementId
          );

        }


        const response =
          await fetch(
            filePath,
            {
              cache: "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Unable to load component: " +
            filePath +
            " (" +
            response.status +
            ")"
          );

        }


        const html =
          await response.text();


        element.innerHTML = html;

      }


      /* ===================================================
         LOCATION MODAL RESET
      ================================================= */

      function resetLocationModalState() {

        const modal =
          document.getElementById(
            "locationModal"
          );

        if (!modal) return;

        modal.classList.remove(
          "open",
          "active",
          "show"
        );

        modal.hidden = true;

        document.body.classList.remove(
          "location-modal-open"
        );

      }


      /* ===================================================
         SCRIPT LOADER
      ================================================= */

      function loadScript(src) {

        return new Promise(
          function (resolve, reject) {

            const existing =
              document.querySelector(
                'script[data-zynexcart-script="' +
                src +
                '"]'
              );


            if (existing) {

              if (
                existing.dataset.loaded ===
                "true"
              ) {

                resolve();

              } else {

                existing.addEventListener(
                  "load",
                  resolve,
                  {
                    once: true
                  }
                );

                existing.addEventListener(
                  "error",
                  reject,
                  {
                    once: true
                  }
                );

              }

              return;

            }


            const script =
              document.createElement(
                "script"
              );


            script.src = src;

            script.defer = false;

            script.dataset.zynexcartScript =
              src;


            script.onload =
              function () {

                script.dataset.loaded =
                  "true";

                resolve();

              };


            script.onerror =
              function () {

                reject(
                  new Error(
                    "Failed to load script: " +
                    src
                  )
                );

              };


            document.body.appendChild(
              script
            );

          }
        );

      }


      /* ===================================================
         HOME COMPONENTS
      ================================================= */

      const components = [

        [
          "header-component",
          "components/header.html"
        ],

        [
          "hero-component",
          "components/hero.html"
        ],

        [
          "categories-component",
          "components/categories.html"
        ],

        [
          "popular-products-component",
          "components/popular-products.html"
        ],

        [
          "promo-banner-component",
          "components/promo-banner.html"
        ],

        [
          "benefits-component",
          "components/benefits.html"
        ],

        [
          "footer-component",
          "components/footer.html"
        ]

      ];


      /* ===================================================
         HOME SCRIPTS
      ================================================= */

      const scripts = [

        "js/core/storage.js",

        "js/core/utils.js",

        "js/core/events.js",

        "js/categories.js",

        "js/cart/cart.js",

        "js/cart/cart-actions.js",

        "js/cart/cart-ui.js",

        "js/search/search.js",

        "js/location/location.js",

        "js/location/location-ui.js",

        "js/location/location-search.js",

        "js/location/location-map.js",

        "js/location/location-address.js",

        "js/location/saved-addresses.js",

        "js/app.js",

        "js/products.js"

      ];


      /* ===================================================
         MOBILE DESKTOP-SITE PRODUCT GRID
      ================================================= */

      function setupMobileDesktopSitePopularProducts() {

        const featuredProducts =
          document.getElementById(
            "featuredProducts"
          );


        if (!featuredProducts) {
          return;
        }


        if (
          featuredProducts.dataset
            .mobileDesktopSiteSetup ===
          "true"
        ) {

          return;

        }


        featuredProducts.dataset
          .mobileDesktopSiteSetup =
          "true";


        function updatePopularProductsLayout() {

          const isTouchDevice =
            navigator.maxTouchPoints > 0 ||
            "ontouchstart" in window;


          const screenWidth =
            window.screen
              ? Math.min(
                  window.screen.width || Infinity,
                  window.screen.height || Infinity
                )
              : Infinity;


          const isPhoneScreen =
            screenWidth <= 650;


          const viewportWidth =
            window.innerWidth;


          const isDesktopSite =
            viewportWidth > 650;


          const shouldUseThreeColumns =
            isTouchDevice &&
            isPhoneScreen &&
            isDesktopSite;


          if (shouldUseThreeColumns) {

            featuredProducts.style.setProperty(
              "grid-template-columns",
              "repeat(3, minmax(0, 1fr))",
              "important"
            );


            featuredProducts.dataset
              .mobileDesktopSiteColumns =
              "3";

          } else {

            featuredProducts.style
              .removeProperty(
                "grid-template-columns"
              );


            delete featuredProducts.dataset
              .mobileDesktopSiteColumns;

          }

        }


        updatePopularProductsLayout();


        window.addEventListener(
          "resize",
          updatePopularProductsLayout,
          {
            passive: true
          }
        );


        const observer =
          new MutationObserver(
            function () {

              updatePopularProductsLayout();

            }
          );


        observer.observe(
          featuredProducts,
          {
            childList: true
          }
        );

      }


      /* ===================================================
         DESKTOP LOGIN MODAL SYSTEM
      ================================================= */

      let desktopLoginLoaded = false;

      let desktopLoginLoading = false;


      const desktopLoginModal =
        document.getElementById(
          "zynexcartDesktopLoginModal"
        );


      const desktopLoginContent =
        document.getElementById(
          "zynexcartDesktopLoginContent"
        );


      const desktopLoginClose =
        document.getElementById(
          "zynexcartDesktopLoginClose"
        );


      function isDesktopScreen() {

        return window.innerWidth >= 769;

      }


      function openDesktopLogin() {

        if (!isDesktopScreen()) {

          return;

        }


        if (
          !desktopLoginModal ||
          !desktopLoginContent
        ) {

          return;

        }


        desktopLoginModal.classList.add(
          "is-open"
        );


        desktopLoginModal.setAttribute(
          "aria-hidden",
          "false"
        );


        document.body.classList.add(
          "zynexcart-login-modal-open"
        );


        document.body.style.overflow =
          "hidden";


        if (desktopLoginLoaded) {

          setTimeout(
            focusDesktopLogin,
            100
          );

          return;

        }


        loadDesktopLogin();

      }


      async function loadDesktopLogin() {

        if (desktopLoginLoading) {
          return;
        }


        desktopLoginLoading = true;


        try {

          /*
            Load login.html only for desktop modal.

            We extract .auth-main instead of loading
            the complete login page inside Home.
          */

          const response =
            await fetch(
              "login.html",
              {
                cache: "no-cache"
              }
            );


          if (!response.ok) {

            throw new Error(
              "Unable to load login.html (" +
              response.status +
              ")"
            );

          }


          const html =
            await response.text();


          const parser =
            new DOMParser();


          const loginDocument =
            parser.parseFromString(
              html,
              "text/html"
            );


          const authMain =
            loginDocument.querySelector(
              ".auth-main"
            );


          if (!authMain) {

            throw new Error(
              "The .auth-main section was not found in login.html."
            );

          }


          /*
            Load auth.css once.
          */

          if (
            !document.querySelector(
              'link[data-zynexcart-auth-css="true"]'
            )
          ) {

            const authCss =
              document.createElement(
                "link"
              );


            authCss.rel =
              "stylesheet";


            authCss.href =
              "css/auth.css";


            authCss.dataset
              .zynexcartAuthCss =
              "true";


            document.head.appendChild(
              authCss
            );

          }


          /*
            Only insert the actual authentication
            interface. The standalone fake background
            from login.html is NOT inserted.
          */

          desktopLoginContent.innerHTML =
            authMain.outerHTML;


          desktopLoginLoaded = true;


          /*
            auth.js is loaded AFTER the login
            elements have been inserted.
          */

          await loadDesktopAuthScript();


          focusDesktopLogin();

        } catch (error) {

          console.error(
            "ZynexCart: Desktop login failed.",
            error
          );


          desktopLoginContent.innerHTML =

            '<div style="' +
            'background:#fff;' +
            'border-radius:18px;' +
            'padding:32px;' +
            'text-align:center;' +
            'max-width:460px;' +
            'width:100%;' +
            'font-family:Inter,Arial,sans-serif;' +
            '">' +

            '<h3 style="' +
            'margin:0 0 10px;' +
            'color:#172033;' +
            '">Unable to open Login</h3>' +

            '<p style="' +
            'margin:0;' +
            'color:#6b7280;' +
            '">Please refresh the page and try again.</p>' +

            '</div>';

        } finally {

          desktopLoginLoading = false;

        }

      }


      function loadDesktopAuthScript() {

        return new Promise(
          function (resolve, reject) {

            /*
              auth.js can be loaded once.
            */

            if (
              window.__ZYNEXCART_AUTH_INITIALIZED__
            ) {

              resolve();

              return;

            }


            const existing =
              document.querySelector(
                'script[data-zynexcart-auth="true"]'
              );


            if (existing) {

              existing.addEventListener(
                "load",
                resolve,
                {
                  once: true
                }
              );


              existing.addEventListener(
                "error",
                reject,
                {
                  once: true
                }
              );


              return;

            }


            const script =
              document.createElement(
                "script"
              );


            script.src =
              "js/auth.js";


            script.dataset
              .zynexcartAuth =
              "true";


            script.onload =
              function () {

                resolve();

              };


            script.onerror =
              function () {

                reject(
                  new Error(
                    "Unable to load js/auth.js"
                  )
                );

              };


            document.body.appendChild(
              script
            );

          }
        );

      }


      function focusDesktopLogin() {

        const input =
          document.getElementById(
            "mobileNumber"
          );


        if (
          input &&
          desktopLoginModal &&
          desktopLoginModal.classList.contains(
            "is-open"
          )
        ) {

          setTimeout(
            function () {

              try {
                input.focus();
              } catch (error) {}

            },
            120
          );

        }

      }


      function closeDesktopLogin() {

        if (!desktopLoginModal) {
          return;
        }


        desktopLoginModal.classList.remove(
          "is-open"
        );


        desktopLoginModal.setAttribute(
          "aria-hidden",
          "true"
        );


        document.body.classList.remove(
          "zynexcart-login-modal-open"
        );


        document.body.style.overflow =
          "";

      }


      /*
        auth.js uses this after successful login.
      */

      window.ZynexCartDesktopLoginClose =
        closeDesktopLogin;


      /* ===================================================
         ACCOUNT LOGIN CLICK
         
         Event delegation is used because the header
         itself is loaded dynamically.
      ================================================= */

      document.addEventListener(
        "click",
        function (event) {

          const accountLink =
            event.target.closest(
              ".account-link"
            );


          if (!accountLink) {
            return;
          }


          /*
            Mobile:
            Do NOT intercept.

            Existing login.html mobile
            behavior remains unchanged.
          */

          if (!isDesktopScreen()) {
            return;
          }


          event.preventDefault();

          event.stopPropagation();

          openDesktopLogin();

        },
        false
      );


      /* ===================================================
         CLOSE BUTTON
      ================================================= */

      if (desktopLoginClose) {

        desktopLoginClose.addEventListener(
          "click",
          function (event) {

            event.preventDefault();

            closeDesktopLogin();

          }
        );

      }


      /* ===================================================
         OUTSIDE CLICK
      ================================================= */

      if (desktopLoginModal) {

        desktopLoginModal.addEventListener(
          "click",
          function (event) {

            /*
              Only the overlay itself closes.
              Clicking the login card does not.
            */

            if (
              event.target ===
              desktopLoginModal
            ) {

              closeDesktopLogin();

            }

          }
        );

      }


      /* ===================================================
         ESC KEY
      ================================================= */

      document.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Escape" &&
            desktopLoginModal &&
            desktopLoginModal.classList.contains(
              "is-open"
            )
          ) {

            closeDesktopLogin();

          }

        }
      );


      /* ===================================================
         RESPONSIVE SAFETY
      ================================================= */

      window.addEventListener(
        "resize",
        function () {

          /*
            If user changes from desktop to mobile
            while modal is open, close it.
          */

          if (
            !isDesktopScreen() &&
            desktopLoginModal &&
            desktopLoginModal.classList.contains(
              "is-open"
            )
          ) {

            closeDesktopLogin();

          }

        },
        {
          passive: true
        }
      );


      /* ===================================================
         INITIALIZE HOME
      ================================================= */

      async function initializeZynexCart() {

        try {

          /*
            1. Load all Home components.
          */

          await Promise.all(
            components.map(
              function (component) {

                return loadComponent(
                  component[0],
                  component[1]
                );

              }
            )
          );


          resetLocationModalState();


          /*
            2. Load Home JavaScript modules.
          */

          for (
            const scriptPath of scripts
          ) {

            try {

              await loadScript(
                scriptPath
              );

            } catch (error) {

              console.error(
                "ZynexCart: Failed to load " +
                scriptPath,
                error
              );

              return;

            }

          }


          resetLocationModalState();


          setupMobileDesktopSitePopularProducts();


          console.log(
            "ZynexCart: All components and modules loaded successfully."
          );


        } catch (error) {

          console.error(
            "ZynexCart: Application initialization failed.",
            error
          );

        }

      }


      /* ===================================================
         DOM READY
      ================================================= */

      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          initializeZynexCart,
          {
            once: true
          }
        );

      } else {

        initializeZynexCart();

      }

    })();

  </script>

</body>

</html>
