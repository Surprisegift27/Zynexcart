<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="ZynexCart - Shop smart, live better. Discover everyday essentials, trending products and great deals."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>ZynexCart — Shop Smart, Live Better</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>


  <!-- COMPONENT: HEADER -->

  <div id="header-component"></div>


  <!-- COMPONENT: HERO -->

  <div id="hero-component"></div>


  <!-- COMPONENT: CATEGORIES -->

  <div id="categories-component"></div>


  <!-- COMPONENT: POPULAR PRODUCTS -->

  <div id="popular-products-component"></div>


  <!-- COMPONENT: PROMO BANNER -->

  <div id="promo-banner-component"></div>


  <!-- COMPONENT: BENEFITS -->

  <div id="benefits-component"></div>


  <!-- COMPONENT: FOOTER -->

  <div id="footer-component"></div>


  <!-- =====================================================
       COMPONENT LOADER
       ===================================================== -->

  <script>

    async function loadComponent(
      componentId,
      filePath
    ) {

      const container =
        document.getElementById(componentId);

      if (!container) return;

      try {

        const response =
          await fetch(filePath);

        if (!response.ok) {
          throw new Error(
            `Failed to load ${filePath}`
          );
        }

        container.innerHTML =
          await response.text();

      } catch (error) {

        console.error(
          "Component loading error:",
          error
        );

      }

    }


    async function loadAllComponents() {

      await Promise.all([

        loadComponent(
          "header-component",
          "components/header.html"
        ),

        loadComponent(
          "hero-component",
          "components/hero.html"
        ),

        loadComponent(
          "categories-component",
          "components/categories.html"
        ),

        loadComponent(
          "popular-products-component",
          "components/popular-products.html"
        ),

        loadComponent(
          "promo-banner-component",
          "components/promo-banner.html"
        ),

        loadComponent(
          "benefits-component",
          "components/benefits.html"
        ),

        loadComponent(
          "footer-component",
          "components/footer.html"
        )

      ]);

    }


    loadAllComponents();

  </script>


  <!-- EXISTING ZYNEXCART JAVASCRIPT -->

  <script src="js/app.js"></script>

  <script src="js/products.js"></script>


</body>

</html>
