<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZynexCart - Shop & Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#0F2C59', secondary: '#FF6B00' } } }
        }
    </script>
    <style>
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #FF6B00; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- HEADER -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="text-2xl font-bold text-primary cursor-pointer" onclick="showPage('home')">
                Zynex<span class="text-secondary italic">Cart</span>
            </div>
            
            <div class="flex items-center gap-6">
                <!-- Cart Icon -->
                <button onclick="showPage('cart')" class="relative text-gray-600 hover:text-primary transition">
                    <i class="fa-solid fa-cart-shopping text-2xl"></i>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-secondary text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full">0</span>
                </button>

                <!-- User Profile Section -->
                <div id="userSection">
                    <button onclick="openModal()" class="flex items-center gap-2 text-primary hover:text-secondary transition">
                        <i class="fa-regular fa-user text-xl"></i>
                        <span class="font-semibold hidden sm:block">Login</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="max-w-7xl mx-auto p-4 sm:p-8 min-h-screen">
        
        <!-- PAGE 1: PRODUCT LISTING (Default) -->
        <div id="page-home" class="fade-in">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Trending Products</h1>
            <p class="text-gray-500 mb-8">Browse our latest collection. No login required to add to cart!</p>
            
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Products will be injected here by JS -->
            </div>
        </div>

        <!-- PAGE 2: CART PAGE -->
        <div id="page-cart" class="hidden fade-in max-w-3xl mx-auto">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">Your Shopping Cart</h1>
            
            <div id="cartItems" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                <!-- Cart items injected here -->
                <div class="p-8 text-center text-gray-500">Your cart is empty. Start shopping!</div>
            </div>

            <div id="cartSummary" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4 text-lg font-bold text-gray-800">
                    <span>Total Amount:</span>
                    <span class="text-secondary">₹<span id="cartTotal">0</span></span>
                </div>
                <button onclick="handleCheckout()" class="w-full bg-secondary text-white font-bold py-4 rounded-lg hover:bg-orange-600 transition text-lg shadow-lg shadow-orange-200">
                    Proceed to Checkout <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>

    </main>

    <!-- LOGIN MODAL (Same as before, triggered on Checkout) -->
    <div id="authModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden fade-in">
            <div class="bg-primary p-6 text-center relative">
                <button onclick="closeModal()" class="absolute top-4 right-4 text-white/70 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                <h2 class="text-2xl font-bold text-white mb-1">Login Required</h2>
                <p class="text-blue-200 text-sm">Please login to complete your purchase</p>
            </div>
            <div class="p-6 space-y-4">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Email Address</label>
                        <input type="email" id="emailInput" placeholder="name@example.com" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Password</label>
                        <input type="password" id="passInput" placeholder="••••••••" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition">
                    </div>
                    <button onclick="handleEmailLogin()" class="w-full bg-secondary text-white font-bold py-3 rounded-lg hover:bg-orange-600 transition flex justify-center items-center gap-2">
                        <span>Login & Checkout</span>
                        <div class="loader" id="loaderEmail"></div>
                    </button>
                </div>
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-400 text-xs">OR</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>
                <button onclick="handleGoogleLogin()" class="w-full border border-gray-300 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-50 transition flex justify-center items-center gap-3">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    Sign in with Google
                </button>
                <div id="errorMsg" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg text-center border border-red-100"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDI15D4x7_Lo6w9Eh9M5HPQBXFLq2zFklM",
            authDomain: "zynexcart-web.firebaseapp.com",
            projectId: "zynexcart-web",
            storageBucket: "zynexcart-web.firebasestorage.app",
            messagingSenderId: "328652532886",
            appId: "1:328652532886:web:b6552b9f2cdb2f290066b7",
            measurementId: "G-P9WTMDQEPW"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ==========================================
        // 2. E-COMMERCE LOGIC (Products & Cart)
        // ==========================================
        const products = [
            { id: 1, name: "Wireless Noise-Cancel Headphones", price: 2499, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80" },
            { id: 2, name: "Smart Watch Series 7", price: 3999, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80" },
            { id: 3, name: "Ergonomic Mechanical Keyboard", price: 1899, image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=400&q=80" },
            { id: 4, name: "Premium Running Shoes", price: 3299, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80" }
        ];

        let cart = JSON.parse(localStorage.getItem('zynex_cart')) || [];

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition group">
                    <div class="h-48 overflow-hidden bg-gray-100">
                        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${p.name}">
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-gray-800 mb-1 truncate">${p.name}</h3>
                        <p class="text-secondary font-bold text-lg mb-3">₹${p.price}</p>
                        <button onclick="addToCart(${p.id})" class="w-full bg-primary text-white font-semibold py-2 rounded-lg hover:bg-blue-900 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cart-plus"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            saveCart();
            updateCartUI();
            
            // Visual feedback
            const btn = event.target.closest('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-check"></i> Added!`;
            btn.classList.add('bg-green-600');
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('bg-green-600');
            }, 1000);
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveCart();
            renderCartPage();
        }

        function saveCart() {
            localStorage.setItem('zynex_cart', JSON.stringify(cart));
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').innerText = count;
        }

        function renderCartPage() {
            const container = document.getElementById('cartItems');
            const summary = document.getElementById('cartSummary');
            
            if (cart.length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-gray-500"><i class="fa-solid fa-cart-arrow-down text-4xl mb-3 text-gray-300"></i><p>Your cart is empty.</p><button onclick="showPage('home')" class="mt-4 text-secondary font-bold hover:underline">Start Shopping</button></div>`;
                summary.classList.add('hidden');
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `
                <div class="flex items-center gap-4 p-4 border-b border-gray-100 last:border-0">
                    <img src="${item.image}" class="w-20 h-20 object-cover rounded-lg bg-gray-100">
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-800">${item.name}</h3>
                        <p class="text-secondary font-semibold">₹${item.price} x ${item.quantity}</p>
                    </div>
                    <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700 p-2">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>`;
            }).join('');

            document.getElementById('cartTotal').innerText = total;
            summary.classList.remove('hidden');
        }

        function showPage(pageName) {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-cart').classList.add('hidden');
            document.getElementById(`page-${pageName}`).classList.remove('hidden');
            
            if (pageName === 'cart') renderCartPage();
        }

        // ==========================================
        // 3. CHECKOUT & AUTHENTICATION LOGIC
        // ==========================================
        function handleCheckout() {
            if (cart.length === 0) return alert("Cart is empty!");
            
            // YEH HAI MAIN LOGIC: Check if user is logged in
            const currentUser = auth.currentUser;
            
            if (!currentUser) {
                // Agar logged in nahi hai, toh Login Modal khol do
                openModal();
            } else {
                // Agar logged in hai, toh order place kar do
                alert(`✅ Order Placed Successfully!\nTotal: ₹${document.getElementById('cartTotal').innerText}\nThank you, ${currentUser.displayName || currentUser.email}!`);
                cart = [];
                saveCart();
                updateCartUI();
                showPage('home');
            }
        }

        // Auth Modal Functions
        function openModal() { document.getElementById('authModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('authModal').classList.add('hidden'); hideError(); }
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg; el.classList.remove('hidden');
        }
        function hideError() { document.getElementById('errorMsg').classList.add('hidden'); }

        async function handleEmailLogin() {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passInput').value;
            if(!email || !pass) return showError("Please fill all fields");
            
            document.getElementById('loaderEmail').style.display = 'block';
            hideError();
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                closeModal();
                // Login ke baad automatically checkout trigger karein
                handleCheckout(); 
            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loaderEmail').style.display = 'none';
            }
        }

        async function handleGoogleLogin() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                await auth.signInWithPopup(provider);
                closeModal();
                handleCheckout();
            } catch (error) {
                showError(error.message);
            }
        }

        function updateHeader(user) {
            const section = document.getElementById('userSection');
            if(user) {
                const name = user.displayName || user.email.split('@')[0];
                const img = user.photoURL || `https://ui-avatars.com/api/?name=${name}&background=0F2C59&color=fff`;
                section.innerHTML = `
                    <div class="flex items-center gap-3 cursor-pointer">
                        <img src="${img}" class="w-9 h-9 rounded-full border-2 border-white shadow-sm">
                        <div class="hidden md:block text-right">
                            <p class="text-sm font-bold text-primary leading-none">${name}</p>
                            <button onclick="logout()" class="text-[10px] text-red-500 font-semibold hover:text-red-700">Logout</button>
                        </div>
                    </div>`;
            } else {
                section.innerHTML = `
                    <button onclick="openModal()" class="flex items-center gap-2 text-primary hover:text-secondary transition">
                        <i class="fa-regular fa-user text-xl"></i>
                        <span class="font-semibold hidden sm:block">Login</span>
                    </button>`;
            }
        }

        function logout() {
            auth.signOut().then(() => updateHeader(null));
        }

        // Initialize
        window.onload = () => {
            renderProducts();
            updateCartUI();
            auth.onAuthStateChanged((user) => updateHeader(user));
        };
    </script>
</body>
</html>
