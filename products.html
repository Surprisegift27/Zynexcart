<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Shop groceries, snacks, beauty, personal care and household products on ZynexCart."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>Products — ZynexCart</title>


  <!-- =================================================
       ZYNEXCART — MODULAR CSS
       ================================================= -->

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


  <!-- =================================================
       HEADER
       EXISTING HEADER — UNCHANGED
       ================================================= -->

  <header class="site-header">

    <div class="container header-inner">

      <!-- LOGO -->

      <a
        href="index.html"
        class="logo"
      >

        <img
          src="assets/logo.png"
          alt="ZynexCart"
        >

      </a>


      <!-- SHOP PRODUCTS -->

      <a
        href="products.html"
        class="location-btn"
      >
        📍 Shop Products
      </a>


      <!-- SEARCH -->

      <form
        class="search-box"
        id="searchForm"
        role="search"
      >

        <input
          type="search"
          id="searchInput"
          placeholder="Search products..."
          autocomplete="off"
          aria-label="Search products"
          spellcheck="false"
        >

        <button
          type="submit"
          aria-label="Search"
        >
          🔍
        </button>

      </form>


      <!-- HEADER ACTIONS -->

      <nav
        class="header-actions"
        aria-label="Account and cart"
      >

        <a
          href="login.html"
          class="account-link"
        >
          👤 Login
        </a>


        <a
          href="cart.html"
          class="cart-link"
        >

          🛒 Cart

          <span id="cartCount">
            0
          </span>

        </a>

      </nav>

    </div>

  </header>



  <!-- =================================================
       CATEGORY NAVIGATION
       STICKY CATEGORY BAR
       ================================================= -->

  <nav
    class="products-category-bar"
    id="productsCategoryBar"
    aria-label="Shop categories"
  >

    <div
      class="products-category-bar-inner"
      id="productsCategoryBarInner"
    >
      <!-- Categories rendered by JavaScript -->
    </div>

  </nav>



  <!-- =================================================
       PRODUCTS PAGE
       ================================================= -->

  <main class="container products-page">


    <!-- =================================================
         PAGE HEADING
         ================================================= -->

    <section class="page-heading">

      <h1 id="productsPageTitle">
        All Products 🛍️
      </h1>

      <p id="productsPageDescription">
        Shop your daily essentials at ZynexCart.
      </p>

    </section>



    <!-- =================================================
         SEARCH RESULT INFORMATION
         ================================================= -->

    <div
      id="searchResultInfo"
      class="search-result-info"
      hidden
    >

      <strong id="searchResultText"></strong>

    </div>



    <!-- =================================================
         SHOP LAYOUT
         LEFT CATEGORY SIDEBAR
         RIGHT PRODUCTS
         ================================================= -->

    <div class="products-shop-layout">


      <!-- =================================================
           LEFT CATEGORY SIDEBAR
           ================================================= -->

      <aside
        class="products-category-sidebar"
        id="productsCategorySidebar"
        aria-label="Product categories"
      >

        <div class="products-sidebar-header">

          <h2>
            Categories
          </h2>

        </div>


        <div
          class="products-sidebar-list"
          id="productsSidebarList"
        >
          <!-- Categories rendered by JavaScript -->
        </div>

      </aside>



      <!-- =================================================
           RIGHT PRODUCTS AREA
           ================================================= -->

      <section
        class="products-results"
        aria-label="Products"
      >

        <div
          class="product-grid"
          id="productsGrid"
        >
          <!-- Products rendered by JavaScript -->
        </div>


        <!-- =================================================
             NO PRODUCTS
             ================================================= -->

        <div
          id="noProducts"
          class="products-empty-state"
          style="display: none;"
          role="status"
          aria-live="polite"
        >

          <div
            class="products-empty-icon"
            aria-hidden="true"
          >
            🔍
          </div>

          <div
            class="products-empty-content"
          >

            <h2>
              No products found
            </h2>

            <p>
              Try another search or category.
            </p>

          </div>

        </div>

      </section>

    </div>

  </main>



  <!-- =================================================
       FOOTER
       ================================================= -->

  <footer class="site-footer">

    <div class="container">

      <div class="footer-bottom">

        <p>
          © 2026 ZynexCart. All rights reserved.
        </p>

      </div>

    </div>

  </footer>



  <!-- =================================================
       JAVASCRIPT
       ================================================= -->

  <script src="js/core/storage.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/events.js"></script>

  <!-- CATEGORY DATA -->
  <script src="js/categories.js"></script>

  <!-- CART -->
  <script src="js/cart/cart.js"></script>
  <script src="js/cart/cart-actions.js"></script>
  <script src="js/cart/cart-ui.js"></script>

  <!-- SEARCH -->
  <script src="js/search/search.js"></script>

  <!-- LOCATION -->
  <script src="js/location/location.js"></script>
  <script src="js/location/location-ui.js"></script>
  <script src="js/location/location-search.js"></script>
  <script src="js/location/location-map.js"></script>
  <script src="js/location/location-address.js"></script>
  <script src="js/location/saved-addresses.js"></script>

  <!-- APPLICATION -->
  <script src="js/app.js"></script>

  <!-- PRODUCTS -->
  <script src="js/products.js"></script>



  <!-- =================================================
       PRODUCTS PAGE LOGIC
       ================================================= -->

  <script>

    (function () {

      "use strict";


      if (
        window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__
      ) {
        return;
      }


      window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__ =
        true;



      /* =========================================
         INITIALIZE PRODUCTS PAGE
      ========================================= */

      function initializeProductsPage() {

        const productsGrid =
          document.getElementById(
            "productsGrid"
          );

        const noProducts =
          document.getElementById(
            "noProducts"
          );

        const searchInput =
          document.getElementById(
            "searchInput"
          );

        const pageTitle =
          document.getElementById(
            "productsPageTitle"
          );

        const pageDescription =
          document.getElementById(
            "productsPageDescription"
          );

        const searchResultInfo =
          document.getElementById(
            "searchResultInfo"
          );

        const searchResultText =
          document.getElementById(
            "searchResultText"
          );

        const sidebarList =
          document.getElementById(
            "productsSidebarList"
          );

        const categoryBarInner =
          document.getElementById(
            "productsCategoryBarInner"
          );


        if (
          !productsGrid ||
          !noProducts ||
          !sidebarList ||
          !categoryBarInner
        ) {

          console.error(
            "ZynexCart: Products page elements not found."
          );

          return;

        }



        /* =========================================
           CATEGORY DATA
        ========================================= */

        const categories =
          Array.isArray(
            window.ZynexCartCategories
          )
            ? window.ZynexCartCategories
            : [];



        /* =========================================
           NORMALIZE
        ========================================= */

        function normalizeSearch(
          value
        ) {

          return String(
            value || ""
          )
            .toLowerCase()
            .trim()
            .replace(
              /\s+/g,
              " "
            );

        }



        /* =========================================
           CATEGORY LOOKUP
        ========================================= */

        function getCategoryById(
          categoryId
        ) {

          return categories.find(
            function (category) {

              return (
                String(category.id) ===
                String(categoryId)
              );

            }
          ) || null;

        }



        /* =========================================
           PRODUCTS BY CATEGORY
        ========================================= */

        function getProductsByCategoryId(
          categoryId
        ) {

          if (!categoryId) {
            return [];
          }


          return products.filter(
            function (product) {

              return (
                String(
                  product.categoryId || ""
                ) ===
                String(categoryId)
              );

            }
          );

        }



        /* =========================================
           RENDER CATEGORY BAR
        ========================================= */

        function renderCategoryBar(
          activeCategory
        ) {

          const allItem = `
            <a
              href="products.html"
              class="products-category-bar-item ${
                !activeCategory
                  ? "active"
                  : ""
              }"
              data-category="all"
            >
              All
            </a>
          `;


          const categoryItems =
            categories
              .map(
                function (category) {

                  return `
                    <a
                      href="products.html?category=${encodeURIComponent(
                        category.id
                      )}"
                      class="products-category-bar-item ${
                        String(
                          activeCategory
                        ) ===
                        String(
                          category.id
                        )
                          ? "active"
                          : ""
                      }"
                      data-category="${category.id}"
                    >
                      ${category.name}
                    </a>
                  `;

                }
              )
              .join("");


          categoryBarInner.innerHTML =
            allItem + categoryItems;

        }



        /* =========================================
           RENDER SIDEBAR
        ========================================= */

        function renderSidebar(
          activeCategory
        ) {

          const allItem = `
            <a
              href="products.html"
              class="products-sidebar-item ${
                !activeCategory
                  ? "active"
                  : ""
              }"
              data-category="all"
            >

              <span class="products-sidebar-image">

                <span
                  class="products-sidebar-all-icon"
                  aria-hidden="true"
                >
                  🛍️
                </span>

              </span>

              <span class="products-sidebar-name">
                All Products
              </span>

            </a>
          `;


          const categoryItems =
            categories
              .map(
                function (category) {

                  return `
                    <a
                      href="products.html?category=${encodeURIComponent(
                        category.id
                      )}"
                      class="products-sidebar-item ${
                        String(
                          activeCategory
                        ) ===
                        String(
                          category.id
                        )
                          ? "active"
                          : ""
                      }"
                      data-category="${category.id}"
                    >

                      <span
                        class="products-sidebar-image"
                      >

                        <img
                          src="${category.image}"
                          alt=""
                          loading="lazy"
                        >

                      </span>

                      <span
                        class="products-sidebar-name"
                      >
                        ${category.name}
                      </span>

                    </a>
                  `;

                }
              )
              .join("");


          sidebarList.innerHTML =
            allItem + categoryItems;

        }



        /* =========================================
           DISPLAY PRODUCTS
        ========================================= */

        function displayProducts(
          list
        ) {

          if (
            !Array.isArray(list) ||
            list.length === 0
          ) {

            productsGrid.innerHTML =
              "";

            noProducts.style.display =
              "flex";

            return;

          }


          noProducts.style.display =
            "none";


          productsGrid.innerHTML =
            list
              .map(
                function (product) {

                  return `

                    <article
                      class="product-card"
                      data-product-id="${product.id}"
                    >

                      <a
                        href="product.html?id=${encodeURIComponent(
                          product.id
                        )}"
                        class="product-card-link"
                        aria-label="View ${product.name}"
                      >

                        <div
                          class="product-image"
                        >

                          <img
                            src="${product.image}"
                            alt="${product.name}"
                            loading="lazy"
                            onerror="this.style.display='none'"
                          >

                        </div>


                        <div
                          class="product-info"
                        >

                          <span
                            class="product-category"
                          >
                            ${formatCategory(
                              product.category
                            )}
                          </span>


                          <h3>
                            ${product.name}
                          </h3>


                          <p
                            class="product-unit"
                          >
                            ${product.unit}
                          </p>


                          <div
                            class="product-price"
                          >

                            <strong>
                              ${formatPrice(
                                product.price
                              )}
                            </strong>


                            <span
                              class="product-mrp"
                            >
                              ${formatPrice(
                                product.mrp
                              )}
                            </span>


                            <span
                              class="product-discount"
                            >
                              ${product.discount}% OFF
                            </span>

                          </div>

                        </div>

                      </a>


                      <button
                        class="add-btn"
                        data-product-id="${product.id}"
                        type="button"
                      >
                        ADD
                      </button>

                    </article>

                  `;

                }
              )
              .join("");


          setupProductButtons();

        }



        /* =========================================
           PRODUCT BUTTONS
        ========================================= */

        function setupProductButtons() {

          const addButtons =
            productsGrid.querySelectorAll(
              ".add-btn[data-product-id]"
            );


          addButtons.forEach(
            function (button) {

              if (
                button.dataset.bound ===
                "true"
              ) {
                return;
              }


              button.dataset.bound =
                "true";


              const productId =
                Number(
                  button.dataset.productId
                );


              const product =
                products.find(
                  function (item) {

                    return (
                      Number(item.id) ===
                      productId
                    );

                  }
                );


              if (!product) {
                return;
              }



              function getQuantity() {

                if (
                  typeof getCart !==
                  "function"
                ) {
                  return 0;
                }


                const cart =
                  getCart();


                if (
                  !Array.isArray(cart)
                ) {
                  return 0;
                }


                const cartItem =
                  cart.find(
                    function (item) {

                      return (
                        Number(item.id) ===
                        productId
                      );

                    }
                  );


                return cartItem
                  ? Number(
                      cartItem.quantity || 0
                    )
                  : 0;

              }



              function updateButton() {

                const quantity =
                  getQuantity();


                if (
                  quantity <= 0
                ) {

                  button.classList.remove(
                    "added"
                  );

                  button.innerHTML =
                    "ADD";

                  return;

                }


                button.classList.add(
                  "added"
                );


                button.innerHTML = `

                  <span
                    class="qty-minus"
                  >
                    −
                  </span>

                  <span
                    class="qty-number"
                    aria-live="polite"
                  >
                    ${quantity}
                  </span>

                  <span
                    class="qty-plus"
                  >
                    +
                  </span>

                `;

              }


              updateButton();



              button.addEventListener(
                "click",
                function (event) {

                  event.preventDefault();
                  event.stopPropagation();


                  const clickedElement =
                    event.target;


                  if (
                    clickedElement.classList.contains(
                      "qty-plus"
                    )
                  ) {

                    if (
                      typeof changeCartQuantity ===
                      "function"
                    ) {

                      changeCartQuantity(
                        productId,
                        1
                      );

                    }


                    updateButton();

                    return;

                  }


                  if (
                    clickedElement.classList.contains(
                      "qty-minus"
                    )
                  ) {

                    if (
                      typeof changeCartQuantity ===
                      "function"
                    ) {

                      changeCartQuantity(
                        productId,
                        -1
                      );

                    }


                    updateButton();

                    return;

                  }


                  if (
                    typeof addToCart ===
                    "function"
                  ) {

                    addToCart(
                      product
                    );

                  }


                  updateButton();

                }
              );

            }
          );

        }



        /* =========================================
           FILTER PRODUCTS
        ========================================= */

        function filterProducts(
          categoryId
        ) {

          if (
            !categoryId ||
            categoryId === "all"
          ) {

            displayProducts(
              products
            );

            return;

          }


          const categoryProducts =
            getProductsByCategoryId(
              categoryId
            );


          displayProducts(
            categoryProducts
          );

        }



        /* =========================================
           SEARCH RESULTS
        ========================================= */

        function getSearchResults(
          searchTerm
        ) {

          const query =
            normalizeSearch(
              searchTerm
            );


          if (!query) {
            return [];
          }


          if (
            window.ZynexCartSearch &&
            typeof
              window.ZynexCartSearch.searchProducts ===
                "function"
          ) {

            return window.ZynexCartSearch
              .searchProducts(
                query
              );

          }


          return products.filter(
            function (product) {

              return (
                normalizeSearch(
                  product.name
                ).includes(query) ||
                normalizeSearch(
                  product.category
                ).includes(query) ||
                normalizeSearch(
                  product.unit
                ).includes(query)
              );

            }
          );

        }



        /* =========================================
           CATEGORY PAGE INFORMATION
        ========================================= */

        function showCategoryInfo(
          categoryId,
          resultCount
        ) {

          const category =
            getCategoryById(
              categoryId
            );


          if (
            searchResultInfo
          ) {

            searchResultInfo.hidden =
              true;

          }


          if (
            pageTitle
          ) {

            pageTitle.textContent =
              category
                ? category.name
                : "Products";

          }


          if (
            pageDescription
          ) {

            pageDescription.textContent =
              category
                ? category.description ||
                  `${resultCount} products available`
                : `${resultCount} products available`;

          }

        }



        /* =========================================
           SEARCH INFORMATION
        ========================================= */

        function showSearchResultInfo(
          searchTerm,
          resultCount
        ) {

          if (
            searchResultInfo
          ) {

            searchResultInfo.hidden =
              false;

          }


          if (
            searchResultText
          ) {

            searchResultText.textContent =
              `Showing results for "${searchTerm}"`;

          }


          if (
            pageTitle
          ) {

            pageTitle.textContent =
              "Search Results";

          }


          if (
            pageDescription
          ) {

            pageDescription.textContent =
              `${resultCount} ${
                resultCount === 1
                  ? "product"
                  : "products"
              } found`;

          }

        }



        /* =========================================
           CLEAR INFORMATION
        ========================================= */

        function clearPageInfo() {

          if (
            searchResultInfo
          ) {

            searchResultInfo.hidden =
              true;

          }


          if (
            searchResultText
          ) {

            searchResultText.textContent =
              "";

          }


          if (
            pageTitle
          ) {

            pageTitle.textContent =
              "All Products 🛍️";

          }


          if (
            pageDescription
          ) {

            pageDescription.textContent =
              "Shop your daily essentials at ZynexCart.";

          }

        }



        /* =========================================
           APPLY SEARCH
        ========================================= */

        function applySearch(
          searchTerm
        ) {

          const cleanSearch =
            String(
              searchTerm || ""
            )
              .trim()
              .replace(
                /\s+/g,
                " "
              );


          if (!cleanSearch) {

            clearPageInfo();

            renderCategoryBar(
              null
            );

            renderSidebar(
              null
            );

            displayProducts(
              products
            );

            return;

          }


          if (
            searchInput
          ) {

            searchInput.value =
              cleanSearch;

          }


          const results =
            getSearchResults(
              cleanSearch
            );


          showSearchResultInfo(
            cleanSearch,
            results.length
          );


          renderCategoryBar(
            null
          );

          renderSidebar(
            null
          );


          displayProducts(
            results
          );

        }



        /* =========================================
           APPLY CATEGORY
        ========================================= */

        function applyCategory(
          categoryId
        ) {

          const categoryProducts =
            getProductsByCategoryId(
              categoryId
            );


          const category =
            getCategoryById(
              categoryId
            );


          renderCategoryBar(
            category
              ? category.id
              : null
          );


          renderSidebar(
            category
              ? category.id
              : null
          );


          if (
            searchInput
          ) {

            searchInput.value =
              "";

          }


          if (
            window.ZynexCartSearch &&
            typeof
              window.ZynexCartSearch.hideSuggestions ===
                "function"
          ) {

            window.ZynexCartSearch
              .hideSuggestions();

          }


          if (
            categoryProducts.length > 0
          ) {

            showCategoryInfo(
              categoryId,
              categoryProducts.length
            );


            displayProducts(
              categoryProducts
            );


            return;

          }


          clearPageInfo();


          displayProducts(
            []
          );

        }



        /* =========================================
           CATEGORY NAVIGATION
        ========================================= */

        function setupCategoryNavigation() {

          function handleCategoryClick(
            event
          ) {

            const link =
              event.target.closest(
                "[data-category]"
              );


            if (!link) {
              return;
            }


            const categoryId =
              link.dataset.category;


            if (!categoryId) {
              return;
            }


            event.preventDefault();


            const url =
              new URL(
                window.location.href
              );


            url.searchParams.delete(
              "search"
            );


            if (
              categoryId ===
              "all"
            ) {

              url.searchParams.delete(
                "category"
              );

            } else {

              url.searchParams.set(
                "category",
                categoryId
              );

            }


            window.history.pushState(
              {},
              "",
              url
            );


            if (
              categoryId ===
              "all"
            ) {

              clearPageInfo();

              renderCategoryBar(
                null
              );

              renderSidebar(
                null
              );

              displayProducts(
                products
              );

            } else {

              applyCategory(
                categoryId
              );

            }

          }


          categoryBarInner.addEventListener(
            "click",
            handleCategoryClick
          );


          sidebarList.addEventListener(
            "click",
            handleCategoryClick
          );

        }



        /* =========================================
           BROWSER BACK / FORWARD
        ========================================= */

        function handleHistoryChange() {

          const params =
            new URLSearchParams(
              window.location.search
            );


          const search =
            params.get(
              "search"
            );


          const category =
            params.get(
              "category"
            );


          if (
            search &&
            search.trim()
          ) {

            applySearch(
              search
            );

            return;

          }


          if (
            category &&
            category.trim()
          ) {

            applyCategory(
              category
            );

            return;

          }


          clearPageInfo();

          renderCategoryBar(
            null
          );

          renderSidebar(
            null
          );

          displayProducts(
            products
          );

        }


        window.addEventListener(
          "popstate",
          handleHistoryChange
        );



        /* =========================================
           CART UPDATE
        ========================================= */

        document.addEventListener(
          "zynexcart:cartUpdated",
          function () {

            const visibleButtons =
              productsGrid.querySelectorAll(
                ".add-btn[data-product-id]"
              );


            visibleButtons.forEach(
              function (button) {

                const productId =
                  Number(
                    button.dataset.productId
                  );


                const product =
                  products.find(
                    function (item) {

                      return (
                        Number(item.id) ===
                        productId
                      );

                    }
                  );


                if (!product) {
                  return;
                }


                const cart =
                  typeof getCart ===
                  "function"
                    ? getCart()
                    : [];


                const cartItem =
                  Array.isArray(cart)
                    ? cart.find(
                        function (item) {

                          return (
                            Number(item.id) ===
                            productId
                          );

                        }
                      )
                    : null;


                const quantity =
                  cartItem
                    ? Number(
                        cartItem.quantity || 0
                      )
                    : 0;


                if (
                  quantity <= 0
                ) {

                  button.classList.remove(
                    "added"
                  );

                  button.innerHTML =
                    "ADD";

                  return;

                }


                button.classList.add(
                  "added"
                );


                button.innerHTML = `

                  <span
                    class="qty-minus"
                  >
                    −
                  </span>

                  <span
                    class="qty-number"
                    aria-live="polite"
                  >
                    ${quantity}
                  </span>

                  <span
                    class="qty-plus"
                  >
                    +
                  </span>

                `;

              }
            );

          }
        );



        /* =========================================
           CATEGORY NAVIGATION
        ========================================= */

        setupCategoryNavigation();



        /* =========================================
           INITIAL PAGE STATE
        ========================================= */

        const params =
          new URLSearchParams(
            window.location.search
          );


        const search =
          params.get(
            "search"
          );


        const category =
          params.get(
            "category"
          );


        if (
          search &&
          search.trim()
        ) {

          applySearch(
            search
          );

        }

        else if (
          category &&
          category.trim()
        ) {

          applyCategory(
            category
          );

        }

        else {

          clearPageInfo();

          renderCategoryBar(
            null
          );

          renderSidebar(
            null
          );

          displayProducts(
            products
          );

        }

      }



      /* =========================================
         INITIALIZE
      ========================================= */

      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          initializeProductsPage,
          {
            once: true
          }
        );

      }

      else {

        initializeProductsPage();

      }

    })();

  </script>

</body>

</html>
