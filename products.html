<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Shop groceries and everyday essentials on ZynexCart."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>Products — ZynexCart</title>


  <!-- =====================================================
       ZYNEXCART — CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/base.css"
  >

  <link
    rel="stylesheet"
    href="css/header.css"
  >

  <link
    rel="stylesheet"
    href="css/products.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

</head>


<body>


  <!-- =====================================================
       HEADER
       SAME HEADER AS HOME PAGE
  ====================================================== -->

  <div id="header-component"></div>


  <!-- =====================================================
       PRODUCTS PAGE
  ====================================================== -->

  <main class="products-page">


    <!-- ===================================================
         BREADCRUMB + CATEGORY HEADER
    ==================================================== -->

    <section class="products-hero">

      <div class="products-container">

        <nav
          class="products-breadcrumb"
          aria-label="Breadcrumb"
        >

          <a href="index.html">
            Home
          </a>

          <span aria-hidden="true">
            ›
          </span>

          <strong id="breadcrumbCategory">
            All Products
          </strong>

        </nav>


        <div class="products-heading-row">

          <div class="products-heading">

            <span class="products-eyebrow">
              SHOP BY CATEGORY
            </span>

            <h1 id="productsPageTitle">
              All Products
            </h1>

            <p id="productsPageDescription">
              Shop your daily essentials at ZynexCart.
            </p>

          </div>


          <div
            class="products-count"
            id="productsCount"
          >
            0 products
          </div>

        </div>

      </div>

    </section>



    <!-- ===================================================
         PRODUCTS CONTENT
    ==================================================== -->

    <section class="products-content">

      <div class="products-container products-layout">


        <!-- =================================================
             LEFT CATEGORY NAVIGATION
        ================================================== -->

        <aside
          class="products-sidebar"
          aria-label="Category navigation"
        >

          <div class="products-sidebar-card">

            <div class="products-sidebar-title">
              Shop
            </div>


            <nav
              class="subcategory-nav"
              id="subcategoryNav"
            >

              <!--
                Subcategories are rendered
                by JavaScript.
              -->

            </nav>

          </div>

        </aside>



        <!-- =================================================
             RIGHT PRODUCTS AREA
        ================================================== -->

        <div class="products-main">


          <!-- ===============================================
               PRODUCTS TOOLBAR
          ================================================ -->

          <div class="products-toolbar">

            <div>

              <h2 id="productsSectionTitle">
                All Products
              </h2>

              <p id="productsSectionDescription">
                Everything you need, delivered fast.
              </p>

            </div>


            <div
              class="products-toolbar-count"
              id="productsToolbarCount"
            >
              0 products
            </div>

          </div>



          <!-- ===============================================
               SEARCH RESULT
          ================================================ -->

          <div
            id="searchResultInfo"
            class="search-result-info"
            hidden
          >

            <strong id="searchResultText"></strong>

          </div>



          <!-- ===============================================
               PRODUCT GRID
          ================================================ -->

          <section
            aria-label="Products"
          >

            <div
              class="product-grid"
              id="productsGrid"
            >

              <!-- Products rendered by JavaScript -->

            </div>



            <!-- =============================================
                 NO PRODUCTS
            ============================================== -->

            <div
              id="noProducts"
              class="products-empty-state"
              style="display: none;"
              role="status"
              aria-live="polite"
            >

              <div
                class="products-empty-icon"
                aria-hidden="true"
              >
                🛒
              </div>

              <div class="products-empty-content">

                <h2>
                  No products found
                </h2>

                <p id="noProductsMessage">
                  No products are currently available in this category.
                </p>

              </div>

            </div>

          </section>


        </div>

      </div>

    </section>


  </main>



  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <div id="footer-component"></div>



  <!-- =====================================================
       ZYNEXCART — COMPONENT + SCRIPT LOADER
  ====================================================== -->

  <script>

    (function () {

      "use strict";


      if (
        window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__
      ) {
        return;
      }


      window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__ =
        true;



      /* ===================================================
         LOAD HTML COMPONENT
      ==================================================== */

      async function loadComponent(
        elementId,
        filePath
      ) {

        const element =
          document.getElementById(
            elementId
          );


        if (!element) {

          console.warn(
            `ZynexCart: Element #${elementId} not found.`
          );

          return false;

        }


        try {

          const response =
            await fetch(
              filePath,
              {
                cache: "no-cache"
              }
            );


          if (!response.ok) {

            throw new Error(
              `Unable to load ${filePath}`
            );

          }


          const html =
            await response.text();


          element.innerHTML =
            html;


          return true;


        } catch (error) {

          console.error(
            "ZynexCart component error:",
            error
          );


          return false;

        }

      }



      /* ===================================================
         LOAD JAVASCRIPT
      ==================================================== */

      function loadScript(
        src
      ) {

        return new Promise(
          function (resolve, reject) {

            const existingScript =
              document.querySelector(
                `script[data-zynexcart-script="${src}"]`
              );


            if (existingScript) {

              resolve();

              return;

            }


            const script =
              document.createElement(
                "script"
              );


            script.src =
              src;


            script.async =
              false;


            script.dataset.zynexcartScript =
              src;


            script.onload =
              function () {

                resolve();

              };


            script.onerror =
              function () {

                reject(
                  new Error(
                    `Unable to load script: ${src}`
                  )
                );

              };


            document.body.appendChild(
              script
            );

          }
        );

      }



      /* ===================================================
         COMPONENTS
      ==================================================== */

      const components = [

        [
          "header-component",
          "components/header.html"
        ],

        [
          "footer-component",
          "components/footer.html"
        ]

      ];



      /* ===================================================
         JAVASCRIPT MODULES
         
         SAME DEPENDENCY ORDER AS HOME PAGE
      ==================================================== */

      const scripts = [

        /* CORE */

        "js/core/storage.js",
        "js/core/utils.js",
        "js/core/events.js",


        /* CATEGORY */

        "js/categories.js",


        /* CART */

        "js/cart/cart.js",
        "js/cart/cart-actions.js",
        "js/cart/cart-ui.js",


        /* SEARCH */

        "js/search/search.js",


        /* LOCATION */

        "js/location/location.js",
        "js/location/location-ui.js",
        "js/location/location-search.js",
        "js/location/location-map.js",
        "js/location/location-address.js",
        "js/location/saved-addresses.js",


        /* APPLICATION */

        "js/app.js",


        /* PRODUCTS */

        "js/products.js"

      ];



      /* ===================================================
         GET SELECTED CATEGORY
      ==================================================== */

      function getSelectedCategory() {

        const params =
          new URLSearchParams(
            window.location.search
          );


        return (
          params.get("category") || ""
        ).trim();

      }



      /* ===================================================
         RENDER SUBCATEGORY NAVIGATION
      ==================================================== */

      function renderSubcategoryNavigation() {

        const nav =
          document.getElementById(
            "subcategoryNav"
          );


        if (!nav) {
          return;
        }


        const categoryId =
          getSelectedCategory();


        const categories =
          Array.isArray(
            window.ZynexCartCategories
          )
            ? window.ZynexCartCategories
            : [];


        const category =
          categories.find(
            function (item) {

              return (
                String(item.id) ===
                String(categoryId)
              );

            }
          );


        nav.innerHTML =
          "";


        /* ===============================================
           ALL PRODUCTS
        ================================================ */

        const allLink =
          document.createElement(
            "a"
          );


        allLink.href =
          categoryId
            ? `products.html?category=${encodeURIComponent(
                categoryId
              )}`
            : "products.html";


        allLink.className =
          "subcategory-item active";


        allLink.dataset.subcategory =
          "";


        allLink.innerHTML = `
          <span>
            All Products
          </span>

          <span
            class="subcategory-arrow"
            aria-hidden="true"
          >
            ›
          </span>
        `;


        nav.appendChild(
          allLink
        );


        /* ===============================================
           CATEGORY SUBCATEGORIES
        ================================================ */

        if (
          !category ||
          !Array.isArray(
            category.subcategories
          )
        ) {

          return;

        }


        category.subcategories.forEach(
          function (subcategory) {

            const link =
              document.createElement(
                "a"
              );


            const url =
              new URL(
                "products.html",
                window.location.href
              );


            if (categoryId) {

              url.searchParams.set(
                "category",
                categoryId
              );

            }


            url.searchParams.set(
              "subcategory",
              subcategory.id
            );


            link.href =
              url.toString();


            link.className =
              "subcategory-item";


            link.dataset.subcategory =
              subcategory.id;


            link.innerHTML = `
              <span>
                ${subcategory.name}
              </span>

              <span
                class="subcategory-arrow"
                aria-hidden="true"
              >
                ›
              </span>
            `;


            nav.appendChild(
              link
            );

          }
        );



        /* ===============================================
           ACTIVE SUBCATEGORY
        ================================================ */

        const params =
          new URLSearchParams(
            window.location.search
          );


        const selectedSubcategory =
          params.get(
            "subcategory"
          );


        if (
          selectedSubcategory
        ) {

          const activeItem =
            nav.querySelector(
              `[data-subcategory="${CSS.escape(
                selectedSubcategory
              )}"]`
            );


          if (activeItem) {

            nav.querySelectorAll(
              ".subcategory-item"
            ).forEach(
              function (item) {

                item.classList.remove(
                  "active"
                );

              }
            );


            activeItem.classList.add(
              "active"
            );

          }

        }

      }



      /* ===================================================
         UPDATE CATEGORY INFORMATION
      ==================================================== */

      function updateCategoryInformation() {

        const categoryId =
          getSelectedCategory();


        const categories =
          Array.isArray(
            window.ZynexCartCategories
          )
            ? window.ZynexCartCategories
            : [];


        const category =
          categories.find(
            function (item) {

              return (
                String(item.id) ===
                String(categoryId)
              );

            }
          );


        const title =
          document.getElementById(
            "productsPageTitle"
          );


        const description =
          document.getElementById(
            "productsPageDescription"
          );


        const breadcrumb =
          document.getElementById(
            "breadcrumbCategory"
          );


        if (category) {

          if (title) {

            title.textContent =
              category.name;

          }


          if (description) {

            description.textContent =
              category.description ||
              "Shop everyday essentials at ZynexCart.";

          }


          if (breadcrumb) {

            breadcrumb.textContent =
              category.name;

          }

          return;

        }


        if (title) {

          title.textContent =
            "All Products";

        }


        if (description) {

          description.textContent =
            "Shop your daily essentials at ZynexCart.";

        }


        if (breadcrumb) {

          breadcrumb.textContent =
            "All Products";

        }

      }



      /* ===================================================
         UPDATE PRODUCT COUNT
      ==================================================== */

      function updateProductCount() {

        const grid =
          document.getElementById(
            "productsGrid"
          );


        if (!grid) {
          return;
        }


        const cards =
          grid.querySelectorAll(
            ".product-card"
          );


        const count =
          cards.length;


        const countText =
          `${count} ${
            count === 1
              ? "product"
              : "products"
          }`;


        const topCount =
          document.getElementById(
            "productsCount"
          );


        const toolbarCount =
          document.getElementById(
            "productsToolbarCount"
          );


        if (topCount) {

          topCount.textContent =
            countText;

        }


        if (toolbarCount) {

          toolbarCount.textContent =
            countText;

        }

      }



      /* ===================================================
         INITIALIZE PRODUCTS PAGE
      ==================================================== */

      async function initializeProductsPage() {

        try {


          /* -----------------------------------------------
             STEP 1
          ----------------------------------------------- */

          await Promise.all(

            components.map(
              function (component) {

                return loadComponent(
                  component[0],
                  component[1]
                );

              }
            )

          );


          /* -----------------------------------------------
             STEP 2
             LOAD JS MODULES
          ----------------------------------------------- */

          for (
            const scriptPath of scripts
          ) {

            await loadScript(
              scriptPath
            );

          }


          /* -----------------------------------------------
             STEP 3
             CATEGORY UI
          ----------------------------------------------- */

          updateCategoryInformation();

          renderSubcategoryNavigation();


          /* -----------------------------------------------
             STEP 4
             WAIT FOR PRODUCTS RENDER
          ----------------------------------------------- */

          setTimeout(
            function () {

              updateProductCount();

            },
            0
          );


          /* -----------------------------------------------
             STEP 5
             CART UPDATES
          ----------------------------------------------- */

          document.addEventListener(
            "zynexcart:cartUpdated",
            function () {

              updateProductCount();

            }
          );


          /* -----------------------------------------------
             STEP 6
             CATEGORY / SUBCATEGORY NAVIGATION
          ----------------------------------------------- */

          const subcategoryNav =
            document.getElementById(
              "subcategoryNav"
            );


          if (subcategoryNav) {

            subcategoryNav.addEventListener(
              "click",
              function (event) {

                const link =
                  event.target.closest(
                    ".subcategory-item"
                  );


                if (!link) {
                  return;
                }


                const url =
                  new URL(
                    link.href
                  );


                /*
                 * Normal browser navigation is
                 * intentionally preserved.
                 */

                if (
                  url.href !==
                  window.location.href
                ) {

                  return;

                }

              }
            );

          }


          console.log(
            "ZynexCart: Products page loaded successfully."
          );


        } catch (error) {

          console.error(
            "ZynexCart: Products page initialization failed.",
            error
          );

        }

      }



      /* ===================================================
         START
      ==================================================== */

      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          initializeProductsPage,
          {
            once: true
          }
        );

      } else {

        initializeProductsPage();

      }

    })();

  </script>

</body>

</html>
