<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Shop groceries, snacks, beauty, personal care and household products on ZynexCart."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>Products — ZynexCart</title>


  <!-- =================================================
       ZYNEXCART — MODULAR CSS
       ================================================= -->

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


  <!-- =================================================
       HEADER
       ================================================= -->

  <header class="site-header">

    <div class="container header-inner">


      <!-- LOGO -->

      <a
        href="index.html"
        class="logo"
      >

        <img
          src="assets/logo.png"
          alt="ZynexCart"
        >

      </a>


      <!-- SHOP PRODUCTS -->

      <a
        href="products.html"
        class="location-btn"
      >
        📍 Shop Products
      </a>


      <!-- SEARCH -->

      <form
        class="search-box"
        id="searchForm"
      >

        <input
          type="search"
          id="searchInput"
          placeholder="Search products..."
          autocomplete="off"
          aria-label="Search products"
        >

        <button
          type="submit"
          aria-label="Search"
        >
          🔍
        </button>

      </form>


      <!-- HEADER ACTIONS -->

      <nav class="header-actions">

        <a
          href="login.html"
          class="account-link"
        >
          👤 Login
        </a>


        <a
          href="cart.html"
          class="cart-link"
        >

          🛒 Cart

          <span id="cartCount">
            0
          </span>

        </a>

      </nav>

    </div>

  </header>



  <!-- =================================================
       PRODUCTS PAGE
       ================================================= -->

  <main class="container products-page">


    <!-- PAGE HEADING -->

    <section class="page-heading">

      <h1 id="productsPageTitle">
        All Products 🛍️
      </h1>

      <p id="productsPageDescription">
        Shop your daily essentials at ZynexCart.
      </p>

    </section>



    <!-- =================================================
         CATEGORY FILTERS
         ================================================= -->

    <div class="category-filters">


      <button
        class="category-filter active"
        data-category="all"
        type="button"
      >
        All
      </button>


      <button
        class="category-filter"
        data-category="grocery"
        type="button"
      >
        Grocery
      </button>


      <button
        class="category-filter"
        data-category="snacks"
        type="button"
      >
        Snacks
      </button>


      <button
        class="category-filter"
        data-category="personal-care"
        type="button"
      >
        Personal Care
      </button>


      <button
        class="category-filter"
        data-category="beverages"
        type="button"
      >
        Beverages
      </button>


      <button
        class="category-filter"
        data-category="beauty"
        type="button"
      >
        Beauty
      </button>


      <button
        class="category-filter"
        data-category="household"
        type="button"
      >
        Household
      </button>


    </div>



    <!-- =================================================
         SEARCH RESULT INFORMATION
         ================================================= -->

    <div
      id="searchResultInfo"
      class="search-result-info"
      hidden
    >

      <strong id="searchResultText"></strong>

    </div>



    <!-- =================================================
         PRODUCTS
         ================================================= -->

    <section>

      <div
        class="product-grid"
        id="productsGrid"
      >
        <!-- Products load here -->
      </div>


      <!-- NO PRODUCTS -->

      <div
        id="noProducts"
        class="empty-cart"
        style="display: none;"
      >

        <h2>
          No products found 😕
        </h2>

        <p>
          Try another search or category.
        </p>

      </div>

    </section>


  </main>



  <!-- =================================================
       FOOTER
       ================================================= -->

  <footer class="site-footer">

    <div class="container">

      <div class="footer-bottom">

        <p>
          © 2026 ZynexCart. All rights reserved.
        </p>

      </div>

    </div>

  </footer>



  <!-- =================================================
       JAVASCRIPT
       ================================================= -->

  <!-- Product data -->
  <script src="js/products.js"></script>

  <!-- Professional search engine -->
  <script src="js/search/search.js"></script>

  <!-- Application system -->
  <script src="js/app.js"></script>



  <!-- =================================================
       PRODUCTS PAGE LOGIC
       ================================================= -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        /* =================================================
           ELEMENTS
           ================================================= */

        const productsGrid =
          document.getElementById(
            "productsGrid"
          );

        const noProducts =
          document.getElementById(
            "noProducts"
          );

        const filterButtons =
          document.querySelectorAll(
            ".category-filter"
          );

        const searchInput =
          document.getElementById(
            "searchInput"
          );

        const searchForm =
          document.getElementById(
            "searchForm"
          );

        const pageTitle =
          document.getElementById(
            "productsPageTitle"
          );

        const pageDescription =
          document.getElementById(
            "productsPageDescription"
          );

        const searchResultInfo =
          document.getElementById(
            "searchResultInfo"
          );

        const searchResultText =
          document.getElementById(
            "searchResultText"
          );


        /* =================================================
           INITIALIZE SEARCH
           
           Search must work independently from app.js.
           This prevents the search system from depending
           on other application modules.
           ================================================= */

        if (
          window.ZynexCartSearch &&
          typeof
            window.ZynexCartSearch.setupSearch ===
              "function"
        ) {

          window.ZynexCartSearch.setupSearch();

        }



        /* =================================================
           DISPLAY PRODUCTS
           ================================================= */

        function displayProducts(list) {

          if (
            !Array.isArray(list) ||
            list.length === 0
          ) {

            productsGrid.innerHTML = "";

            noProducts.style.display =
              "block";

            return;

          }


          noProducts.style.display =
            "none";


          productsGrid.innerHTML =
            list
              .map(
                product => `

                  <article
                    class="product-card"
                    data-product-id="${product.id}"
                  >

                    <a
                      href="product.html?id=${encodeURIComponent(
                        product.id
                      )}"
                      class="product-card-link"
                    >

                      <div class="product-image">

                        <img
                          src="${product.image}"
                          alt="${product.name}"
                          loading="lazy"
                          onerror="this.style.display='none'"
                        >

                      </div>


                      <div class="product-info">

                        <span class="product-category">
                          ${formatCategory(
                            product.category
                          )}
                        </span>

                        <h3>
                          ${product.name}
                        </h3>

                        <p class="product-unit">
                          ${product.unit}
                        </p>


                        <div class="product-price">

                          <strong>
                            ${formatPrice(
                              product.price
                            )}
                          </strong>

                          <span class="product-mrp">
                            ${formatPrice(
                              product.mrp
                            )}
                          </span>

                          <span class="product-discount">
                            ${product.discount}% OFF
                          </span>

                        </div>

                      </div>

                    </a>


                    <!-- ADD / QUANTITY -->

                    <button
                      class="add-btn"
                      data-product-id="${product.id}"
                      type="button"
                    >
                      ADD
                    </button>

                  </article>

                `
              )
              .join("");


          setupProductButtons();

        }



        /* =================================================
           ADD / QUANTITY BUTTONS
           ================================================= */

        function setupProductButtons() {

          const addButtons =
            document.querySelectorAll(
              ".add-btn"
            );


          addButtons.forEach(
            button => {

              if (
                button.dataset.bound ===
                "true"
              ) {
                return;
              }


              button.dataset.bound =
                "true";


              const productId =
                Number(
                  button.dataset.productId
                );


              const product =
                products.find(
                  item =>
                    Number(item.id) ===
                    productId
                );


              if (!product) {
                return;
              }



              function updateButton() {

                const cart =
                  typeof getCart ===
                  "function"
                    ? getCart()
                    : [];


                const cartItem =
                  Array.isArray(cart)
                    ? cart.find(
                        item =>
                          Number(item.id) ===
                          productId
                      )
                    : null;


                const quantity =
                  cartItem
                    ? Number(
                        cartItem.quantity || 0
                      )
                    : 0;


                /* NOT IN CART */

                if (
                  quantity <= 0
                ) {

                  button.classList.remove(
                    "added"
                  );

                  button.innerHTML =
                    "ADD";

                  return;

                }


                /* IN CART */

                button.classList.add(
                  "added"
                );

                button.innerHTML = `

                  <span
                    class="qty-minus"
                  >
                    −
                  </span>

                  <span
                    class="qty-number"
                  >
                    ${quantity}
                  </span>

                  <span
                    class="qty-plus"
                  >
                    +
                  </span>

                `;

              }


              /* INITIAL STATE */

              updateButton();



              /* BUTTON CLICK */

              button.addEventListener(
                "click",
                function (event) {

                  event.preventDefault();

                  event.stopPropagation();


                  /* PLUS */

                  if (
                    event.target.classList.contains(
                      "qty-plus"
                    )
                  ) {

                    if (
                      typeof changeCartQuantity ===
                      "function"
                    ) {

                      changeCartQuantity(
                        productId,
                        1
                      );

                    }

                    updateButton();

                    return;

                  }


                  /* MINUS */

                  if (
                    event.target.classList.contains(
                      "qty-minus"
                    )
                  ) {

                    if (
                      typeof changeCartQuantity ===
                      "function"
                    ) {

                      changeCartQuantity(
                        productId,
                        -1
                      );

                    }

                    updateButton();

                    return;

                  }


                  /* ADD */

                  if (
                    typeof addToCart ===
                    "function"
                  ) {

                    addToCart(
                      product
                    );

                  }

                  updateButton();

                }
              );

            }
          );

        }



        /* =================================================
           CATEGORY FILTER
           ================================================= */

        function filterProducts(
          category
        ) {

          if (
            category ===
            "all"
          ) {

            displayProducts(
              products
            );

            return;

          }


          const filtered =
            products.filter(
              product =>
                product.category ===
                category
            );


          displayProducts(
            filtered
          );

        }



        /* =================================================
           PROFESSIONAL SEARCH
           ================================================= */

        function getSearchResults(
          searchTerm
        ) {

          const query =
            String(
              searchTerm || ""
            )
              .toLowerCase()
              .trim()
              .replace(
                /\s+/g,
                " "
              );


          if (!query) {
            return [];
          }


          /* PRIMARY SEARCH ENGINE */

          if (
            window.ZynexCartSearch &&
            typeof
              window.ZynexCartSearch.searchProducts ===
                "function"
          ) {

            return window.ZynexCartSearch
              .searchProducts(
                query
              );

          }


          /* SAFE FALLBACK */

          return products.filter(
            product => {

              const name =
                String(
                  product.name || ""
                )
                  .toLowerCase();


              const category =
                String(
                  product.category || ""
                )
                  .toLowerCase();


              const unit =
                String(
                  product.unit || ""
                )
                  .toLowerCase();


              return (
                name.includes(query) ||
                category.includes(query) ||
                unit.includes(query)
              );

            }
          );

        }



        /* =================================================
           SHOW SEARCH RESULT INFORMATION
           ================================================= */

        function showSearchResultInfo(
          searchTerm,
          resultCount
        ) {

          searchResultInfo.hidden =
            false;


          searchResultText.textContent =
            `Showing results for "${searchTerm}"`;


          pageTitle.textContent =
            "Search Results";


          pageDescription.textContent =
            `${resultCount} ${
              resultCount === 1
                ? "product"
                : "products"
            } found`;

        }



        /* =================================================
           CLEAR SEARCH RESULT INFORMATION
           ================================================= */

        function clearSearchResultInfo() {

          searchResultInfo.hidden =
            true;


          searchResultText.textContent =
            "";


          pageTitle.textContent =
            "All Products 🛍️";


          pageDescription.textContent =
            "Shop your daily essentials at ZynexCart.";

        }



        /* =================================================
           UPDATE SEARCH URL
           ================================================= */

        function updateSearchURL(
          searchTerm
        ) {

          const url =
            new URL(
              window.location.href
            );


          if (searchTerm) {

            url.searchParams.set(
              "search",
              searchTerm
            );

            url.searchParams.delete(
              "category"
            );

          } else {

            url.searchParams.delete(
              "search"
            );

          }


          window.history.replaceState(
            {},
            "",
            url
          );

        }



        /* =================================================
           APPLY SEARCH
           ================================================= */

        function applySearch(
          searchTerm
        ) {

          const cleanSearch =
            String(
              searchTerm || ""
            )
              .trim()
              .replace(
                /\s+/g,
                " "
              );


          if (!cleanSearch) {

            clearSearchResultInfo();

            displayProducts(
              products
            );

            return;

          }


          /* Keep query in search box */

          if (searchInput) {

            searchInput.value =
              cleanSearch;

          }


          /* Remove active category */

          filterButtons.forEach(
            button => {

              button.classList.remove(
                "active"
              );

            }
          );


          /* Get matching products */

          const results =
            getSearchResults(
              cleanSearch
            );


          /* Show result information */

          showSearchResultInfo(
            cleanSearch,
            results.length
          );


          /* Show ONLY matching products */

          displayProducts(
            results
          );

        }



        /* =================================================
           APPLY CATEGORY
           ================================================= */

        function applyCategory(
          category
        ) {

          const categoryButton =
            document.querySelector(
              `[data-category="${category}"]`
            );


          if (
            categoryButton
          ) {

            filterButtons.forEach(
              button => {

                button.classList.remove(
                  "active"
                );

              }
            );


            categoryButton.classList.add(
              "active"
            );

          }


          clearSearchResultInfo();

          filterProducts(
            category
          );

        }



        /* =================================================
           CATEGORY BUTTON CLICK
           ================================================= */

        filterButtons.forEach(
          button => {

            button.addEventListener(
              "click",
              function () {

                filterButtons.forEach(
                  btn => {

                    btn.classList.remove(
                      "active"
                    );

                  }
                );


                button.classList.add(
                  "active"
                );


                const category =
                  button.dataset.category;


                /* Update URL */

                const url =
                  new URL(
                    window.location.href
                  );


                url.searchParams.delete(
                  "search"
                );


                if (
                  category ===
                  "all"
                ) {

                  url.searchParams.delete(
                    "category"
                  );

                } else {

                  url.searchParams.set(
                    "category",
                    category
                  );

                }


                window.history.replaceState(
                  {},
                  "",
                  url
                );


                /* Clear search input */

                if (
                  searchInput
                ) {

                  searchInput.value =
                    "";

                }


                /* Close suggestions */

                if (
                  window.ZynexCartSearch &&
                  typeof
                    window.ZynexCartSearch.hideSuggestions ===
                      "function"
                ) {

                  window.ZynexCartSearch
                    .hideSuggestions();

                }


                /* Reset search information */

                clearSearchResultInfo();


                /* Display category */

                filterProducts(
                  category
                );

              }
            );

          }
        );



        /* =================================================
           SEARCH FORM — PAGE LEVEL SAFETY
           
           This does NOT change the search button design.
           It only guarantees form submission works.
           ================================================= */

        if (
          searchForm &&
          searchForm.dataset.productsSearchBound !==
            "true"
        ) {

          searchForm.dataset.productsSearchBound =
            "true";


          searchForm.addEventListener(
            "submit",
            function (event) {

              event.preventDefault();


              const value =
                searchInput
                  ? searchInput.value
                      .trim()
                  : "";


              if (!value) {

                if (searchInput) {
                  searchInput.focus();
                }

                return;

              }


              updateSearchURL(
                value
              );


              applySearch(
                value
              );


              if (
                window.ZynexCartSearch &&
                typeof
                  window.ZynexCartSearch.hideSuggestions ===
                    "function"
              ) {

                window.ZynexCartSearch
                  .hideSuggestions();

              }

            }
          );

        }



        /* =================================================
           URL PARAMETERS
           ================================================= */

        const params =
          new URLSearchParams(
            window.location.search
          );


        const search =
          params.get(
            "search"
          );


        const category =
          params.get(
            "category"
          );



        /* =================================================
           INITIAL PAGE STATE
           ================================================= */

        if (
          search &&
          search.trim()
        ) {

          applySearch(
            search
          );

        } else if (
          category &&
          category.trim()
        ) {

          applyCategory(
            category
          );

        } else {

          clearSearchResultInfo();

          displayProducts(
            products
          );

        }

      }
    );

  </script>

</body>

</html>
