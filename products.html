<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Shop groceries, snacks, beauty, personal care and household products on ZynexCart."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>Products — ZynexCart</title>


  <!-- =================================================
       ZYNEXCART — MODULAR CSS
       ================================================= -->

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


  <!-- =================================================
       HEADER
       ================================================= -->

  <header class="site-header">

    <div class="container header-inner">


      <!-- LOGO -->

      <a
        href="index.html"
        class="logo"
      >

        <img
          src="assets/logo.png"
          alt="ZynexCart"
        >

      </a>


      <!-- SHOP PRODUCTS -->

      <a
        href="products.html"
        class="location-btn"
      >
        📍 Shop Products
      </a>


      <!-- SEARCH -->

      <form
        class="search-box"
        id="searchForm"
        role="search"
      >

        <input
          type="search"
          id="searchInput"
          placeholder="Search products..."
          autocomplete="off"
          aria-label="Search products"
          spellcheck="false"
        >

        <button
          type="submit"
          aria-label="Search"
        >
          🔍
        </button>

      </form>


      <!-- HEADER ACTIONS -->

      <nav
        class="header-actions"
        aria-label="Account and cart"
      >

        <a
          href="login.html"
          class="account-link"
        >
          👤 Login
        </a>


        <a
          href="cart.html"
          class="cart-link"
        >

          🛒 Cart

          <span id="cartCount">
            0
          </span>

        </a>

      </nav>

    </div>

  </header>



  <!-- =================================================
       PRODUCTS PAGE
       ================================================= -->

  <main class="container products-page">


    <!-- PAGE HEADING -->

    <section class="page-heading">

      <h1 id="productsPageTitle">
        All Products 🛍️
      </h1>

      <p id="productsPageDescription">
        Shop your daily essentials at ZynexCart.
      </p>

    </section>



    <!-- =================================================
         CATEGORY FILTERS
         ================================================= -->

    <div
      class="category-filters"
      aria-label="Product categories"
    >

      <button
        class="category-filter active"
        data-category="all"
        type="button"
      >
        All
      </button>

      <button
        class="category-filter"
        data-category="grocery"
        type="button"
      >
        Grocery
      </button>

      <button
        class="category-filter"
        data-category="snacks"
        type="button"
      >
        Snacks
      </button>

      <button
        class="category-filter"
        data-category="personal-care"
        type="button"
      >
        Personal Care
      </button>

      <button
        class="category-filter"
        data-category="beverages"
        type="button"
      >
        Beverages
      </button>

      <button
        class="category-filter"
        data-category="beauty"
        type="button"
      >
        Beauty
      </button>

      <button
        class="category-filter"
        data-category="household"
        type="button"
      >
        Household
      </button>

    </div>



    <!-- =================================================
         SEARCH RESULT INFORMATION
         ================================================= -->

    <div
      id="searchResultInfo"
      class="search-result-info"
      hidden
    >

      <strong id="searchResultText"></strong>

    </div>



    <!-- =================================================
         PRODUCTS
         ================================================= -->

    <section
      aria-label="Products"
    >

      <div
        class="product-grid"
        id="productsGrid"
      >
        <!-- Products are rendered by JavaScript -->
      </div>


      <!-- =================================================
           NO PRODUCTS
           ================================================= -->

      <div
        id="noProducts"
        class="products-empty-state"
        style="display: none;"
        role="status"
        aria-live="polite"
      >

        <div
          class="products-empty-icon"
          aria-hidden="true"
        >
          🔍
        </div>

        <div class="products-empty-content">

          <h2>
            No products found
          </h2>

          <p>
            Try another search or category.
          </p>

        </div>

      </div>

    </section>


  </main>



  <!-- =================================================
       FOOTER
       ================================================= -->

  <footer class="site-footer">

    <div class="container">

      <div class="footer-bottom">

        <p>
          © 2026 ZynexCart. All rights reserved.
        </p>

      </div>

    </div>

  </footer>



  <!-- =================================================
       JAVASCRIPT
       ================================================= -->

  <script src="js/core/storage.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/events.js"></script>

  <script src="js/cart/cart.js"></script>
  <script src="js/cart/cart-actions.js"></script>
  <script src="js/cart/cart-ui.js"></script>

  <script src="js/search/search.js"></script>

  <script src="js/location/location.js"></script>
  <script src="js/location/location-ui.js"></script>
  <script src="js/location/location-search.js"></script>
  <script src="js/location/location-map.js"></script>
  <script src="js/location/location-address.js"></script>
  <script src="js/location/saved-addresses.js"></script>

  <script src="js/app.js"></script>

  <script src="js/products.js"></script>



  <!-- =================================================
       PRODUCTS PAGE LOGIC
       ================================================= -->

  <script>

    (function () {

      "use strict";


      if (
        window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__
      ) {
        return;
      }


      window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__ =
        true;


      function initializeProductsPage() {

        const productsGrid =
          document.getElementById(
            "productsGrid"
          );

        const noProducts =
          document.getElementById(
            "noProducts"
          );

        const filterButtons =
          document.querySelectorAll(
            ".category-filter"
          );

        const searchInput =
          document.getElementById(
            "searchInput"
          );

        const pageTitle =
          document.getElementById(
            "productsPageTitle"
          );

        const pageDescription =
          document.getElementById(
            "productsPageDescription"
          );

        const searchResultInfo =
          document.getElementById(
            "searchResultInfo"
          );

        const searchResultText =
          document.getElementById(
            "searchResultText"
          );


        if (
          !productsGrid ||
          !noProducts
        ) {

          console.error(
            "ZynexCart: Products page elements not found."
          );

          return;

        }


        function normalizeSearch(value) {

          return String(
            value || ""
          )
            .toLowerCase()
            .trim()
            .replace(
              /\s+/g,
              " "
            );

        }


        function displayProducts(list) {

          if (
            !Array.isArray(list) ||
            list.length === 0
          ) {

            productsGrid.innerHTML =
              "";

            noProducts.style.display =
              "flex";

            return;

          }


          noProducts.style.display =
            "none";


          productsGrid.innerHTML =
            list
              .map(
                function (product) {

                  return `

                    <article
                      class="product-card"
                      data-product-id="${product.id}"
                    >

                      <a
                        href="product.html?id=${encodeURIComponent(
                          product.id
                        )}"
                        class="product-card-link"
                        aria-label="View ${product.name}"
                      >

                        <div
                          class="product-image"
                        >

                          <img
                            src="${product.image}"
                            alt="${product.name}"
                            loading="lazy"
                            onerror="this.style.display='none'"
                          >

                        </div>


                        <div
                          class="product-info"
                        >

                          <span
                            class="product-category"
                          >
                            ${formatCategory(
                              product.category
                            )}
                          </span>


                          <h3>
                            ${product.name}
                          </h3>


                          <p
                            class="product-unit"
                          >
                            ${product.unit}
                          </p>


                          <div
                            class="product-price"
                          >

                            <strong>
                              ${formatPrice(
                                product.price
                              )}
                            </strong>


                            <span
                              class="product-mrp"
                            >
                              ${formatPrice(
                                product.mrp
                              )}
                            </span>


                            <span
                              class="product-discount"
                            >
                              ${product.discount}% OFF
                            </span>

                          </div>

                        </div>

                      </a>


                      <button
                        class="add-btn"
                        data-product-id="${product.id}"
                        type="button"
                      >
                        ADD
                      </button>

                    </article>

                  `;

                }
              )
              .join("");


          setupProductButtons();

        }


        function setupProductButtons() {

          const addButtons =
            productsGrid.querySelectorAll(
              ".add-btn[data-product-id]"
            );


          addButtons.forEach(
            function (button) {

              if (
                button.dataset.bound ===
                "true"
              ) {
                return;
              }


              button.dataset.bound =
                "true";


              const productId =
                Number(
                  button.dataset.productId
                );


              const product =
                products.find(
                  function (item) {

                    return (
                      Number(item.id) ===
                      productId
                    );

                  }
                );


              if (!product) {
                return;
              }


              function getQuantity() {

                if (
                  typeof getCart !==
                  "function"
                ) {
                  return 0;
                }


                const cart =
                  getCart();


                if (
                  !Array.isArray(cart)
                ) {
                  return 0;
                }


                const cartItem =
                  cart.find(
                    function (item) {

                      return (
                        Number(item.id) ===
                        productId
                      );

                    }
                  );


                return cartItem
                  ? Number(
                      cartItem.quantity || 0
                    )
                  : 0;

              }


              function updateButton() {

                const quantity =
                  getQuantity();


                if (
                  quantity <= 0
                ) {

                  button.classList.remove(
                    "added"
                  );

                  button.innerHTML =
                    "ADD";

                  return;

                }


                button.classList.add(
                  "added"
                );


                button.innerHTML = `

                  <span
                    class="qty-minus"
                  >
                    −
                  </span>

                  <span
                    class="qty-number"
                    aria-live="polite"
                  >
                    ${quantity}
                  </span>

                  <span
                    class="qty-plus"
                  >
                    +
                  </span>

                `;

              }


              updateButton();


              button.addEventListener(
                "click",
                function (event) {

                  event.preventDefault();
                  event.stopPropagation();


                  const clickedElement =
                    event.target;


                  if (
                    clickedElement.classList.contains(
                      "qty-plus"
                    )
                  ) {

                    if (
                      typeof changeCartQuantity ===
                      "function"
                    ) {

                      changeCartQuantity(
                        productId,
                        1
                      );

                    }


                    updateButton();

                    return;

                  }


                  if (
                    clickedElement.classList.contains(
                      "qty-minus"
                    )
                  ) {

                    if (
                      typeof changeCartQuantity ===
                      "function"
                    ) {

                      changeCartQuantity(
                        productId,
                        -1
                      );

                    }


                    updateButton();

                    return;

                  }


                  if (
                    typeof addToCart ===
                    "function"
                  ) {

                    addToCart(
                      product
                    );

                  }


                  updateButton();

                }
              );

            }
          );

        }


        function filterProducts(category) {

          if (
            category ===
            "all"
          ) {

            displayProducts(
              products
            );

            return;

          }


          const filtered =
            products.filter(
              function (product) {

                return (
                  product.category ===
                  category
                );

              }
            );


          displayProducts(
            filtered
          );

        }


        function getSearchResults(searchTerm) {

          const query =
            normalizeSearch(
              searchTerm
            );


          if (!query) {
            return [];
          }


          if (
            window.ZynexCartSearch &&
            typeof
              window.ZynexCartSearch.searchProducts ===
                "function"
          ) {

            return window.ZynexCartSearch
              .searchProducts(
                query
              );

          }


          return products.filter(
            function (product) {

              const name =
                normalizeSearch(
                  product.name
                );

              const category =
                normalizeSearch(
                  product.category
                );

              const unit =
                normalizeSearch(
                  product.unit
                );


              return (
                name.includes(query) ||
                category.includes(query) ||
                unit.includes(query)
              );

            }
          );

        }


        function showSearchResultInfo(
          searchTerm,
          resultCount
        ) {

          if (
            searchResultInfo
          ) {

            searchResultInfo.hidden =
              false;

          }


          if (
            searchResultText
          ) {

            searchResultText.textContent =
              `Showing results for "${searchTerm}"`;

          }


          if (
            pageTitle
          ) {

            pageTitle.textContent =
              "Search Results";

          }


          if (
            pageDescription
          ) {

            pageDescription.textContent =
              `${resultCount} ${
                resultCount === 1
                  ? "product"
                  : "products"
              } found`;

          }

        }


        function clearSearchResultInfo() {

          if (
            searchResultInfo
          ) {

            searchResultInfo.hidden =
              true;

          }


          if (
            searchResultText
          ) {

            searchResultText.textContent =
              "";

          }


          if (
            pageTitle
          ) {

            pageTitle.textContent =
              "All Products 🛍️";

          }


          if (
            pageDescription
          ) {

            pageDescription.textContent =
              "Shop your daily essentials at ZynexCart.";

          }

        }


        function applySearch(searchTerm) {

          const cleanSearch =
            String(
              searchTerm || ""
            )
              .trim()
              .replace(
                /\s+/g,
                " "
              );


          if (!cleanSearch) {

            clearSearchResultInfo();

            displayProducts(
              products
            );

            return;

          }


          if (
            searchInput
          ) {

            searchInput.value =
              cleanSearch;

          }


          filterButtons.forEach(
            function (button) {

              button.classList.remove(
                "active"
              );

            }
          );


          const results =
            getSearchResults(
              cleanSearch
            );


          showSearchResultInfo(
            cleanSearch,
            results.length
          );


          displayProducts(
            results
          );

        }


        function applyCategory(category) {

          const categoryButton =
            document.querySelector(
              `[data-category="${category}"]`
            );


          if (
            categoryButton
          ) {

            filterButtons.forEach(
              function (button) {

                button.classList.remove(
                  "active"
                );

              }
            );


            categoryButton.classList.add(
              "active"
            );

          }


          clearSearchResultInfo();

          filterProducts(
            category
          );

        }


        filterButtons.forEach(
          function (button) {

            button.addEventListener(
              "click",
              function () {

                filterButtons.forEach(
                  function (btn) {

                    btn.classList.remove(
                      "active"
                    );

                  }
                );


                button.classList.add(
                  "active"
                );


                const category =
                  button.dataset.category;


                const url =
                  new URL(
                    window.location.href
                  );


                url.searchParams.delete(
                  "search"
                );


                if (
                  category ===
                  "all"
                ) {

                  url.searchParams.delete(
                    "category"
                  );

                } else {

                  url.searchParams.set(
                    "category",
                    category
                  );

                }


                window.history.replaceState(
                  {},
                  "",
                  url
                );


                if (
                  searchInput
                ) {

                  searchInput.value =
                    "";

                }


                if (
                  window.ZynexCartSearch &&
                  typeof
                    window.ZynexCartSearch.hideSuggestions ===
                      "function"
                ) {

                  window.ZynexCartSearch
                    .hideSuggestions();

                }


                clearSearchResultInfo();

                filterProducts(
                  category
                );

              }
            );

          }
        );


        document.addEventListener(
          "zynexcart:cartUpdated",
          function () {

            const visibleButtons =
              productsGrid.querySelectorAll(
                ".add-btn[data-product-id]"
              );


            visibleButtons.forEach(
              function (button) {

                const productId =
                  Number(
                    button.dataset.productId
                  );


                const product =
                  products.find(
                    function (item) {

                      return (
                        Number(item.id) ===
                        productId
                      );

                    }
                  );


                if (!product) {
                  return;
                }


                const cart =
                  typeof getCart ===
                  "function"
                    ? getCart()
                    : [];


                const cartItem =
                  Array.isArray(cart)
                    ? cart.find(
                        function (item) {

                          return (
                            Number(item.id) ===
                            productId
                          );

                        }
                      )
                    : null;


                const quantity =
                  cartItem
                    ? Number(
                        cartItem.quantity || 0
                      )
                    : 0;


                if (
                  quantity <= 0
                ) {

                  button.classList.remove(
                    "added"
                  );

                  button.innerHTML =
                    "ADD";

                  return;

                }


                button.classList.add(
                  "added"
                );


                button.innerHTML = `

                  <span
                    class="qty-minus"
                  >
                    −
                  </span>

                  <span
                    class="qty-number"
                    aria-live="polite"
                  >
                    ${quantity}
                  </span>

                  <span
                    class="qty-plus"
                  >
                    +
                  </span>

                `;

              }
            );

          }
        );


        const params =
          new URLSearchParams(
            window.location.search
          );


        const search =
          params.get(
            "search"
          );


        const category =
          params.get(
            "category"
          );


        if (
          search &&
          search.trim()
        ) {

          applySearch(
            search
          );

        } else if (
          category &&
          category.trim()
        ) {

          applyCategory(
            category
          );

        } else {

          clearSearchResultInfo();

          displayProducts(
            products
          );

        }

      }


      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          initializeProductsPage,
          {
            once: true
          }
        );

      } else {

        initializeProductsPage();

      }

    })();

  </script>

</body>

</html>
