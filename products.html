<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Shop groceries and everyday essentials on ZynexCart."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>Products — ZynexCart</title>


  <!-- =====================================================
       ZYNEXCART — CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/base.css"
  >

  <link
    rel="stylesheet"
    href="css/header.css"
  >

  <link
    rel="stylesheet"
    href="css/products.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

</head>


<body>


  <!-- =====================================================
       SAME HEADER AS HOME PAGE
       DO NOT CHANGE
  ====================================================== -->

  <div id="header-component"></div>


  <!-- =====================================================
       STICKY CATEGORY BAR
  ====================================================== -->

  <div
    class="products-category-bar"
    id="productsCategoryBar"
  >

    <div class="products-category-bar-inner">

      <h1 id="productsPageTitle">
        All Products
      </h1>

    </div>

  </div>


  <!-- =====================================================
       PRODUCTS PAGE
  ====================================================== -->

  <main class="products-page">

    <div class="products-container">


      <!-- =================================================
           MAIN PRODUCT LAYOUT
      ================================================== -->

      <div class="products-layout">


        <!-- =================================================
             LEFT CATEGORY NAVIGATION
        ================================================== -->

        <aside
          class="products-sidebar"
          aria-label="Category navigation"
        >

          <div class="products-sidebar-inner">


            <div class="sidebar-title">
              Shop All Products
            </div>


            <nav
              class="subcategory-nav"
              id="subcategoryNav"
              aria-label="Product categories"
            >

              <!--
                Categories rendered by JavaScript
              -->

            </nav>

          </div>

        </aside>


        <!-- =================================================
             RIGHT PRODUCT AREA
        ================================================== -->

        <section
          class="products-main"
          aria-label="Products"
        >


          <!-- ===============================================
               PRODUCT TOOLBAR
          ================================================ -->

          <div class="products-toolbar">

            <div class="products-toolbar-left">

              <h2 id="productsSectionTitle">
                Products
              </h2>

              <span id="productsToolbarCount">
                0 products
              </span>

            </div>

          </div>


          <!-- ===============================================
               SEARCH RESULT
          ================================================ -->

          <div
            id="searchResultInfo"
            class="search-result-info"
            hidden
          >

            <strong id="searchResultText"></strong>

          </div>


          <!-- ===============================================
               PRODUCT GRID
          ================================================ -->

          <div
            class="product-grid"
            id="productsGrid"
          >
            <!-- Products rendered by JavaScript -->
          </div>


          <!-- ===============================================
               EMPTY STATE
          ================================================ -->

          <div
            id="noProducts"
            class="products-empty-state"
            style="display: none;"
            role="status"
            aria-live="polite"
          >

            <div
              class="products-empty-icon"
              aria-hidden="true"
            >
              🛒
            </div>


            <div class="products-empty-content">

              <h2>
                No products found
              </h2>

              <p id="noProductsMessage">
                No products are currently available in this section.
              </p>

            </div>

          </div>


        </section>

      </div>

    </div>

  </main>


  <!-- =====================================================
       SAME FOOTER COMPONENT
  ====================================================== -->

  <div id="footer-component"></div>


  <!-- =====================================================
       ZYNEXCART — PAGE INITIALIZATION
  ====================================================== -->

  <script>

    (function () {

      "use strict";


      if (
        window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__
      ) {
        return;
      }


      window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__ =
        true;


      /* ===================================================
         COMPONENT LOADER
      ==================================================== */

      async function loadComponent(
        elementId,
        filePath
      ) {

        const element =
          document.getElementById(
            elementId
          );


        if (!element) {

          console.warn(
            `ZynexCart: Element #${elementId} not found.`
          );

          return false;

        }


        try {

          const response =
            await fetch(
              filePath,
              {
                cache: "no-cache"
              }
            );


          if (!response.ok) {

            throw new Error(
              `Unable to load ${filePath}`
            );

          }


          element.innerHTML =
            await response.text();


          return true;


        } catch (error) {

          console.error(
            "ZynexCart component error:",
            error
          );


          return false;

        }

      }


      /* ===================================================
         SCRIPT LOADER
      ==================================================== */

      function loadScript(
        src
      ) {

        return new Promise(
          function (resolve, reject) {

            const existingScript =
              document.querySelector(
                `script[data-zynexcart-script="${src}"]`
              );


            if (existingScript) {

              resolve();

              return;

            }


            const script =
              document.createElement(
                "script"
              );


            script.src =
              src;

            script.async =
              false;

            script.dataset.zynexcartScript =
              src;


            script.onload =
              function () {

                resolve();

              };


            script.onerror =
              function () {

                reject(
                  new Error(
                    `Unable to load script: ${src}`
                  )
                );

              };


            document.body.appendChild(
              script
            );

          }
        );

      }


      /* ===================================================
         COMPONENTS
      ==================================================== */

      const components = [

        [
          "header-component",
          "components/header.html"
        ],

        [
          "footer-component",
          "components/footer.html"
        ]

      ];


      /* ===================================================
         JAVASCRIPT MODULES
      ==================================================== */

      const scripts = [

        "js/core/storage.js",
        "js/core/utils.js",
        "js/core/events.js",

        "js/categories.js",

        "js/cart/cart.js",
        "js/cart/cart-actions.js",
        "js/cart/cart-ui.js",

        "js/search/search.js",

        "js/location/location.js",
        "js/location/location-ui.js",
        "js/location/location-search.js",
        "js/location/location-map.js",
        "js/location/location-address.js",
        "js/location/saved-addresses.js",

        "js/app.js",

        "js/products.js"

      ];


      /* ===================================================
         URL PARAMETERS
      ==================================================== */

      function getUrlParams() {

        const params =
          new URLSearchParams(
            window.location.search
          );


        return {

          category:
            (
              params.get("category") ||
              ""
            ).trim(),

          subcategory:
            (
              params.get("subcategory") ||
              ""
            ).trim(),

          search:
            (
              params.get("search") ||
              ""
            ).trim()

        };

      }


      /* ===================================================
         CATEGORY DATA
      ==================================================== */

      function getCategories() {

        if (
          Array.isArray(
            window.ZynexCartCategories
          )
        ) {

          return window.ZynexCartCategories;

        }

        return [];

      }


      function getCategory(
        categoryId
      ) {

        if (!categoryId) {
          return null;
        }


        return getCategories().find(
          function (category) {

            return (
              String(category.id) ===
              String(categoryId)
            );

          }
        ) || null;

      }


      /* ===================================================
         PRODUCT DATA
      ==================================================== */

      function getAllProducts() {

        if (
          window.ZynexCartProducts &&
          Array.isArray(
            window.ZynexCartProducts.products
          )
        ) {

          return window.ZynexCartProducts.products;

        }


        if (
          Array.isArray(
            window.products
          )
        ) {

          return window.products;

        }


        return [];

      }


      function getProductsForPage() {

        const {
          category,
          subcategory,
          search
        } =
          getUrlParams();


        let list =
          getAllProducts();


        /* -----------------------------------------------
           MAIN CATEGORY
        ------------------------------------------------ */

        if (category) {

          list =
            list.filter(
              function (product) {

                return (
                  String(
                    product.categoryId || ""
                  ) ===
                  String(category)
                );

              }
            );

        }


        /* -----------------------------------------------
           SUBCATEGORY
        ------------------------------------------------ */

        if (subcategory) {

          list =
            list.filter(
              function (product) {

                return (
                  String(
                    product.subcategoryId || ""
                  ) ===
                  String(subcategory)
                );

              }
            );

        }


        /* -----------------------------------------------
           SEARCH
        ------------------------------------------------ */

        if (search) {

          const query =
            search.toLowerCase();


          list =
            list.filter(
              function (product) {

                const searchableText = [

                  product.name,
                  product.category,
                  product.categoryId,
                  product.subcategoryId,
                  product.unit

                ]
                  .filter(Boolean)
                  .join(" ")
                  .toLowerCase();


                return searchableText.includes(
                  query
                );

              }
            );

        }


        return list;

      }


      /* ===================================================
         RENDER CATEGORY NAVIGATION
      ==================================================== */

      function renderSubcategoryNavigation() {

        const nav =
          document.getElementById(
            "subcategoryNav"
          );


        if (!nav) {
          return;
        }


        const {
          category,
          subcategory
        } =
          getUrlParams();


        const selectedCategory =
          getCategory(
            category
          );


        nav.innerHTML =
          "";


        /* -----------------------------------------------
           ALL PRODUCTS
        ------------------------------------------------ */

        const allLink =
          document.createElement(
            "a"
          );


        allLink.href =
          category
            ? `products.html?category=${encodeURIComponent(
                category
              )}`
            : "products.html";


        allLink.className =
          "subcategory-item";


        if (!subcategory) {

          allLink.classList.add(
            "active"
          );

        }


        allLink.innerHTML = `

          <span>
            All Products
          </span>

          <span
            class="subcategory-arrow"
            aria-hidden="true"
          >
            ›
          </span>

        `;


        nav.appendChild(
          allLink
        );


        /* -----------------------------------------------
           SELECTED CATEGORY SUBCATEGORIES
        ------------------------------------------------ */

        if (
          !selectedCategory ||
          !Array.isArray(
            selectedCategory.subcategories
          )
        ) {

          return;

        }


        selectedCategory.subcategories.forEach(
          function (item) {

            const link =
              document.createElement(
                "a"
              );


            link.className =
              "subcategory-item";


            if (
              String(item.id) ===
              String(subcategory)
            ) {

              link.classList.add(
                "active"
              );

            }


            link.href =
              `products.html?category=${encodeURIComponent(
                category
              )}&subcategory=${encodeURIComponent(
                item.id
              )}`;


            link.innerHTML = `

              <span>
                ${item.name}
              </span>

              <span
                class="subcategory-arrow"
                aria-hidden="true"
              >
                ›
              </span>

            `;


            nav.appendChild(
              link
            );

          }
        );

      }


      /* ===================================================
         PAGE TITLE
      ==================================================== */

      function getDisplayCategoryName() {

        const {
          category,
          subcategory
        } =
          getUrlParams();


        const selectedCategory =
          getCategory(
            category
          );


        if (!selectedCategory) {

          return "All Products";

        }


        if (
          subcategory &&
          Array.isArray(
            selectedCategory.subcategories
          )
        ) {

          const selectedSubcategory =
            selectedCategory.subcategories.find(
              function (item) {

                return (
                  String(item.id) ===
                  String(subcategory)
                );

              }
            );


          if (selectedSubcategory) {

            return selectedSubcategory.name;

          }

        }


        return selectedCategory.name;

      }


      /* ===================================================
         UPDATE PAGE TITLE
      ==================================================== */

      function updatePageInformation() {

        const displayName =
          getDisplayCategoryName();


        const title =
          document.getElementById(
            "productsPageTitle"
          );


        const sectionTitle =
          document.getElementById(
            "productsSectionTitle"
          );


        if (title) {

          title.textContent =
            displayName;

        }


        if (sectionTitle) {

          sectionTitle.textContent =
            displayName;

        }


        document.title =
          `${displayName} — ZynexCart`;

      }


      /* ===================================================
         RENDER PRODUCTS
      ==================================================== */

      function renderProducts() {

        const grid =
          document.getElementById(
            "productsGrid"
          );


        const empty =
          document.getElementById(
            "noProducts"
          );


        const emptyMessage =
          document.getElementById(
            "noProductsMessage"
          );


        if (!grid) {
          return;
        }


        const list =
          getProductsForPage();


        /* -----------------------------------------------
           EMPTY
        ------------------------------------------------ */

        if (
          list.length === 0
        ) {

          grid.innerHTML =
            "";


          if (empty) {

            empty.style.display =
              "flex";

          }


          if (emptyMessage) {

            emptyMessage.textContent =
              "No products are currently available in this section.";

          }


          updateProductCount(
            0
          );

          return;

        }


        /* -----------------------------------------------
           PRODUCTS
        ------------------------------------------------ */

        grid.innerHTML =
          list
            .map(
              function (product) {

                if (
                  window.ZynexCartProducts &&
                  typeof
                    window.ZynexCartProducts.createProductCard ===
                    "function"
                ) {

                  return window.ZynexCartProducts.createProductCard(
                    product
                  );

                }


                return "";

              }
            )
            .join("");


        if (empty) {

          empty.style.display =
            "none";

        }


        updateProductCount(
          list.length
        );


        /* -----------------------------------------------
           RECONNECT PRODUCT CONTROLS
        ------------------------------------------------ */

        if (
          typeof setupProductControls ===
          "function"
        ) {

          setupProductControls();

        }


        if (
          window.ZynexCartProducts &&
          typeof
            window.ZynexCartProducts.syncProductButtons ===
            "function"
        ) {

          window.ZynexCartProducts.syncProductButtons();

        }

      }


      /* ===================================================
         PRODUCT COUNT
      ==================================================== */

      function updateProductCount(
        count
      ) {

        const safeCount =
          Number.isFinite(
            Number(count)
          )
            ? Number(count)
            : 0;


        const text =
          `${safeCount} ${
            safeCount === 1
              ? "product"
              : "products"
          }`;


        const toolbarCount =
          document.getElementById(
            "productsToolbarCount"
          );


        if (toolbarCount) {

          toolbarCount.textContent =
            text;

        }

      }


      /* ===================================================
         SEARCH RESULT
      ==================================================== */

      function updateSearchResult() {

        const {
          search
        } =
          getUrlParams();


        const info =
          document.getElementById(
            "searchResultInfo"
          );


        const text =
          document.getElementById(
            "searchResultText"
          );


        if (
          !search
        ) {

          if (info) {

            info.hidden =
              true;

          }

          return;

        }


        if (info) {

          info.hidden =
            false;

        }


        if (text) {

          text.textContent =
            `Showing results for "${search}"`;

        }

      }


      /* ===================================================
         STICKY CATEGORY BAR
      ==================================================== */

      function setupCategoryBar() {

        const bar =
          document.getElementById(
            "productsCategoryBar"
          );


        const header =
          document.getElementById(
            "header-component"
          );


        if (
          !bar ||
          !header
        ) {

          return;

        }


        function updatePosition() {

          const headerHeight =
            header.offsetHeight;


          bar.style.top =
            `${headerHeight}px`;

        }


        updatePosition();


        window.addEventListener(
          "resize",
          updatePosition
        );

      }


      /* ===================================================
         CART UPDATE
      ==================================================== */

      function setupCartListener() {

        document.addEventListener(
          "zynexcart:cartUpdated",
          function () {

            renderProducts();

          }
        );

      }


      /* ===================================================
         INITIALIZE
      ==================================================== */

      async function initializeProductsPage() {

        try {


          /* -----------------------------------------------
             1. LOAD SAME HEADER + FOOTER
          ------------------------------------------------ */

          await Promise.all(

            components.map(
              function (component) {

                return loadComponent(
                  component[0],
                  component[1]
                );

              }
            )

          );


          /* -----------------------------------------------
             2. LOAD JS MODULES
          ------------------------------------------------ */

          for (
            const scriptPath of scripts
          ) {

            await loadScript(
              scriptPath
            );

          }


          /* -----------------------------------------------
             3. PAGE INFORMATION
          ------------------------------------------------ */

          updatePageInformation();


          /* -----------------------------------------------
             4. CATEGORY NAVIGATION
          ------------------------------------------------ */

          renderSubcategoryNavigation();


          /* -----------------------------------------------
             5. PRODUCTS
          ------------------------------------------------ */

          renderProducts();


          /* -----------------------------------------------
             6. SEARCH
          ------------------------------------------------ */

          updateSearchResult();


          /* -----------------------------------------------
             7. STICKY CATEGORY BAR
          ------------------------------------------------ */

          setupCategoryBar();


          /* -----------------------------------------------
             8. CART
          ------------------------------------------------ */

          setupCartListener();


          console.log(
            "ZynexCart: Products page loaded successfully."
          );


        } catch (error) {

          console.error(
            "ZynexCart: Products page initialization failed.",
            error
          );

        }

      }


      /* ===================================================
         START
      ==================================================== */

      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          initializeProductsPage,
          {
            once: true
          }
        );

      } else {

        initializeProductsPage();

      }

    })();

  </script>

</body>

</html>
