<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Shop groceries, daily essentials and more with ZynexCart."
  >

  <title>ZynexCart — Products</title>

  <!-- =========================================
       CORE CSS
  ========================================== -->

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- =========================================
       HEADER
  ========================================== -->

  <div id="headerContainer"></div>


  <!-- =========================================
       PRODUCTS PAGE
  ========================================== -->

  <main class="products-page">

    <div class="products-container">

      <!-- =====================================
           BREADCRUMB
      ====================================== -->

      <nav
        class="products-breadcrumb"
        aria-label="Breadcrumb"
      >
        <a href="index.html">Home</a>

        <span aria-hidden="true">›</span>

        <span
          id="breadcrumbCategory"
        >
          Products
        </span>
      </nav>


      <!-- =====================================
           PAGE HEADER
      ====================================== -->

      <section class="products-heading">

        <div class="products-heading-content">

          <span
            class="products-eyebrow"
            id="productsEyebrow"
          >
            ZynexCart
          </span>

          <h1 id="productsTitle">
            Products
          </h1>

          <p id="productsDescription">
            Shop your everyday essentials with fast local delivery.
          </p>

        </div>


        <div
          class="products-result-count"
          id="productsResultCount"
          aria-live="polite"
        >
          0 products
        </div>

      </section>


      <!-- =====================================
           PRODUCT CONTENT
      ====================================== -->

      <section class="products-layout">

        <!-- ===================================
             LEFT CATEGORY NAVIGATION
        ==================================== -->

        <aside
          class="products-sidebar"
          aria-label="Category navigation"
        >

          <div class="products-sidebar-inner">

            <div class="sidebar-title">
              <span>Shop</span>
            </div>

            <nav
              class="subcategory-nav"
              id="subcategoryNav"
            >
              <!-- Rendered by JavaScript -->
            </nav>

          </div>

        </aside>


        <!-- ===================================
             RIGHT PRODUCT AREA
        ==================================== -->

        <section class="products-main">

          <!-- Search / filter information -->

          <div
            class="products-toolbar"
            id="productsToolbar"
          >

            <div class="products-toolbar-left">

              <h2 id="productsSectionTitle">
                All Products
              </h2>

              <span
                id="productsSearchText"
              ></span>

            </div>

          </div>


          <!-- Product grid -->

          <div
            class="product-grid"
            id="productsGrid"
          ></div>


          <!-- Empty state -->

          <div
            class="products-empty-state"
            id="productsEmptyState"
            hidden
          >

            <div
              class="products-empty-icon"
              aria-hidden="true"
            >
              🛒
            </div>

            <div class="products-empty-content">

              <h2>
                No products found
              </h2>

              <p id="productsEmptyMessage">
                Try another category or search.
              </p>

            </div>

          </div>

        </section>

      </section>

    </div>

  </main>


  <!-- =========================================
       FOOTER
  ========================================== -->

  <div id="footerContainer"></div>


  <!-- =========================================
       CORE JAVASCRIPT
  ========================================== -->

  <script src="js/core/storage.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/events.js"></script>

  <script src="js/categories.js"></script>

  <!-- Cart -->

  <script src="js/cart/cart.js"></script>
  <script src="js/cart/cart-actions.js"></script>
  <script src="js/cart/cart-ui.js"></script>

  <!-- Search -->

  <script src="js/search/search.js"></script>

  <!-- Location -->

  <script src="js/location/location.js"></script>
  <script src="js/location/location-ui.js"></script>
  <script src="js/location/location-search.js"></script>
  <script src="js/location/location-map.js"></script>
  <script src="js/location/location-address.js"></script>
  <script src="js/location/saved-addresses.js"></script>

  <!-- App -->

  <script src="js/app.js"></script>

  <!-- Products -->

  <script src="js/products.js"></script>


  <!-- =========================================
       PRODUCTS PAGE LOGIC
  ========================================== -->

  <script>
    (function () {

      "use strict";


      /* =======================================
         ELEMENTS
      ======================================= */

      const grid =
        document.getElementById(
          "productsGrid"
        );

      const emptyState =
        document.getElementById(
          "productsEmptyState"
        );

      const emptyMessage =
        document.getElementById(
          "productsEmptyMessage"
        );

      const resultCount =
        document.getElementById(
          "productsResultCount"
        );

      const title =
        document.getElementById(
          "productsTitle"
        );

      const description =
        document.getElementById(
          "productsDescription"
        );

      const breadcrumb =
        document.getElementById(
          "breadcrumbCategory"
        );

      const eyebrow =
        document.getElementById(
          "productsEyebrow"
        );

      const sectionTitle =
        document.getElementById(
          "productsSectionTitle"
        );

      const searchText =
        document.getElementById(
          "productsSearchText"
        );

      const sidebar =
        document.getElementById(
          "subcategoryNav"
        );


      /* =======================================
         URL PARAMETERS
      ======================================= */

      const params =
        new URLSearchParams(
          window.location.search
        );

      const selectedCategory =
        params.get("category");

      const selectedSubcategory =
        params.get("subcategory");

      const searchQuery =
        (
          params.get("search") || ""
        ).trim();


      /* =======================================
         CATEGORY DATA
      ======================================= */

      const categoryManager =
        window.ZynexCartCategories || [];

      function getCategory() {

        if (!selectedCategory) {
          return null;
        }

        return categoryManager.find(
          function (category) {
            return (
              category.id ===
              selectedCategory
            );
          }
        ) || null;

      }


      const currentCategory =
        getCategory();


      /* =======================================
         CATEGORY NAME
      ======================================= */

      function getCategoryName() {

        if (currentCategory) {
          return currentCategory.name;
        }

        if (selectedCategory) {

          return String(
            selectedCategory
          )
            .replace(/-/g, " ")
            .replace(
              /\b\w/g,
              function (letter) {
                return letter.toUpperCase();
              }
            );

        }

        return "Products";

      }


      /* =======================================
         PAGE INFORMATION
      ======================================= */

      function updatePageInformation() {

        const categoryName =
          getCategoryName();


        if (currentCategory) {

          title.textContent =
            categoryName;

          breadcrumb.textContent =
            categoryName;

          eyebrow.textContent =
            "Shop by Category";

          description.textContent =
            currentCategory.description ||
            "Shop everyday essentials with fast local delivery.";

        } else {

          title.textContent =
            searchQuery
              ? "Search Results"
              : "Products";

          breadcrumb.textContent =
            searchQuery
              ? "Search"
              : "Products";

          eyebrow.textContent =
            "ZynexCart";

          description.textContent =
            searchQuery
              ? `Showing products matching "${searchQuery}".`
              : "Shop your everyday essentials with fast local delivery.";

        }


        sectionTitle.textContent =
          selectedSubcategory
            ? getSubcategoryName(
                selectedSubcategory
              )
            : (
                searchQuery
                  ? "Search Results"
                  : "All Products"
              );


        if (searchQuery) {

          searchText.textContent =
            `for "${searchQuery}"`;

        } else {

          searchText.textContent =
            "";

        }

      }


      /* =======================================
         SUBCATEGORY HELPERS
      ======================================= */

      function getSubcategories() {

        if (
          !currentCategory ||
          !Array.isArray(
            currentCategory.subcategories
          )
        ) {
          return [];
        }

        return currentCategory.subcategories;

      }


      function getSubcategoryName(
        subcategoryId
      ) {

        const subcategories =
          getSubcategories();

        const item =
          subcategories.find(
            function (subcategory) {
              return (
                subcategory.id ===
                subcategoryId
              );
            }
          );

        return item
          ? item.name
          : "All Products";

      }


      /* =======================================
         SIDEBAR
      ======================================= */

      function renderSidebar() {

        if (!sidebar) {
          return;
        }


        const subcategories =
          getSubcategories();


        let items = `

          <a
            href="products.html?category=${encodeURIComponent(
              selectedCategory || ""
            )}"
            class="subcategory-item ${
              !selectedSubcategory
                ? "active"
                : ""
            }"
            data-subcategory=""
          >
            <span>
              All Products
            </span>

            <span
              class="subcategory-arrow"
              aria-hidden="true"
            >
              ›
            </span>
          </a>

        `;


        if (subcategories.length) {

          items +=
            subcategories
              .map(
                function (subcategory) {

                  const active =
                    selectedSubcategory ===
                    subcategory.id;

                  return `

                    <a
                      href="products.html?category=${encodeURIComponent(
                        selectedCategory
                      )}&subcategory=${encodeURIComponent(
                        subcategory.id
                      )}"
                      class="subcategory-item ${
                        active
                          ? "active"
                          : ""
                      }"
                      data-subcategory="${
                        subcategory.id
                      }"
                    >

                      <span>
                        ${subcategory.name}
                      </span>

                      <span
                        class="subcategory-arrow"
                        aria-hidden="true"
                      >
                        ›
                      </span>

                    </a>

                  `;

                }
              )
              .join("");

        }


        sidebar.innerHTML =
          items;

      }


      /* =======================================
         PRODUCT FILTER
      ======================================= */

      function getFilteredProducts() {

        if (
          !Array.isArray(
            window.products
          )
        ) {
          return [];
        }


        let result =
          window.products.slice();


        /* Category */

        if (selectedCategory) {

          result =
            result.filter(
              function (product) {

                return (
                  product.categoryId ===
                  selectedCategory
                );

              }
            );

        }


        /* Search */

        if (searchQuery) {

          const query =
            searchQuery.toLowerCase();


          result =
            result.filter(
              function (product) {

                const searchable =
                  [
                    product.name,
                    product.category,
                    product.categoryId,
                    product.unit
                  ]
                    .join(" ")
                    .toLowerCase();


                return searchable.includes(
                  query
                );

              }
            );

        }


        /* Subcategory */

        if (selectedSubcategory) {

          result =
            result.filter(
              function (product) {

                return (
                  product.subcategoryId ===
                  selectedSubcategory
                );

              }
            );

        }


        return result;

      }


      /* =======================================
         PRODUCT RENDER
      ======================================= */

      function renderProducts() {

        if (!grid) {
          return;
        }


        const filteredProducts =
          getFilteredProducts();


        if (!filteredProducts.length) {

          grid.innerHTML = "";

          emptyState.hidden =
            false;


          if (selectedSubcategory) {

            emptyMessage.textContent =
              "No products are currently available in this section.";

          } else if (searchQuery) {

            emptyMessage.textContent =
              "Try a different search or browse another category.";

          } else {

            emptyMessage.textContent =
              "No products are currently available in this category.";

          }


          updateResultCount(0);

          return;

        }


        emptyState.hidden =
          true;


        grid.innerHTML =
          filteredProducts
            .map(
              function (product) {

                if (
                  typeof createProductCard ===
                  "function"
                ) {

                  return createProductCard(
                    product
                  );

                }

                return "";

              }
            )
            .join("");


        updateResultCount(
          filteredProducts.length
        );


        if (
          typeof setupProductControls ===
          "function"
        ) {

          setupProductControls();

        }

      }


      /* =======================================
         RESULT COUNT
      ======================================= */

      function updateResultCount(
        count
      ) {

        resultCount.textContent =
          `${count} ${
            count === 1
              ? "product"
              : "products"
          }`;

      }


      /* =======================================
         CART SYNC
      ======================================= */

      document.addEventListener(
        "zynexcart:cartUpdated",
        function () {

          if (
            typeof syncProductButtons ===
            "function"
          ) {

            syncProductButtons();

          }

        }
      );


      /* =======================================
         INITIALIZE
      ======================================= */

      function initializeProductsPage() {

        updatePageInformation();

        renderSidebar();

        renderProducts();

        updateCartCount();

      }


      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          initializeProductsPage
        );

      } else {

        initializeProductsPage();

      }

    })();
  </script>

</body>
</html>
