<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Shop groceries, snacks, beauty, personal care and household products on ZynexCart."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>Products — ZynexCart</title>


  <!-- =================================================
       ZYNEXCART — MODULAR CSS
       ================================================= -->

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


  <!-- =================================================
       HEADER
       ================================================= -->

  <header class="site-header">

    <div class="container header-inner">


      <!-- LOGO -->

      <a
        href="index.html"
        class="logo"
      >

        <img
          src="assets/logo.png"
          alt="ZynexCart"
        >

      </a>


      <!-- SHOP PRODUCTS -->

      <a
        href="products.html"
        class="location-btn"
      >

        📍 Shop Products

      </a>


      <!-- SEARCH -->

      <form
        class="search-box"
        id="searchForm"
      >

        <input
          type="search"
          id="searchInput"
          placeholder="Search products..."
          autocomplete="off"
          aria-label="Search products"
        >

        <button
          type="submit"
          aria-label="Search"
        >
          🔍
        </button>

      </form>


      <!-- HEADER ACTIONS -->

      <nav class="header-actions">

        <a
          href="login.html"
          class="account-link"
        >
          👤 Login
        </a>


        <a
          href="cart.html"
          class="cart-link"
        >

          🛒 Cart

          <span id="cartCount">
            0
          </span>

        </a>

      </nav>

    </div>

  </header>



  <!-- =================================================
       PRODUCTS PAGE
       ================================================= -->

  <main class="container products-page">


    <!-- PAGE HEADING -->

    <section class="page-heading">

      <h1 id="productsPageTitle">
        All Products 🛍️
      </h1>

      <p id="productsPageDescription">
        Shop your daily essentials at ZynexCart.
      </p>

    </section>



    <!-- =================================================
         CATEGORY FILTERS
         ================================================= -->

    <div class="category-filters">


      <button
        class="category-filter active"
        data-category="all"
        type="button"
      >
        All
      </button>


      <button
        class="category-filter"
        data-category="grocery"
        type="button"
      >
        Grocery
      </button>


      <button
        class="category-filter"
        data-category="snacks"
        type="button"
      >
        Snacks
      </button>


      <button
        class="category-filter"
        data-category="personal-care"
        type="button"
      >
        Personal Care
      </button>


      <button
        class="category-filter"
        data-category="beverages"
        type="button"
      >
        Beverages
      </button>


      <button
        class="category-filter"
        data-category="beauty"
        type="button"
      >
        Beauty
      </button>


      <button
        class="category-filter"
        data-category="household"
        type="button"
      >
        Household
      </button>


    </div>



    <!-- =================================================
         SEARCH RESULT INFORMATION
         ================================================= -->

    <div
      id="searchResultInfo"
      class="search-result-info"
      hidden
    >

      <strong id="searchResultText"></strong>

    </div>



    <!-- =================================================
         PRODUCTS
         ================================================= -->

    <section>

      <div
        class="product-grid"
        id="productsGrid"
      >
        <!-- Products load here -->
      </div>


      <!-- NO PRODUCTS -->

      <div
        id="noProducts"
        class="empty-cart"
        style="display: none;"
      >

        <h2>
          No products found 😕
        </h2>

        <p>
          Try another search or category.
        </p>

      </div>

    </section>


  </main>



  <!-- =================================================
       FOOTER
       ================================================= -->

  <footer class="site-footer">

    <div class="container">

      <div class="footer-bottom">

        <p>
          © 2026 ZynexCart. All rights reserved.
        </p>

      </div>

    </div>

  </footer>



  <!-- =================================================
       JAVASCRIPT
       ================================================= -->

  <script src="js/app.js"></script>

  <script src="js/products.js"></script>


  <script>

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        const productsGrid =
          document.getElementById(
            "productsGrid"
          );

        const noProducts =
          document.getElementById(
            "noProducts"
          );

        const filterButtons =
          document.querySelectorAll(
            ".category-filter"
          );

        const searchInput =
          document.getElementById(
            "searchInput"
          );

        const pageTitle =
          document.getElementById(
            "productsPageTitle"
          );

        const pageDescription =
          document.getElementById(
            "productsPageDescription"
          );

        const searchResultInfo =
          document.getElementById(
            "searchResultInfo"
          );

        const searchResultText =
          document.getElementById(
            "searchResultText"
          );


        /* =================================================
           DISPLAY PRODUCTS
           ================================================= */

        function displayProducts(list) {

          if (!Array.isArray(list) || list.length === 0) {

            productsGrid.innerHTML = "";

            noProducts.style.display =
              "block";

            return;

          }


          noProducts.style.display =
            "none";


          productsGrid.innerHTML =
            list.map(
              product => `

                <article
                  class="product-card"
                  data-product-id="${product.id}"
                >

                  <a
                    href="product.html?id=${product.id}"
                    class="product-card-link"
                  >

                    <div class="product-image">

                      <img
                        src="${product.image}"
                        alt="${product.name}"
                        loading="lazy"
                        onerror="this.style.display='none'"
                      >

                    </div>


                    <div class="product-info">

                      <span class="product-category">
                        ${formatCategory(
                          product.category
                        )}
                      </span>

                      <h3>
                        ${product.name}
                      </h3>

                      <p class="product-unit">
                        ${product.unit}
                      </p>


                      <div class="product-price">

                        <strong>
                          ${formatPrice(
                            product.price
                          )}
                        </strong>

                        <span class="product-mrp">
                          ${formatPrice(
                            product.mrp
                          )}
                        </span>

                        <span class="product-discount">
                          ${product.discount}% OFF
                        </span>

                      </div>

                    </div>

                  </a>


                  <!-- ADD / QUANTITY BUTTON -->

                  <button
                    class="add-btn"
                    data-product-id="${product.id}"
                    type="button"
                  >
                    ADD
                  </button>

                </article>

              `
            ).join("");


          setupProductButtons();

        }



        /* =================================================
           ADD / QUANTITY BUTTONS
           ================================================= */

        function setupProductButtons() {

          const addButtons =
            document.querySelectorAll(
              ".add-btn"
            );


          addButtons.forEach(
            button => {

              const productId =
                Number(
                  button.dataset.productId
                );

              const product =
                products.find(
                  item =>
                    Number(item.id) ===
                    productId
                );

              if (!product) {
                return;
              }


              function updateButton() {

                const cart =
                  typeof getCart ===
                  "function"
                    ? getCart()
                    : [];

                const cartItem =
                  Array.isArray(cart)
                    ? cart.find(
                        item =>
                          Number(item.id) ===
                          productId
                      )
                    : null;

                const quantity =
                  cartItem
                    ? Number(
                        cartItem.quantity || 0
                      )
                    : 0;


                /* NOT IN CART */

                if (quantity <= 0) {

                  button.classList.remove(
                    "added"
                  );

                  button.innerHTML =
                    "ADD";

                  return;

                }


                /* IN CART */

                button.classList.add(
                  "added"
                );

                button.innerHTML = `

                  <span
                    class="qty-minus"
                  >
                    −
                  </span>

                  <span
                    class="qty-number"
                  >
                    ${quantity}
                  </span>

                  <span
                    class="qty-plus"
                  >
                    +
                  </span>

                `;

              }


              /* INITIAL STATE */

              updateButton();


              /* BUTTON CLICK */

              button.addEventListener(
                "click",
                event => {

                  event.preventDefault();

                  event.stopPropagation();


                  /* PLUS */

                  if (
                    event.target.classList.contains(
                      "qty-plus"
                    )
                  ) {

                    changeCartQuantity(
                      productId,
                      1
                    );

                    updateButton();

                    return;

                  }


                  /* MINUS */

                  if (
                    event.target.classList.contains(
                      "qty-minus"
                    )
                  ) {

                    changeCartQuantity(
                      productId,
                      -1
                    );

                    updateButton();

                    return;

                  }


                  /* ADD */

                  addToCart(
                    product
                  );

                  updateButton();

                }
              );

            }
          );

        }



        /* =================================================
           CATEGORY FILTER
           ================================================= */

        function filterProducts(
          category
        ) {

          if (
            category ===
            "all"
          ) {

            displayProducts(
              products
            );

            return;

          }


          const filtered =
            products.filter(
              product =>
                product.category ===
                category
            );


          displayProducts(
            filtered
          );

        }



        /* =================================================
           PROFESSIONAL SEARCH
           ================================================= */

        function getSearchResults(
          searchTerm
        ) {

          const query =
            String(
              searchTerm || ""
            )
              .toLowerCase()
              .trim()
              .replace(/\s+/g, " ");


          if (!query) {
            return [];
          }


          /*
           * Use the professional
           * search system from search.js
           * whenever available.
           */

          if (
            window.ZynexCartSearch &&
            typeof
              window.ZynexCartSearch.searchProducts ===
              "function"
          ) {

            return window.ZynexCartSearch
              .searchProducts(
                query
              );

          }


          /*
           * Safe fallback.
           */

          return products.filter(
            product => {

              const name =
                String(
                  product.name || ""
                )
                  .toLowerCase();

              const category =
                String(
                  product.category || ""
                )
                  .toLowerCase();

              const unit =
                String(
                  product.unit || ""
                )
                  .toLowerCase();

              return (
                name.includes(query) ||
                category.includes(query) ||
                unit.includes(query)
              );

            }
          );

        }



        /* =================================================
           SHOW SEARCH RESULT INFO
           ================================================= */

        function showSearchResultInfo(
          searchTerm,
          resultCount
        ) {

          if (
            !searchTerm
          ) {

            searchResultInfo.hidden =
              true;

            searchResultText.textContent =
              "";

            return;

          }


          searchResultInfo.hidden =
            false;


          searchResultText.textContent =
            `Showing results for "${searchTerm}"`;



          /*
           * Search page heading
           */

          pageTitle.textContent =
            `Search Results`;


          pageDescription.textContent =
            `${resultCount} ${
              resultCount === 1
                ? "product"
                : "products"
            } found`;

        }



        /* =================================================
           CLEAR SEARCH RESULT INFO
           ================================================= */

        function clearSearchResultInfo() {

          searchResultInfo.hidden =
            true;

          searchResultText.textContent =
            "";

          pageTitle.textContent =
            "All Products 🛍️";

          pageDescription.textContent =
            "Shop your daily essentials at ZynexCart.";

        }



        /* =================================================
           SEARCH FROM URL
           ================================================= */

        function applySearch(
          searchTerm
        ) {

          const cleanSearch =
            String(
              searchTerm || ""
            )
              .trim();


          if (!cleanSearch) {

            clearSearchResultInfo();

            displayProducts(
              products
            );

            return;

          }


          if (searchInput) {

            searchInput.value =
              cleanSearch;

          }


          const results =
            getSearchResults(
              cleanSearch
            );


          filterButtons.forEach(
            button => {

              button.classList.remove(
                "active"
              );

            }
          );


          showSearchResultInfo(
            cleanSearch,
            results.length
          );


          displayProducts(
            results
          );

        }



        /* =================================================
           CATEGORY FROM URL
           ================================================= */

        function applyCategory(
          category
        ) {

          const categoryButton =
            document.querySelector(
              `[data-category="${category}"]`
            );


          if (
            categoryButton
          ) {

            filterButtons.forEach(
              button => {

                button.classList.remove(
                  "active"
                );

              }
            );


            categoryButton.classList.add(
              "active"
            );

          }


          clearSearchResultInfo();

          filterProducts(
            category
          );

        }



        /* =================================================
           CATEGORY BUTTON CLICK
           ================================================= */

        filterButtons.forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                filterButtons.forEach(
                  btn => {

                    btn.classList.remove(
                      "active"
                    );

                  }
                );


                button.classList.add(
                  "active"
                );


                const category =
                  button.dataset.category;


                /*
                 * Remove search query
                 * when category is selected.
                 */

                const url =
                  new URL(
                    window.location.href
                  );

                url.searchParams.delete(
                  "search"
                );

                if (
                  category ===
                  "all"
                ) {

                  url.searchParams.delete(
                    "category"
                  );

                } else {

                  url.searchParams.set(
                    "category",
                    category
                  );

                }


                window.history.replaceState(
                  {},
                  "",
                  url
                );


                if (
                  searchInput
                ) {

                  searchInput.value =
                    "";

                }


                clearSearchResultInfo();

                filterProducts(
                  category
                );

              }
            );

          }
        );



        /* =================================================
           URL PARAMETERS
           ================================================= */

        const params =
          new URLSearchParams(
            window.location.search
          );


        const search =
          params.get(
            "search"
          );


        const category =
          params.get(
            "category"
          );



        /* =================================================
           INITIAL PAGE STATE
           ================================================= */

        if (search) {

          applySearch(
            search
          );

        } else if (category) {

          applyCategory(
            category
          );

        } else {

          clearSearchResultInfo();

          displayProducts(
            products
          );

        }

      }
    );

  </script>

</body>

</html>
