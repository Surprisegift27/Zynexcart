<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Shop groceries and everyday essentials on ZynexCart."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>Products — ZynexCart</title>


  <!-- =====================================================
       ZYNEXCART — CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/base.css"
  >

  <link
    rel="stylesheet"
    href="css/header.css"
  >

  <link
    rel="stylesheet"
    href="css/products.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

</head>


<body>


  <!-- =====================================================
       SAME HEADER AS HOME PAGE
       Do not modify the header component.
  ====================================================== -->

  <div id="header-component"></div>



  <!-- =====================================================
       CATEGORY TITLE BAR
       Position is controlled by products.css.
       It must remain directly below the actual header.
  ====================================================== -->

  <div
    class="products-category-bar"
    id="productsCategoryBar"
  >

    <div class="products-category-bar-inner">

      <h1 id="productsPageTitle">
        All Products
      </h1>

    </div>

  </div>



  <!-- =====================================================
       PRODUCTS PAGE
  ====================================================== -->

  <main class="products-page">

    <div class="products-container">


      <!-- =================================================
           MAIN PRODUCT LAYOUT
      ================================================== -->

      <div class="products-layout">


        <!-- =================================================
             LEFT CATEGORY NAVIGATION
        ================================================== -->

        <aside
          class="products-sidebar"
          aria-label="Category navigation"
        >

          <div class="products-sidebar-inner">

            <div class="sidebar-title">
              Shop
            </div>


            <nav
              class="subcategory-nav"
              id="subcategoryNav"
              aria-label="Subcategories"
            >

              <!--
                Category navigation is rendered
                by JavaScript.
              -->

            </nav>

          </div>

        </aside>



        <!-- =================================================
             RIGHT PRODUCT AREA
        ================================================== -->

        <section
          class="products-main"
          aria-label="Products"
        >


          <!-- ===============================================
               SEARCH RESULT INFORMATION
          ================================================ -->

          <div
            id="searchResultInfo"
            class="search-result-info"
            hidden
          >

            <strong id="searchResultText"></strong>

          </div>



          <!-- ===============================================
               PRODUCT GRID
          ================================================ -->

          <div
            class="product-grid"
            id="productsGrid"
          >
            <!-- Products rendered by js/products.js -->
          </div>



          <!-- ===============================================
               EMPTY STATE
          ================================================ -->

          <div
            id="noProducts"
            class="products-empty-state"
            style="display: none;"
            role="status"
            aria-live="polite"
          >

            <div
              class="products-empty-icon"
              aria-hidden="true"
            >
              🛒
            </div>


            <div class="products-empty-content">

              <h2>
                No products found
              </h2>

              <p id="noProductsMessage">
                No products are currently available in this section.
              </p>

            </div>

          </div>


        </section>

      </div>

    </div>

  </main>



  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <div id="footer-component"></div>



  <!-- =====================================================
       ZYNEXCART — PAGE INITIALIZATION
  ====================================================== -->

  <script>

    (function () {

      "use strict";


      if (
        window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__
      ) {

        return;

      }


      window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__ =
        true;



      /* ===================================================
         COMPONENT LOADER
      ==================================================== */

      async function loadComponent(
        elementId,
        filePath
      ) {

        const element =
          document.getElementById(
            elementId
          );


        if (!element) {

          console.warn(
            `ZynexCart: Element #${elementId} not found.`
          );

          return false;

        }


        try {

          const response =
            await fetch(
              filePath,
              {
                cache: "no-cache"
              }
            );


          if (!response.ok) {

            throw new Error(
              `Unable to load ${filePath}`
            );

          }


          element.innerHTML =
            await response.text();


          return true;


        } catch (error) {

          console.error(
            "ZynexCart component error:",
            error
          );


          return false;

        }

      }



      /* ===================================================
         SCRIPT LOADER
      ==================================================== */

      function loadScript(
        src
      ) {

        return new Promise(
          function (resolve, reject) {

            const existingScript =
              document.querySelector(
                `script[data-zynexcart-script="${src}"]`
              );


            if (existingScript) {

              resolve();

              return;

            }


            const script =
              document.createElement(
                "script"
              );


            script.src =
              src;

            script.async =
              false;

            script.dataset.zynexcartScript =
              src;


            script.onload =
              function () {

                resolve();

              };


            script.onerror =
              function () {

                reject(
                  new Error(
                    `Unable to load script: ${src}`
                  )
                );

              };


            document.body.appendChild(
              script
            );

          }
        );

      }



      /* ===================================================
         COMPONENTS
      ==================================================== */

      const components = [

        [
          "header-component",
          "components/header.html"
        ],

        [
          "footer-component",
          "components/footer.html"
        ]

      ];



      /* ===================================================
         JAVASCRIPT MODULES
      ==================================================== */

      const scripts = [

        "js/core/storage.js",
        "js/core/utils.js",
        "js/core/events.js",

        "js/categories.js",

        "js/cart/cart.js",
        "js/cart/cart-actions.js",
        "js/cart/cart-ui.js",

        "js/search/search.js",

        "js/location/location.js",
        "js/location/location-ui.js",
        "js/location/location-search.js",
        "js/location/location-map.js",
        "js/location/location-address.js",
        "js/location/saved-addresses.js",

        "js/app.js",

        "js/products.js"

      ];



      /* ===================================================
         URL PARAMETERS
      ==================================================== */

      function getUrlParams() {

        const params =
          new URLSearchParams(
            window.location.search
          );


        return {

          category:
            (
              params.get("category") ||
              ""
            ).trim(),

          subcategory:
            (
              params.get("subcategory") ||
              ""
            ).trim(),

          search:
            (
              params.get("search") ||
              ""
            ).trim()

        };

      }



      /* ===================================================
         CATEGORY DATA
      ==================================================== */

      function getCategory(
        categoryId
      ) {

        const categories =
          Array.isArray(
            window.ZynexCartCategories
          )
            ? window.ZynexCartCategories
            : [];


        return categories.find(
          function (category) {

            return (
              String(category.id) ===
              String(categoryId)
            );

          }
        ) || null;

      }



      /* ===================================================
         CATEGORY TITLE
      ==================================================== */

      function updateCategoryTitle() {

        const title =
          document.getElementById(
            "productsPageTitle"
          );


        if (!title) {

          return;

        }


        const {
          category,
          subcategory
        } =
          getUrlParams();


        const selectedCategory =
          getCategory(
            category
          );


        if (!selectedCategory) {

          title.textContent =
            "All Products";

          return;

        }


        let displayName =
          selectedCategory.name;


        /*
         * If subcategory information exists
         * in categories.js, use its name.
         *
         * Otherwise keep the main category name.
         */

        if (
          subcategory &&
          Array.isArray(
            selectedCategory.subcategories
          )
        ) {

          const selectedSubcategory =
            selectedCategory.subcategories.find(
              function (item) {

                return (
                  String(item.id) ===
                  String(subcategory)
                );

              }
            );


          if (selectedSubcategory) {

            displayName =
              selectedSubcategory.name;

          }

        }


        title.textContent =
          displayName;

      }



      /* ===================================================
         SUBCATEGORY NAVIGATION
      ==================================================== */

      function renderSubcategoryNavigation() {

        const nav =
          document.getElementById(
            "subcategoryNav"
          );


        if (!nav) {

          return;

        }


        const {
          category,
          subcategory
        } =
          getUrlParams();


        const selectedCategory =
          getCategory(
            category
          );


        nav.innerHTML =
          "";


        /* -----------------------------------------------
           ALL PRODUCTS
        ------------------------------------------------ */

        const allLink =
          document.createElement(
            "a"
          );


        allLink.href =
          category
            ? `products.html?category=${encodeURIComponent(
                category
              )}`
            : "products.html";


        allLink.className =
          "subcategory-item";


        if (!subcategory) {

          allLink.classList.add(
            "active"
          );

        }


        allLink.innerHTML = `

          <span>
            All Products
          </span>

          <span
            class="subcategory-arrow"
            aria-hidden="true"
          >
            ›
          </span>

        `;


        nav.appendChild(
          allLink
        );


        /*
         * If categories.js does not contain
         * subcategories yet, keep All Products.
         */

        if (
          !selectedCategory ||
          !Array.isArray(
            selectedCategory.subcategories
          )
        ) {

          return;

        }


        selectedCategory.subcategories.forEach(
          function (item) {

            const link =
              document.createElement(
                "a"
              );


            link.className =
              "subcategory-item";


            if (
              String(item.id) ===
              String(subcategory)
            ) {

              link.classList.add(
                "active"
              );

            }


            link.href =
              `products.html?category=${encodeURIComponent(
                category
              )}&subcategory=${encodeURIComponent(
                item.id
              )}`;


            link.innerHTML = `

              <span>
                ${item.name}
              </span>

              <span
                class="subcategory-arrow"
                aria-hidden="true"
              >
                ›
              </span>

            `;


            nav.appendChild(
              link
            );

          }
        );

      }



      /* ===================================================
         CATEGORY BAR POSITION
      ==================================================== */

      function setupCategoryBar() {

        const bar =
          document.getElementById(
            "productsCategoryBar"
          );


        /*
         * IMPORTANT:
         *
         * #header-component is only a wrapper.
         *
         * The real header inside it is:
         * #header-component .site-header
         *
         * The existing main header remains untouched.
         */

        const header =
          document.querySelector(
            "#header-component .site-header"
          );


        if (
          !bar ||
          !header
        ) {

          return;

        }


        function updatePosition() {

          const headerHeight =
            header.offsetHeight;


          document.documentElement.style.setProperty(
            "--zynexcart-header-height",
            `${headerHeight}px`
          );

        }


        updatePosition();


        window.addEventListener(
          "resize",
          updatePosition
        );

      }



      /* ===================================================
         PRODUCT COUNT
      ==================================================== */

      function updateProductCount() {

        const grid =
          document.getElementById(
            "productsGrid"
          );


        if (!grid) {

          return;

        }


        const cards =
          grid.querySelectorAll(
            ".product-card"
          );


        const count =
          cards.length;


        if (count === 0) {

          return;

        }

      }



      /* ===================================================
         PRODUCT GRID
      ==================================================== */

      function renderProducts() {

        const grid =
          document.getElementById(
            "productsGrid"
          );


        if (!grid) {

          return;

        }


        const {
          category,
          subcategory,
          search
        } =
          getUrlParams();


        const productAPI =
          window.ZynexCartProducts;


        if (
          !productAPI ||
          !Array.isArray(
            productAPI.products
          )
        ) {

          return;

        }


        let products =
          productAPI.products.slice();



        /* -----------------------------------------------
           CATEGORY FILTER
        ------------------------------------------------ */

        if (category) {

          products =
            products.filter(
              function (product) {

                return (
                  String(
                    product.categoryId || ""
                  ) ===
                  String(category)
                );

              }
            );

        }



        /* -----------------------------------------------
           SUBCATEGORY FILTER
        ------------------------------------------------ */

        if (subcategory) {

          products =
            products.filter(
              function (product) {

                return (
                  String(
                    product.subcategoryId || ""
                  ) ===
                  String(subcategory)
                );

              }
            );

        }



        /* -----------------------------------------------
           SEARCH FILTER
        ------------------------------------------------ */

        if (search) {

          const searchText =
            search.toLowerCase();


          products =
            products.filter(
              function (product) {

                const name =
                  String(
                    product.name || ""
                  ).toLowerCase();


                const categoryName =
                  String(
                    product.category || ""
                  ).toLowerCase();


                const categoryId =
                  String(
                    product.categoryId || ""
                  ).toLowerCase();


                return (
                  name.includes(searchText) ||
                  categoryName.includes(searchText) ||
                  categoryId.includes(searchText)
                );

              }
            );

        }



        /* -----------------------------------------------
           EMPTY STATE
        ------------------------------------------------ */

        const empty =
          document.getElementById(
            "noProducts"
          );


        if (
          products.length === 0
        ) {

          grid.innerHTML =
            "";


          if (empty) {

            empty.style.display =
              "flex";

          }


          return;

        }


        if (empty) {

          empty.style.display =
            "none";

        }



        /* -----------------------------------------------
           PRODUCT CARDS
        ------------------------------------------------ */

        if (
          typeof productAPI
            .createProductCard !==
          "function"
        ) {

          return;

        }


        grid.innerHTML =
          products.map(
            function (product) {

              return productAPI
                .createProductCard(
                  product
                );

            }
          ).join("");


        /*
         * Reconnect existing product/cart controls.
         *
         * This does not replace cart functionality.
         */

        if (
          typeof productAPI
            .setupProductControls ===
          "function"
        ) {

          productAPI
            .setupProductControls();

        }

      }



      /* ===================================================
         SEARCH RESULT
      ==================================================== */

      function updateSearchResult() {

        const {
          search
        } =
          getUrlParams();


        const info =
          document.getElementById(
            "searchResultInfo"
          );


        const text =
          document.getElementById(
            "searchResultText"
          );


        if (!search) {

          if (info) {

            info.hidden =
              true;

          }

          return;

        }


        if (info) {

          info.hidden =
            false;

        }


        if (text) {

          text.textContent =
            `Showing results for "${search}"`;

        }

      }



      /* ===================================================
         INITIALIZE
      ==================================================== */

      async function initializeProductsPage() {

        try {


          /* -----------------------------------------------
             1. LOAD HEADER + FOOTER
          ------------------------------------------------ */

          await Promise.all(

            components.map(
              function (component) {

                return loadComponent(
                  component[0],
                  component[1]
                );

              }
            )

          );


          /* -----------------------------------------------
             2. LOAD JAVASCRIPT MODULES
          ------------------------------------------------ */

          for (
            const scriptPath of scripts
          ) {

            await loadScript(
              scriptPath
            );

          }


          /* -----------------------------------------------
             3. HEADER + CATEGORY BAR
          ------------------------------------------------ */

          setupCategoryBar();


          /* -----------------------------------------------
             4. CATEGORY INFORMATION
          ------------------------------------------------ */

          updateCategoryTitle();

          renderSubcategoryNavigation();


          /* -----------------------------------------------
             5. PRODUCT GRID
          ------------------------------------------------ */

          renderProducts();


          /* -----------------------------------------------
             6. SEARCH RESULT
          ------------------------------------------------ */

          updateSearchResult();


          /* -----------------------------------------------
             7. CART UPDATE
          ------------------------------------------------ */

          document.addEventListener(
            "zynexcart:cartUpdated",
            function () {

              if (
                window.ZynexCartProducts &&
                typeof
                  window.ZynexCartProducts
                    .syncProductButtons ===
                  "function"
              ) {

                window.ZynexCartProducts
                  .syncProductButtons();

              }


              updateProductCount();

            }
          );


          console.log(
            "ZynexCart: Products page loaded successfully."
          );


        } catch (error) {

          console.error(
            "ZynexCart: Products page initialization failed.",
            error
          );

        }

      }



      /* ===================================================
         START
      ==================================================== */

      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          initializeProductsPage,
          {
            once: true
          }
        );

      } else {

        initializeProductsPage();

      }

    })();

  </script>

</body>

</html>
