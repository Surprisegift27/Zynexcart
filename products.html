<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Shop groceries and everyday essentials on ZynexCart."
  >

  <meta
    name="theme-color"
    content="#071b3a"
  >

  <title>Products — ZynexCart</title>


  <!-- =====================================================
       ZYNEXCART — CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/base.css"
  >

  <link
    rel="stylesheet"
    href="css/header.css"
  >

  <link
    rel="stylesheet"
    href="css/products.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

</head>


<body>


  <!-- =====================================================
       SAME HEADER AS HOME PAGE
  ====================================================== -->

  <div id="header-component"></div>



  <!-- =====================================================
       PRODUCTS PAGE
  ====================================================== -->

  <main class="products-page">

    <div class="products-container">


      <!-- =================================================
           BREADCRUMB
      ================================================== -->

      <nav
        class="products-breadcrumb"
        aria-label="Breadcrumb"
      >

        <a href="index.html">
          Home
        </a>

        <span aria-hidden="true">
          ›
        </span>

        <span id="breadcrumbCategory">
          All Products
        </span>

      </nav>



      <!-- =================================================
           PAGE HEADING
      ================================================== -->

      <header class="products-heading">

        <div class="products-heading-content">

          <span class="products-eyebrow">
            SHOP BY CATEGORY
          </span>

          <h1 id="productsPageTitle">
            All Products
          </h1>

          <p id="productsPageDescription">
            Shop your daily essentials at ZynexCart.
          </p>

        </div>


        <div
          class="products-result-count"
          id="productsCount"
        >
          0 products
        </div>

      </header>



      <!-- =================================================
           MAIN PRODUCT LAYOUT
      ================================================== -->

      <div class="products-layout">


        <!-- =================================================
             LEFT SIDEBAR
        ================================================== -->

        <aside
          class="products-sidebar"
          aria-label="Category navigation"
        >

          <div class="products-sidebar-inner">


            <div class="sidebar-title">
              Shop
            </div>


            <nav
              class="subcategory-nav"
              id="subcategoryNav"
              aria-label="Subcategories"
            >

              <!--
                Subcategories rendered by JavaScript
              -->

            </nav>

          </div>

        </aside>



        <!-- =================================================
             RIGHT PRODUCT AREA
        ================================================== -->

        <section
          class="products-main"
          aria-label="Products"
        >


          <!-- ===============================================
               TOOLBAR
          ================================================ -->

          <div class="products-toolbar">

            <div class="products-toolbar-left">

              <h2 id="productsSectionTitle">
                All Products
              </h2>

              <span id="productsSectionDescription">
                Everything you need, delivered fast.
              </span>

            </div>


            <span
              id="productsToolbarCount"
              class="products-toolbar-left"
            >
              0 products
            </span>

          </div>



          <!-- ===============================================
               SEARCH RESULT
          ================================================ -->

          <div
            id="searchResultInfo"
            class="search-result-info"
            hidden
          >

            <strong id="searchResultText"></strong>

          </div>



          <!-- ===============================================
               PRODUCT GRID
          ================================================ -->

          <div
            class="product-grid"
            id="productsGrid"
          >
            <!-- Products rendered by JavaScript -->
          </div>



          <!-- ===============================================
               EMPTY STATE
          ================================================ -->

          <div
            id="noProducts"
            class="products-empty-state"
            style="display: none;"
            role="status"
            aria-live="polite"
          >

            <div
              class="products-empty-icon"
              aria-hidden="true"
            >
              🛒
            </div>


            <div class="products-empty-content">

              <h2>
                No products found
              </h2>

              <p id="noProductsMessage">
                No products are currently available in this section.
              </p>

            </div>

          </div>


        </section>

      </div>

    </div>

  </main>



  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <div id="footer-component"></div>



  <!-- =====================================================
       ZYNEXCART — PAGE INITIALIZATION
  ====================================================== -->

  <script>

    (function () {

      "use strict";


      if (
        window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__
      ) {
        return;
      }


      window.__ZYNEXCART_PRODUCTS_PAGE_INITIALIZED__ =
        true;



      /* ===================================================
         COMPONENT LOADER
      ==================================================== */

      async function loadComponent(
        elementId,
        filePath
      ) {

        const element =
          document.getElementById(
            elementId
          );


        if (!element) {

          console.warn(
            `ZynexCart: Element #${elementId} not found.`
          );

          return false;

        }


        try {

          const response =
            await fetch(
              filePath,
              {
                cache: "no-cache"
              }
            );


          if (!response.ok) {

            throw new Error(
              `Unable to load ${filePath}`
            );

          }


          element.innerHTML =
            await response.text();


          return true;


        } catch (error) {

          console.error(
            "ZynexCart component error:",
            error
          );


          return false;

        }

      }



      /* ===================================================
         SCRIPT LOADER
      ==================================================== */

      function loadScript(
        src
      ) {

        return new Promise(
          function (resolve, reject) {

            const existingScript =
              document.querySelector(
                `script[data-zynexcart-script="${src}"]`
              );


            if (existingScript) {

              resolve();

              return;

            }


            const script =
              document.createElement(
                "script"
              );


            script.src =
              src;

            script.async =
              false;

            script.dataset.zynexcartScript =
              src;


            script.onload =
              function () {

                resolve();

              };


            script.onerror =
              function () {

                reject(
                  new Error(
                    `Unable to load script: ${src}`
                  )
                );

              };


            document.body.appendChild(
              script
            );

          }
        );

      }



      /* ===================================================
         COMPONENTS
      ==================================================== */

      const components = [

        [
          "header-component",
          "components/header.html"
        ],

        [
          "footer-component",
          "components/footer.html"
        ]

      ];



      /* ===================================================
         JAVASCRIPT MODULES
      ==================================================== */

      const scripts = [

        "js/core/storage.js",
        "js/core/utils.js",
        "js/core/events.js",

        "js/categories.js",

        "js/cart/cart.js",
        "js/cart/cart-actions.js",
        "js/cart/cart-ui.js",

        "js/search/search.js",

        "js/location/location.js",
        "js/location/location-ui.js",
        "js/location/location-search.js",
        "js/location/location-map.js",
        "js/location/location-address.js",
        "js/location/saved-addresses.js",

        "js/app.js",

        "js/products.js"

      ];



      /* ===================================================
         URL PARAMETERS
      ==================================================== */

      function getUrlParams() {

        const params =
          new URLSearchParams(
            window.location.search
          );


        return {

          category:
            (
              params.get("category") ||
              ""
            ).trim(),

          subcategory:
            (
              params.get("subcategory") ||
              ""
            ).trim(),

          search:
            (
              params.get("search") ||
              ""
            ).trim()

        };

      }



      /* ===================================================
         CATEGORY DATA
      ==================================================== */

      function getCategory(
        categoryId
      ) {

        const categories =
          Array.isArray(
            window.ZynexCartCategories
          )
            ? window.ZynexCartCategories
            : [];


        return categories.find(
          function (category) {

            return (
              String(category.id) ===
              String(categoryId)
            );

          }
        ) || null;

      }



      /* ===================================================
         GET PRODUCTS
      ==================================================== */

      function getCategoryProducts(
        categoryId
      ) {

        if (!categoryId) {

          return Array.isArray(
            window.products
          )
            ? window.products
            : [];

        }


        const list =
          Array.isArray(
            window.products
          )
            ? window.products
            : [];


        return list.filter(
          function (product) {

            return (
              String(
                product.categoryId || ""
              ) ===
              String(categoryId)
            );

          }
        );

      }



      /* ===================================================
         SUBCATEGORY NAVIGATION
      ==================================================== */

      function renderSubcategoryNavigation() {

        const nav =
          document.getElementById(
            "subcategoryNav"
          );


        if (!nav) {
          return;
        }


        const {
          category,
          subcategory
        } =
          getUrlParams();


        const selectedCategory =
          getCategory(
            category
          );


        nav.innerHTML =
          "";


        /* -----------------------------------------------
           ALL PRODUCTS
        ------------------------------------------------ */

        const allLink =
          document.createElement(
            "a"
          );


        allLink.href =
          category
            ? `products.html?category=${encodeURIComponent(
                category
              )}`
            : "products.html";


        allLink.className =
          "subcategory-item";


        if (!subcategory) {

          allLink.classList.add(
            "active"
          );

        }


        allLink.innerHTML = `

          <span>
            All Products
          </span>

          <span
            class="subcategory-arrow"
            aria-hidden="true"
          >
            ›
          </span>

        `;


        nav.appendChild(
          allLink
        );


        if (
          !selectedCategory ||
          !Array.isArray(
            selectedCategory.subcategories
          )
        ) {

          return;

        }


        selectedCategory.subcategories.forEach(
          function (item) {

            const link =
              document.createElement(
                "a"
              );


            link.className =
              "subcategory-item";


            if (
              String(item.id) ===
              String(subcategory)
            ) {

              link.classList.add(
                "active"
              );

            }


            link.href =
              `products.html?category=${encodeURIComponent(
                category
              )}&subcategory=${encodeURIComponent(
                item.id
              )}`;


            link.innerHTML = `

              <span>
                ${item.name}
              </span>

              <span
                class="subcategory-arrow"
                aria-hidden="true"
              >
                ›
              </span>

            `;


            nav.appendChild(
              link
            );

          }
        );

      }



      /* ===================================================
         PAGE INFORMATION
      ==================================================== */

      function updatePageInformation() {

        const {
          category,
          subcategory
        } =
          getUrlParams();


        const selectedCategory =
          getCategory(
            category
          );


        const title =
          document.getElementById(
            "productsPageTitle"
          );


        const description =
          document.getElementById(
            "productsPageDescription"
          );


        const breadcrumb =
          document.getElementById(
            "breadcrumbCategory"
          );


        const sectionTitle =
          document.getElementById(
            "productsSectionTitle"
          );


        const sectionDescription =
          document.getElementById(
            "productsSectionDescription"
          );


        if (!selectedCategory) {

          if (title) {
            title.textContent =
              "All Products";
          }

          if (description) {
            description.textContent =
              "Shop your daily essentials at ZynexCart.";
          }

          if (breadcrumb) {
            breadcrumb.textContent =
              "All Products";
          }

          if (sectionTitle) {
            sectionTitle.textContent =
              "All Products";
          }

          return;

        }


        let displayName =
          selectedCategory.name;


        if (
          subcategory &&
          Array.isArray(
            selectedCategory.subcategories
          )
        ) {

          const selectedSubcategory =
            selectedCategory.subcategories.find(
              function (item) {

                return (
                  String(item.id) ===
                  String(subcategory)
                );

              }
            );


          if (selectedSubcategory) {

            displayName =
              selectedSubcategory.name;

          }

        }


        if (title) {

          title.textContent =
            displayName;

        }


        if (description) {

          description.textContent =
            selectedCategory.description ||
            "Shop everyday essentials at ZynexCart.";

        }


        if (breadcrumb) {

          breadcrumb.textContent =
            displayName;

        }


        if (sectionTitle) {

          sectionTitle.textContent =
            displayName;

        }


        if (sectionDescription) {

          sectionDescription.textContent =
            "Everything you need, delivered fast.";

        }

      }



      /* ===================================================
         UPDATE PRODUCT COUNT
      ==================================================== */

      function updateProductCount() {

        const grid =
          document.getElementById(
            "productsGrid"
          );


        if (!grid) {
          return;
        }


        const cards =
          grid.querySelectorAll(
            ".product-card"
          );


        const count =
          cards.length;


        const text =
          `${count} ${
            count === 1
              ? "product"
              : "products"
          }`;


        const topCount =
          document.getElementById(
            "productsCount"
          );


        const toolbarCount =
          document.getElementById(
            "productsToolbarCount"
          );


        if (topCount) {

          topCount.textContent =
            text;

        }


        if (toolbarCount) {

          toolbarCount.textContent =
            text;

        }

      }



      /* ===================================================
         APPLY SUBCATEGORY FILTER
      ==================================================== */

      function filterSubcategory() {

        const {
          category,
          subcategory
        } =
          getUrlParams();


        if (
          !category ||
          !subcategory ||
          !Array.isArray(
            window.products
          )
        ) {

          return;

        }


        const filteredProducts =
          window.products.filter(
            function (product) {

              return (
                String(
                  product.categoryId || ""
                ) ===
                String(category)
              ) &&
                String(
                  product.subcategoryId || ""
                ) ===
                String(subcategory);

            }
          );


        const grid =
          document.getElementById(
            "productsGrid"
          );


        const empty =
          document.getElementById(
            "noProducts"
          );


        if (!grid) {
          return;
        }


        /*
         * Subcategory filtering will use the
         * existing product renderer once
         * product data contains subcategoryId.
         *
         * Do not create fake products here.
         */

        if (
          filteredProducts.length === 0
        ) {

          /*
           * Keep the existing category products
           * visible until subcategory mapping
           * is available.
           */

          return;

        }

      }



      /* ===================================================
         INITIALIZE
      ==================================================== */

      async function initializeProductsPage() {

        try {


          /* -----------------------------------------------
             1. LOAD HEADER + FOOTER
          ------------------------------------------------ */

          await Promise.all(

            components.map(
              function (component) {

                return loadComponent(
                  component[0],
                  component[1]
                );

              }
            )

          );


          /* -----------------------------------------------
             2. LOAD JS MODULES
          ------------------------------------------------ */

          for (
            const scriptPath of scripts
          ) {

            await loadScript(
              scriptPath
            );

          }


          /* -----------------------------------------------
             3. PAGE UI
          ------------------------------------------------ */

          updatePageInformation();

          renderSubcategoryNavigation();


          /* -----------------------------------------------
             4. WAIT FOR PRODUCT RENDER
          ------------------------------------------------ */

          setTimeout(
            function () {

              filterSubcategory();

              updateProductCount();

            },
            50
          );


          /* -----------------------------------------------
             5. CART UPDATE
          ------------------------------------------------ */

          document.addEventListener(
            "zynexcart:cartUpdated",
            function () {

              updateProductCount();

            }
          );


          /* -----------------------------------------------
             6. SEARCH RESULT
          ------------------------------------------------ */

          const {
            search
          } =
            getUrlParams();


          if (
            search
          ) {

            const info =
              document.getElementById(
                "searchResultInfo"
              );


            const text =
              document.getElementById(
                "searchResultText"
              );


            if (info) {

              info.hidden =
                false;

            }


            if (text) {

              text.textContent =
                `Showing results for "${search}"`;

            }

          }


          console.log(
            "ZynexCart: Products page loaded successfully."
          );


        } catch (error) {

          console.error(
            "ZynexCart: Products page initialization failed.",
            error
          );

        }

      }



      /* ===================================================
         START
      ==================================================== */

      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          initializeProductsPage,
          {
            once: true
          }
        );

      } else {

        initializeProductsPage();

      }

    })();

  </script>

</body>

</html>
