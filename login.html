<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Login to ZynexCart using your mobile number and OTP."
  >

  <meta
    name="theme-color"
    content="#ff6b00"
  >

  <title>Login | ZynexCart</title>

  <!-- ZynexCart Base Styles -->
  <link rel="stylesheet" href="css/base.css">

  <!-- ZynexCart Main Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- ZynexCart Authentication Styles -->
  <link rel="stylesheet" href="css/auth.css">

  <!-- ZynexCart Responsive Styles -->
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="auth-page">

  <!-- =========================================
       LOGIN PAGE
  ========================================== -->

  <main class="auth-main">

    <section
      class="auth-card"
      aria-label="ZynexCart Login"
    >

      <!-- =====================================
           BRAND
      ====================================== -->

      <div class="auth-brand">
        <a
          href="index.html"
          class="auth-logo-link"
          aria-label="ZynexCart Home"
        >
          <img
            src="assets/logo.png"
            alt="ZynexCart"
            class="auth-logo"
          >
        </a>
      </div>


      <!-- =====================================
           STEP 1 — MOBILE NUMBER
      ====================================== -->

      <div
        id="mobileStep"
        class="auth-step active"
      >

        <div class="auth-heading">
          <h1>Welcome to ZynexCart</h1>

          <p>
            Login or continue with your mobile number
          </p>
        </div>


        <form
          id="mobileLoginForm"
          class="auth-form"
          novalidate
        >

          <div class="phone-field">

            <label
              for="mobileNumber"
              class="sr-only"
            >
              Mobile number
            </label>

            <div class="phone-input-wrap">

              <span
                class="country-code"
                aria-hidden="true"
              >
                +91
              </span>

              <input
                type="tel"
                id="mobileNumber"
                name="mobile"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="10"
                placeholder="Enter mobile number"
                aria-label="Enter mobile number"
                required
              >

            </div>

            <p
              id="mobileError"
              class="auth-error"
              role="alert"
              aria-live="polite"
            ></p>

          </div>


          <button
            type="submit"
            id="continueMobileBtn"
            class="auth-primary-btn"
          >
            Continue
          </button>

        </form>


        <p class="auth-terms">
          By continuing, you agree to our
          <a href="#" id="termsLink">Terms</a>
          &
          <a href="#" id="privacyLink">Privacy Policy</a>
        </p>

      </div>


      <!-- =====================================
           STEP 2 — OTP VERIFICATION
      ====================================== -->

      <div
        id="otpStep"
        class="auth-step"
        hidden
      >

        <button
          type="button"
          id="changeMobileBtn"
          class="auth-back-btn"
          aria-label="Change mobile number"
        >
          <span aria-hidden="true">←</span>
          Change number
        </button>


        <div class="auth-heading">

          <h1>Verify your mobile number</h1>

          <p>
            OTP sent to
            <strong id="otpMobileNumber">
              +91 XXXXX XXXXX
            </strong>
          </p>

        </div>


        <form
          id="otpForm"
          class="auth-form"
          novalidate
        >

          <div
            class="otp-container"
            role="group"
            aria-label="Enter 6 digit OTP"
          >

            <input
              type="tel"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              autocomplete="one-time-code"
              aria-label="OTP digit 1"
            >

            <input
              type="tel"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              aria-label="OTP digit 2"
            >

            <input
              type="tel"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              aria-label="OTP digit 3"
            >

            <input
              type="tel"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              aria-label="OTP digit 4"
            >

            <input
              type="tel"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              aria-label="OTP digit 5"
            >

            <input
              type="tel"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              aria-label="OTP digit 6"
            >

          </div>


          <p
            id="otpError"
            class="auth-error otp-error"
            role="alert"
            aria-live="polite"
          ></p>


          <button
            type="submit"
            id="verifyOtpBtn"
            class="auth-primary-btn"
          >
            Verify &amp; Continue
          </button>

        </form>


        <div class="otp-actions">

          <button
            type="button"
            id="resendOtpBtn"
            class="auth-link-btn"
          >
            Resend OTP
          </button>

          <span
            id="otpTimer"
            class="otp-timer"
            aria-live="polite"
          ></span>

        </div>


        <button
          type="button"
          id="changeMobileLink"
          class="auth-secondary-link"
        >
          Change mobile number
        </button>

      </div>


      <!-- =====================================
           STEP 3 — NEW CUSTOMER NAME
      ====================================== -->

      <div
        id="nameStep"
        class="auth-step"
        hidden
      >

        <div class="auth-heading">

          <h1>Welcome to ZynexCart</h1>

          <p>
            What should we call you?
          </p>

        </div>


        <form
          id="nameForm"
          class="auth-form"
          novalidate
        >

          <div class="name-field">

            <label
              for="customerName"
              class="sr-only"
            >
              Your name
            </label>

            <input
              type="text"
              id="customerName"
              name="name"
              autocomplete="name"
              maxlength="60"
              placeholder="Enter your name"
              aria-label="Enter your name"
              required
            >

            <p
              id="nameError"
              class="auth-error"
              role="alert"
              aria-live="polite"
            ></p>

          </div>


          <button
            type="submit"
            id="continueNameBtn"
            class="auth-primary-btn"
          >
            Continue
          </button>

        </form>

      </div>


      <!-- =====================================
           LOGIN LOADING
      ====================================== -->

      <div
        id="authLoading"
        class="auth-loading"
        hidden
        aria-live="polite"
        aria-label="Loading"
      >

        <div
          class="auth-spinner"
          aria-hidden="true"
        ></div>

        <p>Please wait...</p>

      </div>


      <!-- =====================================
           AUTH MESSAGE
      ====================================== -->

      <div
        id="authMessage"
        class="auth-message"
        hidden
        role="status"
        aria-live="polite"
      ></div>

    </section>

  </main>


  <!-- =========================================
       AUTHENTICATION SCRIPT
  ========================================== -->

  <script src="js/auth.js"></script>

</body>
</html>
