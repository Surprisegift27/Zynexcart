<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="ZynexCart Shopping Cart">

  <title>Cart — ZynexCart</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <div class="container header-inner">

      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="ZynexCart">
      </a>

      <a href="products.html" class="location-btn">
        📍 Shop Products
      </a>

      <form class="search-box" id="searchForm">
        <input
          type="search"
          id="searchInput"
          placeholder="Search products..."
          autocomplete="off"
        >
        <button type="submit">🔍</button>
      </form>

      <nav class="header-actions">

        <a href="login.html" class="account-link">
          👤 Login
        </a>

        <a href="cart.html" class="cart-link">
          🛒 Cart
          <span id="cartCount">0</span>
        </a>

      </nav>

    </div>

  </header>


  <!-- CART -->
  <main class="container cart-page">

    <div class="page-heading">
      <h1>Your Cart 🛒</h1>
      <p>Review your items before checkout.</p>
    </div>

    <div class="cart-layout">

      <!-- CART ITEMS -->
      <section class="cart-items-section">

        <div id="cartItems">
          <!-- Products will appear here -->
        </div>

      </section>


      <!-- CART SUMMARY -->
      <aside class="cart-summary">

        <h2>Order Summary</h2>

        <div class="summary-row">
          <span>Total</span>
          <strong id="cartTotal">₹0</strong>
        </div>

        <button class="btn-primary checkout-btn" type="button">
          Proceed to Checkout
        </button>

        <a href="products.html" class="continue-shopping">
          ← Continue Shopping
        </a>

      </aside>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="container">

      <div class="footer-bottom">
        <p>© 2026 ZynexCart. All rights reserved.</p>
      </div>

    </div>

  </footer>


  <!-- JAVASCRIPT -->
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>

</body>
</html>
