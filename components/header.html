<!-- HEADER -->

<header class="site-header">

  <div class="header-container">

    <!-- LOGO -->
    <a
      href="index.html"
      class="brand"
      aria-label="ZynexCart Home"
    >
      <img
        src="assets/logo.png"
        alt="ZynexCart"
        class="logo"
      >
    </a>

    <!-- LOCATION -->
    <button
      class="location-btn"
      type="button"
      aria-label="Select delivery location"
    >
      <span
        class="location-icon"
        aria-hidden="true"
      >
        📍
      </span>

      <span class="location-text">
        Enter location
      </span>
    </button>

    <!-- SEARCH -->
    <form
      class="search-box"
      id="searchForm"
      role="search"
    >
      <span
        class="search-icon"
        aria-hidden="true"
      >
        🔍
      </span>

      <input
        type="search"
        id="searchInput"
        placeholder="Search for products..."
        autocomplete="off"
        aria-label="Search products"
      >
    </form>

    <!-- CART -->
    <a
      href="cart.html"
      class="cart-link"
      aria-label="Shopping cart"
    >

      <span
        class="cart-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 32 32"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
        >
          <path
            d="M4 5h3l3.2 15.2a2 2 0 0 0 2 1.6h10.9a2 2 0 0 0 1.9-1.4L28 10H8"
            stroke="currentColor"
            stroke-width="2.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <circle
            cx="13"
            cy="27"
            r="1.8"
            fill="currentColor"
          />

          <circle
            cx="24"
            cy="27"
            r="1.8"
            fill="currentColor"
          />
        </svg>
      </span>

      <span class="cart-info">
        <span id="cartItemsText">
          0 items
        </span>

        <span id="cartTotal">
          ₹0
        </span>
      </span>

    </a>

    <!-- LOGIN -->
    <a
      href="login.html"
      class="account-link"
      aria-label="Login to your account"
    >
      <span
        class="account-icon"
        aria-hidden="true"
      >
        👤
      </span>

      <span>
        Login
      </span>
    </a>

  </div>

</header>
