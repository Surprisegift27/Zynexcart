<!-- =====================================================
     ZYNEXCART — HEADER
     Professional Quick-Commerce Header
     ===================================================== -->

<header class="site-header">

  <div class="header-container">

    <!-- LOGO -->
    <a
      href="index.html"
      class="brand"
      aria-label="ZynexCart Home"
    >
      <img
        src="assets/logo.png"
        alt="ZynexCart"
        class="logo"
      >
    </a>


    <!-- LOCATION BUTTON -->
    <button
      class="location-btn"
      id="locationBtn"
      type="button"
      aria-label="Select delivery location"
      aria-haspopup="dialog"
      aria-controls="locationModal"
    >

      <span
        class="location-icon"
        aria-hidden="true"
      >
        📍
      </span>

      <span
        class="location-text"
        id="locationText"
      >
        Enter location
      </span>

    </button>


    <!-- SEARCH -->
    <form
      class="search-box"
      id="searchForm"
      role="search"
    >

      <span
        class="search-icon"
        aria-hidden="true"
      >
        🔍
      </span>

      <input
        type="search"
        id="searchInput"
        placeholder="Search for products..."
        autocomplete="off"
        aria-label="Search products"
      />

    </form>


    <!-- CART -->
    <a
      href="cart.html"
      class="cart-link"
      id="cartLink"
      aria-label="Shopping cart"
    >

      <span
        class="cart-icon"
        aria-hidden="true"
      >

        <svg
          viewBox="0 0 32 32"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
        >

          <path
            d="M4 5h3l3.2 15.2a2 2 0 0 0 2 1.6h10.9a2 2 0 0 0 1.9-1.4L28 10H8"
            stroke="currentColor"
            stroke-width="2.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <circle
            cx="13"
            cy="27"
            r="1.8"
            fill="currentColor"
          />

          <circle
            cx="24"
            cy="27"
            r="1.8"
            fill="currentColor"
          />

        </svg>

      </span>


      <span class="cart-info">

        <!--
          IMPORTANT:
          cartItemsText is kept for the existing UI.
          cartCount is the modular cart quantity value.
        -->
        <span id="cartItemsText">
          <span id="cartCount">0</span> items
        </span>

        <span id="cartTotal">
          ₹0
        </span>

      </span>

    </a>


    <!-- LOGIN -->
    <a
      href="login.html"
      class="account-link"
      aria-label="Login to your account"
    >

      <span
        class="account-icon"
        aria-hidden="true"
      >
        👤
      </span>

      <span>
        Login
      </span>

    </a>

  </div>

</header>


<!-- =====================================================
     ZYNEXCART — LOCATION MODAL
     ===================================================== -->

<div
  class="location-modal"
  id="locationModal"
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-labelledby="locationModalTitle"
>

  <!-- BACKDROP -->
  <div
    class="location-modal-backdrop"
    id="locationModalBackdrop"
  ></div>


  <!-- LOCATION PANEL -->
  <div class="location-modal-panel">


    <!-- MODAL HEADER -->
    <div class="location-modal-header">

      <div class="location-modal-title-wrap">

        <button
          type="button"
          class="location-back-btn"
          id="locationBackBtn"
          aria-label="Back"
          hidden
        >
          ←
        </button>

        <h2 id="locationModalTitle">
          Select Your Location
        </h2>

      </div>


      <button
        type="button"
        class="location-close-btn"
        id="locationCloseBtn"
        aria-label="Close location"
      >
        ×
      </button>

    </div>


    <!-- =================================================
         HOME SCREEN
         ================================================= -->

    <section
      class="location-screen"
      id="locationHomeScreen"
    >

      <!-- LOCATION SEARCH -->
      <div class="location-search-box">

        <span
          class="location-search-icon"
          aria-hidden="true"
        >
          🔍
        </span>

        <input
          type="search"
          id="locationSearchInput"
          placeholder="Search for apartment, street, area..."
          autocomplete="off"
          aria-label="Search delivery location"
        />

      </div>


      <!-- SEARCH RESULTS -->
      <div
        class="location-search-results"
        id="locationSearchResults"
        hidden
      ></div>


      <!-- CURRENT LOCATION -->
      <button
        type="button"
        class="location-action-btn current-location-action"
        id="useCurrentLocationBtn"
      >

        <span
          class="location-action-icon"
          aria-hidden="true"
        >
          📍
        </span>

        <span class="location-action-content">

          <strong>
            Use my current location
          </strong>

          <small>
            Use your device location
          </small>

        </span>

        <span
          class="location-action-arrow"
          aria-hidden="true"
        >
          ›
        </span>

      </button>


      <!-- ADD NEW ADDRESS -->
      <button
        type="button"
        class="location-action-btn"
        id="addNewAddressBtn"
      >

        <span
          class="location-action-icon"
          aria-hidden="true"
        >
          ＋
        </span>

        <span class="location-action-content">

          <strong>
            Add New Address
          </strong>

          <small>
            Set your exact delivery location
          </small>

        </span>

        <span
          class="location-action-arrow"
          aria-hidden="true"
        >
          ›
        </span>

      </button>


      <!-- SAVED ADDRESSES -->
      <section
        class="saved-addresses-section"
        id="savedAddressesSection"
        hidden
        aria-labelledby="savedAddressesTitle"
      >

        <div
          class="location-section-title"
          id="savedAddressesTitle"
        >
          Saved Addresses
        </div>

        <div
          class="saved-addresses-list"
          id="savedAddresses"
          role="list"
          aria-label="Saved delivery addresses"
        ></div>

      </section>

    </section>


    <!-- =================================================
         MAP SCREEN
         ================================================= -->

    <section
      class="location-screen location-map-screen"
      id="locationMapScreen"
      hidden
    >

      <div
        class="location-map-container"
        id="locationMapContainer"
      >

        <div
          class="location-map-placeholder"
          id="locationMapPlaceholder"
        >

          <span
            class="map-placeholder-icon"
            aria-hidden="true"
          >
            🗺️
          </span>

          <strong>
            Set your delivery location
          </strong>

          <small>
            Move the pin to your exact delivery point
          </small>

        </div>


        <div
          class="map-center-pin"
          id="mapCenterPin"
          aria-hidden="true"
        >
          📍
        </div>


        <button
          type="button"
          class="map-current-location-btn"
          id="mapCurrentLocationBtn"
          aria-label="Use current location"
        >
          📍
        </button>

      </div>


      <!-- DETECTED LOCATION -->
      <div
        class="detected-location-card"
        id="detectedLocationCard"
      >

        <div
          class="detected-location-icon"
          aria-hidden="true"
        >
          📍
        </div>

        <div class="detected-location-content">

          <strong
            id="detectedLocationTitle"
            class="detected-location-title"
          >
            Location not selected
          </strong>

          <p
            id="detectedLocationAddress"
            class="detected-location-address"
          >
            Move the pin or search for your address.
          </p>

          <small
            id="detectedLocationAccuracy"
            class="detected-location-accuracy"
          ></small>

        </div>

      </div>


      <button
        type="button"
        class="location-primary-btn"
        id="confirmLocationBtn"
      >
        Confirm Location
      </button>

    </section>


    <!-- =================================================
         ADDRESS DETAILS SCREEN
         ================================================= -->

    <section
      class="location-screen location-address-screen"
      id="locationAddressScreen"
      hidden
    >

      <!-- CONFIRMED LOCATION -->
      <div
        class="confirmed-location-box"
        id="confirmedLocationBox"
      >

        <span
          class="confirmed-location-icon"
          aria-hidden="true"
        >
          📍
        </span>

        <div>

          <strong>
            Location confirmed
          </strong>

          <p
            id="confirmedLocationAddress"
            class="confirmed-location-address"
          >
            Your selected location
          </p>

        </div>

      </div>


      <!-- ADDRESS FORM -->
      <form
        class="delivery-address-form"
        id="deliveryAddressForm"
      >

        <div class="address-field">

          <label for="addressHouse">
            House / Flat / Shop No.
          </label>

          <input
            type="text"
            id="addressHouse"
            name="house"
            placeholder="e.g. Flat 204, Shop 12"
            autocomplete="address-line1"
            required
          />

        </div>


        <div class="address-field">

          <label for="addressBuilding">
            Building / Society
          </label>

          <input
            type="text"
            id="addressBuilding"
            name="building"
            placeholder="e.g. Sunshine Apartments"
            autocomplete="address-line2"
          />

        </div>


        <div class="address-field">

          <label for="addressArea">
            Area / Road
          </label>

          <input
            type="text"
            id="addressArea"
            name="area"
            placeholder="e.g. Warden Road"
            autocomplete="street-address"
            required
          />

        </div>


        <div class="address-field">

          <label for="addressCity">
            City
          </label>

          <input
            type="text"
            id="addressCity"
            name="city"
            placeholder="e.g. Mumbai"
            autocomplete="address-level2"
          />

        </div>


        <div class="address-field">

          <label for="addressState">
            State
          </label>

          <input
            type="text"
            id="addressState"
            name="state"
            placeholder="e.g. Maharashtra"
            autocomplete="address-level1"
          />

        </div>


        <div class="address-field">

          <label for="addressLandmark">
            Landmark
            <span>(Optional)</span>
          </label>

          <input
            type="text"
            id="addressLandmark"
            name="landmark"
            placeholder="e.g. Near XYZ Mall"
          />

        </div>


        <div class="address-field">

          <label for="addressPincode">
            Pincode
          </label>

          <input
            type="text"
            id="addressPincode"
            name="pincode"
            placeholder="e.g. 400026"
            inputmode="numeric"
            maxlength="6"
            autocomplete="postal-code"
            required
          />

        </div>


        <!-- ADDRESS TYPE -->
        <fieldset class="address-type-field">

          <legend>
            Save address as
          </legend>

          <div class="address-type-options">

            <label class="address-type-option">

              <input
                type="radio"
                name="addressType"
                value="Home"
                checked
              />

              <span>
                🏠 Home
              </span>

            </label>


            <label class="address-type-option">

              <input
                type="radio"
                name="addressType"
                value="Work"
              />

              <span>
                💼 Work
              </span>

            </label>


            <label class="address-type-option">

              <input
                type="radio"
                name="addressType"
                value="Other"
              />

              <span>
                📍 Other
              </span>

            </label>

          </div>

        </fieldset>


        <!-- DELIVERY INSTRUCTIONS -->
        <div class="address-field">

          <label for="deliveryInstructions">
            Delivery Instructions
            <span>(Optional)</span>
          </label>

          <textarea
            id="deliveryInstructions"
            name="deliveryInstructions"
            rows="3"
            placeholder="e.g. Call when you reach the gate"
          ></textarea>

        </div>


        <!-- SAVE ADDRESS -->
        <button
          type="submit"
          class="location-primary-btn"
          id="saveAddressBtn"
        >
          Save Address
        </button>

      </form>

    </section>

  </div>

</div>
