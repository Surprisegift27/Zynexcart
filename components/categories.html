<section class="categories-section" id="categoriesSection">
  <div class="categories-container">

    <div class="section-heading">
      <h2>Shop by Category</h2>
      <p>Everything you need, delivered fast.</p>
    </div>

    <div
      class="categories-grid"
      id="categoriesGrid"
      aria-label="Product categories"
    ></div>

  </div>
</section>

<script>
(function () {
  "use strict";

  const categoriesGrid =
    document.getElementById("categoriesGrid");

  if (!categoriesGrid) return;

  const categories =
    window.ZynexCartCategories || [];

  if (!categories.length) {
    console.error(
      "ZynexCart: Category data not found. Make sure js/categories.js is loaded."
    );
    return;
  }

  categoriesGrid.innerHTML = categories
    .map(function (category) {
      return `
        <a
          href="products.html?category=${encodeURIComponent(category.id)}"
          class="category-card"
          data-category="${category.id}"
        >
          <div class="category-image">
            <img
              src="${category.image}"
              alt="${category.name}"
              loading="lazy"
            >
          </div>

          <div class="category-content">
            <h3>${category.name}</h3>
            <p>${category.description}</p>
          </div>
        </a>
      `;
    })
    .join("");
})();
</script>
